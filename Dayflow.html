<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            background: #f4f5f7;
            color: #1e293b;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        .dark body {
            background: #0f1115;
            color: #f8fafc;
        }

        /* Liquid Glass Core */
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 4px 24px -1px rgba(0, 0, 0, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }

        .glass-heavy {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }

        .dark .glass {
            background: rgba(30, 32, 40, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 4px 24px -1px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .dark .glass-heavy {
            background: rgba(20, 22, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Micro-interactions */
        .spring-transition {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        
        .fade-slide-enter {
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* Animated Aurora Background */
        .aurora-bg {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(129, 140, 248, 0.1) 0%, transparent 40%);
            animation: rotate 60s linear infinite;
            z-index: -1;
            pointer-events: none;
        }
        .dark .aurora-bg {
            background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="aurora-bg"></div>
    <div id="app-root"></div>
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // Mock Data
        const mockUsers = [
            { id: 'EMP001', email: 'admin@dayflow.com', password: 'password', role: 'admin', name: 'Sarah Connor', designation: 'HR Director', department: 'Human Resources', joiningDate: '2022-01-15', avatar: 'https://i.pravatar.cc/150?u=admin', phone: '+1 555-0100', address: '123 Tech Lane, SF', salary: { base: 120000, hra: 24000, deductions: 5000 } },
            { id: 'EMP002', email: 'john@dayflow.com', password: 'password', role: 'employee', name: 'John Smith', designation: 'Senior Developer', department: 'Engineering', joiningDate: '2023-03-01', avatar: 'https://i.pravatar.cc/150?u=john', phone: '+1 555-0101', address: '456 Code Blvd, NY', salary: { base: 95000, hra: 15000, deductions: 4000 } },
            { id: 'EMP003', email: 'emma@dayflow.com', password: 'password', role: 'employee', name: 'Emma Davis', designation: 'Product Designer', department: 'Design', joiningDate: '2023-06-15', avatar: 'https://i.pravatar.cc/150?u=emma', phone: '+1 555-0102', address: '789 Pixel St, Austin', salary: { base: 85000, hra: 12000, deductions: 3500 } }
        ];

        const mockAttendance = [
            { date: '2026-08-21', status: 'Present', checkIn: '08:55 AM', checkOut: '05:10 PM', user: 'EMP002' },
            { date: '2026-08-20', status: 'Present', checkIn: '09:05 AM', checkOut: '05:00 PM', user: 'EMP002' }
        ];

        let mockLeaves = [
            { id: 'L1', user: 'EMP002', name: 'John Smith', type: 'Sick', from: '2026-08-19', to: '2026-08-19', status: 'Approved', reason: 'Fever and cold.' },
            { id: 'L2', user: 'EMP003', name: 'Emma Davis', type: 'Paid', from: '2026-09-01', to: '2026-09-05', status: 'Pending', reason: 'Family vacation.' },
        ];

        // Global State Management
        window.Dayflow = {
            state: {
                user: null,
                theme: 'light',
                route: 'landing',
                sidebarOpen: true,
                isEditingProfile: false,
                authMode: 'signin' // 'signin' or 'signup'
            },
            
            // Actions
            navigate: function(route) {
                this.state.route = route;
                this.state.isEditingProfile = false;
                renderApp();
            },
            
            toggleTheme: function() {
                this.state.theme = this.state.theme === 'light' ? 'dark' : 'light';
                document.documentElement.className = this.state.theme;
                renderApp();
            },
            
            toggleSidebar: function() {
                this.state.sidebarOpen = !this.state.sidebarOpen;
                renderApp();
            },

            addToast: function(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const id = 'toast-' + Date.now();
                const icon = type === 'success' ? 'check-circle' : 'alert-circle';
                const color = type === 'success' ? 'text-emerald-500' : 'text-blue-500';
                
                const toastHTML = `
                    <div id="${id}" class="glass-heavy px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 fade-slide-enter transition-opacity duration-300">
                        <i data-lucide="${icon}" class="${color} w-5 h-5"></i>
                        <span class="text-sm font-medium">${message}</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', toastHTML);
                lucide.createIcons();
                
                setTimeout(() => {
                    const el = document.getElementById(id);
                    if(el) {
                        el.style.opacity = '0';
                        setTimeout(() => el.remove(), 300);
                    }
                }, 3000);
            },

            // Auth Actions
            handleAuthSubmit: function(event) {
                event.preventDefault();
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-password').value;
                const errorEl = document.getElementById('auth-error');
                
                if (this.state.authMode === 'signin') {
                    const u = mockUsers.find(u => u.email === email && u.password === password);
                    if (u) {
                        this.state.user = u;
                        this.navigate('dashboard');
                        this.addToast('Welcome back, ' + u.name, 'success');
                    } else {
                        errorEl.innerHTML = `<div class="bg-red-500/10 border border-red-500/20 text-red-500 text-sm p-3 rounded-xl flex items-center gap-2 mb-4"><i data-lucide="alert-circle" class="w-4 h-4"></i> Invalid credentials. Try admin@dayflow.com / password</div>`;
                        lucide.createIcons();
                    }
                } else {
                    // Mock signup - just log them in as admin for demo purposes
                    const u = mockUsers[0];
                    this.state.user = u;
                    this.navigate('dashboard');
                    this.addToast('Account created successfully', 'success');
                }
            },
            
            logout: function() {
                this.state.user = null;
                this.navigate('landing');
            },

            // Leave Actions
            handleLeaveSubmit: function(event) {
                event.preventDefault();
                const type = document.getElementById('leave-type').value;
                const from = document.getElementById('leave-from').value;
                const to = document.getElementById('leave-to').value;
                const reason = document.getElementById('leave-reason').value;

                mockLeaves.push({
                    id: 'L' + Date.now(),
                    user: this.state.user.id,
                    name: this.state.user.name,
                    type, from, to, reason,
                    status: 'Pending'
                });

                this.closeModal('leave-modal');
                this.addToast('Leave request submitted successfully', 'success');
                renderApp();
            },

            updateLeaveStatus: function(id, status) {
                const leave = mockLeaves.find(l => l.id === id);
                if(leave) {
                    leave.status = status;
                    this.addToast(`Leave request ${status}`, status === 'Approved' ? 'success' : 'info');
                    renderApp();
                }
            },

            // Profile Actions
            toggleProfileEdit: function() {
                this.state.isEditingProfile = !this.state.isEditingProfile;
                renderApp();
            },

            saveProfile: function() {
                this.state.user.name = document.getElementById('prof-name').value;
                this.state.user.phone = document.getElementById('prof-phone').value;
                this.state.user.address = document.getElementById('prof-address').value;
                this.state.isEditingProfile = false;
                this.addToast('Profile updated successfully', 'success');
                renderApp();
            },

            // UI Helpers
            openModal: function(id) {
                document.getElementById(id).classList.remove('hidden');
                document.getElementById(id).classList.add('flex');
            },
            closeModal: function(id) {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            },
            setAuthMode: function(mode) {
                this.state.authMode = mode;
                renderApp();
            }
        };

        const UI = {
            Button: (text, variant = 'primary', onclick = '', type = 'button', extraClasses = '') => {
                const base = "relative px-6 py-3 rounded-2xl font-medium tracking-tight spring-transition flex items-center justify-center gap-2 overflow-hidden active:scale-95 disabled:opacity-50";
                const variants = {
                    primary: "bg-gradient-to-r from-blue-500 to-cyan-400 text-white shadow-lg shadow-blue-500/30 hover:shadow-cyan-500/40 border border-white/20",
                    secondary: "glass text-slate-800 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-slate-800/60",
                    danger: "bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20 hover:bg-red-500/20",
                    ghost: "bg-transparent text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                };
                return `<button type="${type}" onclick="${onclick}" class="${base} ${variants[variant]} ${extraClasses}">${text}</button>`;
            },
            
            StatusBadge: (status) => {
                const colors = {
                    'Present': 'bg-emerald-500/10 text-emerald-600 border-emerald-500/20',
                    'Absent': 'bg-rose-500/10 text-rose-600 border-rose-500/20',
                    'Leave': 'bg-amber-500/10 text-amber-600 border-amber-500/20',
                    'Approved': 'bg-emerald-500/10 text-emerald-600 border-emerald-500/20',
                    'Pending': 'bg-amber-500/10 text-amber-600 border-amber-500/20',
                    'Rejected': 'bg-rose-500/10 text-rose-600 border-rose-500/20',
                    'admin': 'bg-indigo-500/10 text-indigo-600 border-indigo-500/20',
                    'employee': 'bg-slate-500/10 text-slate-600 dark:text-slate-300 border-slate-500/20'
                };
                const colorClass = colors[status] || colors['employee'];
                return `<span class="px-3 py-1 rounded-full text-xs font-medium border ${colorClass}">${status}</span>`;
            }
        };

        const Views = {
            Landing: () => `
                <div class="min-h-screen flex flex-col items-center justify-center relative p-6">
                    <div class="max-w-4xl w-full text-center fade-slide-enter space-y-8 z-10">
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">
                            Every workday, <br />
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-cyan-400">perfectly aligned.</span>
                        </h1>
                        <p class="text-lg md:text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">
                            A spatial, liquid-glass experience designed to make human resource management feel less like work and more like magic.
                        </p>
                        <div class="flex flex-col sm:flex-row gap-4 justify-center pt-8">
                            ${UI.Button('Sign In', 'primary', "Dayflow.setAuthMode('signin'); Dayflow.navigate('auth')", 'button', 'px-8 py-4 text-lg')}
                            ${UI.Button('New User? Sign Up', 'secondary', "Dayflow.setAuthMode('signup'); Dayflow.navigate('auth')", 'button', 'px-8 py-4 text-lg')}
                        </div>
                    </div>
                </div>
            `,

            Auth: () => {
                const isLogin = Dayflow.state.authMode === 'signin';
                const title = isLogin ? 'Welcome Back' : 'Create Account';
                const submitText = isLogin ? 'Sign In to Workspace' : 'Create Account';
                const toggleText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Sign In";
                const toggleAction = isLogin ? "Dayflow.setAuthMode('signup')" : "Dayflow.setAuthMode('signin')";

                return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="glass w-full max-w-md p-8 rounded-3xl fade-slide-enter">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-xl shadow-cyan-500/20">
                                <i data-lucide="briefcase" class="text-white w-8 h-8"></i>
                            </div>
                            <h2 class="text-3xl font-bold tracking-tight">${title}</h2>
                            <p class="text-slate-500 mt-2">Enter your details to proceed.</p>
                        </div>
                        <form onsubmit="Dayflow.handleAuthSubmit(event)" class="space-y-4">
                            <div id="auth-error"></div>
                            <div class="flex flex-col gap-1.5 mb-4 relative">
                                <label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Email Address</label>
                                <div class="relative">
                                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                    <input id="auth-email" type="email" value="${isLogin ? 'admin@dayflow.com' : ''}" required class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 dark:border-slate-600/30 rounded-2xl py-3 px-4 pl-11 outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-800 dark:text-slate-100 shadow-inner backdrop-blur-md" placeholder="name@company.com" />
                                </div>
                            </div>
                            <div class="flex flex-col gap-1.5 mb-4 relative">
                                <label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Password</label>
                                <div class="relative">
                                    <i data-lucide="shield" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                    <input id="auth-password" type="password" value="${isLogin ? 'password' : ''}" required class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 dark:border-slate-600/30 rounded-2xl py-3 px-4 pl-11 outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-800 dark:text-slate-100 shadow-inner backdrop-blur-md" placeholder="••••••••" />
                                </div>
                            </div>
                            ${UI.Button(submitText, 'primary', '', 'submit', 'w-full py-4 text-lg mt-6')}
                        </form>
                        <div class="mt-6 text-center text-sm">
                            <button onclick="${toggleAction}" class="text-blue-500 hover:text-cyan-500 font-medium">${toggleText}</button>
                        </div>
                    </div>
                </div>
                `;
            },

            DashboardLayout: (content) => {
                const user = Dayflow.state.user;
                const themeIcon = Dayflow.state.theme === 'light' ? 'moon' : 'sun';
                
                let navItems = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'home' },
                    { id: 'profile', label: 'My Profile', icon: 'user' },
                    { id: 'attendance', label: 'Attendance', icon: 'clock' },
                    { id: 'leaves', label: 'Leave Requests', icon: 'calendar' },
                    { id: 'payroll', label: 'Payroll', icon: 'file-text' }
                ];
                
                if (user.role === 'admin') {
                    navItems.push(
                        { id: 'employees', label: 'Directory', icon: 'users' },
                        { id: 'reports', label: 'Reports', icon: 'pie-chart' }
                    );
                }

                const sidebarContent = navItems.map(item => {
                    const active = Dayflow.state.route === item.id;
                    const activeClasses = active ? 'bg-white/60 dark:bg-white/10 shadow-sm text-blue-600 dark:text-cyan-400' : 'text-slate-600 dark:text-slate-400 hover:bg-white/30 dark:hover:bg-white/5';
                    const iconColor = active ? 'text-blue-500 dark:text-cyan-400' : '';
                    return `
                        <button onclick="Dayflow.navigate('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-medium text-sm spring-transition ${activeClasses}">
                            <i data-lucide="${item.icon}" class="${iconColor} w-4 h-4"></i>
                            ${item.label}
                            ${active ? '<i data-lucide="chevron-right" class="ml-auto opacity-50 w-4 h-4"></i>' : ''}
                        </button>
                    `;
                }).join('');

                return `
                <div class="min-h-screen flex relative overflow-hidden">
                    <!-- Sidebar -->
                    <aside class="w-64 glass m-4 rounded-3xl h-[calc(100vh-32px)] flex-col p-4 fixed hidden lg:flex z-50">
                        <div class="flex items-center gap-3 px-4 py-4 mb-6">
                            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg">
                                <i data-lucide="briefcase" class="text-white w-5 h-5"></i>
                            </div>
                            <span class="font-bold text-xl tracking-tight">Dayflow</span>
                        </div>
                        <nav class="flex-1 space-y-2">${sidebarContent}</nav>
                        <div class="p-4 glass rounded-2xl mt-auto">
                            <div class="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">System Status</div>
                            <div class="flex items-center gap-2 text-sm text-emerald-500 font-medium">
                                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> All systems operational
                            </div>
                        </div>
                    </aside>

                    <!-- Main Content Wrapper -->
                    <div class="flex-1 flex flex-col transition-all duration-300 lg:ml-[280px]">
                        <!-- Topbar -->
                        <header class="h-20 glass sticky top-0 z-40 px-6 flex items-center justify-between m-4 rounded-3xl border border-white/20">
                            <div class="flex items-center gap-4">
                                <h1 class="text-xl font-bold hidden md:block">Dayflow</h1>
                            </div>
                            <div class="flex items-center gap-4">
                                <button onclick="Dayflow.toggleTheme()" class="p-2 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-700/50 spring-transition">
                                    <i data-lucide="${themeIcon}" class="w-5 h-5"></i>
                                </button>
                                <button class="p-2 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-700/50 relative spring-transition">
                                    <i data-lucide="bell" class="w-5 h-5"></i>
                                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white dark:border-slate-900"></span>
                                </button>
                                <div class="relative group cursor-pointer">
                                    <button class="flex items-center gap-2 pl-2 pr-1 py-1 rounded-full glass hover:bg-white/60 dark:hover:bg-slate-800/60 spring-transition">
                                        <img src="${user.avatar}" class="w-8 h-8 rounded-full border-2 border-white/50" />
                                        <i data-lucide="chevron-down" class="text-slate-500 mr-2 w-4 h-4"></i>
                                    </button>
                                    <div class="absolute right-0 mt-2 w-48 glass-heavy rounded-2xl shadow-xl py-2 opacity-0 group-hover:opacity-100 pointer-events-none group-hover:pointer-events-auto transition-opacity duration-200">
                                        <div class="px-4 py-2 border-b border-white/10 mb-2">
                                            <p class="text-sm font-semibold">${user.name}</p>
                                            <p class="text-xs text-slate-500 capitalize">${user.role}</p>
                                        </div>
                                        <button class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100/50 dark:hover:bg-slate-700/50 flex items-center gap-2 text-red-500" onclick="Dayflow.logout()">
                                            <i data-lucide="log-out" class="w-4 h-4"></i> Sign Out
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <!-- Main Scroll Area -->
                        <main class="flex-1 p-6 overflow-y-auto">
                            <div class="max-w-7xl mx-auto pb-20">
                                ${content}
                            </div>
                        </main>
                    </div>
                </div>
                `;
            },

            EmployeeDashboard: () => {
                const user = Dayflow.state.user;
                return `
                <div class="fade-slide-enter space-y-6">
                    <div class="flex flex-col md:flex-row gap-6 justify-between items-start md:items-center mb-8">
                        <div>
                            <h2 class="text-3xl font-bold">Good morning, ${user.name.split(' ')[0]}</h2>
                            <p class="text-slate-500">Here's your work overview for today.</p>
                        </div>
                        <div class="glass px-6 py-3 rounded-full flex items-center gap-3 shadow-sm">
                            <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                            <span class="font-medium">Checked In at 08:55 AM</span>
                            ${UI.Button('Check Out', 'secondary', '', 'button', 'py-1 px-3 text-xs ml-2')}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass rounded-3xl p-6 col-span-1 md:col-span-2 flex flex-col justify-center bg-gradient-to-br from-blue-500/5 to-cyan-500/10 hover:-translate-y-1 hover:shadow-2xl spring-transition">
                            <h3 class="text-lg font-semibold mb-4 flex items-center gap-2"><i data-lucide="trending-up" class="text-blue-500 w-5 h-5"></i> Weekly Activity</h3>
                            <div class="flex items-end gap-2 h-40 pt-4">
                                ${[60, 80, 100, 40, 90].map(h => `
                                    <div class="flex-1 bg-blue-500/20 rounded-t-lg relative group spring-transition hover:bg-blue-500/40" style="height: ${h}%"></div>
                                `).join('')}
                            </div>
                            <div class="flex justify-between text-xs text-slate-500 mt-2 px-2">
                                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
                            </div>
                        </div>

                        <div class="glass rounded-3xl p-6 flex flex-col items-center justify-center hover:-translate-y-1 hover:shadow-2xl spring-transition">
                            <h3 class="text-lg font-semibold mb-6">Leave Balance</h3>
                            <div class="relative w-32 h-32 flex items-center justify-center">
                                <svg viewBox="0 0 36 36" class="w-full h-full transform -rotate-90">
                                    <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" class="text-slate-200 dark:text-slate-700" />
                                    <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="25 100" class="text-cyan-500" />
                                </svg>
                                <div class="absolute text-center">
                                    <div class="text-2xl font-bold">15</div>
                                    <div class="text-xs text-slate-500">Days Left</div>
                                </div>
                            </div>
                            ${UI.Button('<i data-lucide="calendar" class="w-4 h-4"></i> Apply Leave', 'ghost', "Dayflow.navigate('leaves')", 'button', 'mt-4 text-sm')}
                        </div>
                    </div>
                </div>`;
            },

            AdminDashboard: () => {
                const kpis = [
                    { label: 'Total Employees', value: mockUsers.length, icon: 'users', color: 'text-blue-500', bg: 'bg-blue-500/10' },
                    { label: 'Present Today', value: '24', icon: 'check-circle', color: 'text-emerald-500', bg: 'bg-emerald-500/10' },
                    { label: 'Pending Leaves', value: mockLeaves.filter(l=>l.status==='Pending').length, icon: 'calendar', color: 'text-amber-500', bg: 'bg-amber-500/10', alert: true },
                    { label: 'Payroll Status', value: 'Ready', icon: 'file-text', color: 'text-purple-500', bg: 'bg-purple-500/10' },
                ];

                return `
                <div class="fade-slide-enter space-y-6">
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold">HR Overview</h2>
                        <p class="text-slate-500">Company-wide metrics and pending actions.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        ${kpis.map(kpi => `
                            <div class="glass rounded-3xl p-6 relative overflow-hidden hover:-translate-y-1 hover:shadow-2xl spring-transition">
                                ${kpi.alert ? '<div class="absolute top-0 right-0 w-16 h-16 bg-amber-500/20 blur-2xl rounded-full -mr-8 -mt-8"></div>' : ''}
                                <div class="flex justify-between items-start mb-4">
                                    <div class="p-2 rounded-xl ${kpi.bg}"><i data-lucide="${kpi.icon}" class="${kpi.color} w-5 h-5"></i></div>
                                </div>
                                <div class="text-3xl font-bold mb-1">${kpi.value}</div>
                                <div class="text-sm font-medium text-slate-600 dark:text-slate-400">${kpi.label}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-8">
                        <div class="glass rounded-3xl p-6 lg:col-span-2">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xl font-bold">Recent Leave Requests</h3>
                                ${UI.Button('View All', 'ghost', "Dayflow.navigate('leaves')", 'button', 'text-sm')}
                            </div>
                            <div class="space-y-3">
                                ${mockLeaves.slice(0,3).map(leave => `
                                    <div class="flex items-center justify-between p-3 rounded-2xl hover:bg-white/40 dark:hover:bg-white/5 spring-transition">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold">${leave.name.charAt(0)}</div>
                                            <div>
                                                <div class="font-medium">${leave.name}</div>
                                                <div class="text-xs text-slate-500">${leave.type} &bull; ${leave.from}</div>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            ${UI.StatusBadge(leave.status)}
                                            ${leave.status === 'Pending' ? `
                                                <div class="flex gap-1">
                                                    <button class="p-1.5 rounded-lg bg-emerald-500/10 text-emerald-600 hover:bg-emerald-500/20" onclick="Dayflow.updateLeaveStatus('${leave.id}', 'Approved')"><i data-lucide="check-circle" class="w-4 h-4"></i></button>
                                                    <button class="p-1.5 rounded-lg bg-rose-500/10 text-rose-600 hover:bg-rose-500/20" onclick="Dayflow.updateLeaveStatus('${leave.id}', 'Rejected')"><i data-lucide="x" class="w-4 h-4"></i></button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="glass rounded-3xl p-6">
                            <h3 class="text-xl font-bold mb-6">Department Headcount</h3>
                            <div class="space-y-4">
                                ${[
                                    { dept: 'Engineering', count: 12, color: 'bg-blue-500' },
                                    { dept: 'Design', count: 5, color: 'bg-purple-500' },
                                    { dept: 'HR & Admin', count: 3, color: 'bg-cyan-500' },
                                    { dept: 'Sales', count: 8, color: 'bg-emerald-500' },
                                ].map(d => `
                                    <div>
                                        <div class="flex justify-between text-sm mb-1 font-medium"><span>${d.dept}</span><span>${d.count}</span></div>
                                        <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full ${d.color} rounded-full" style="width: ${(d.count/28)*100}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            Profile: () => {
                const user = Dayflow.state.user;
                const isEditing = Dayflow.state.isEditingProfile;
                
                const InputField = (id, label, value, disabled) => `
                    <div class="flex flex-col gap-1.5 mb-4">
                        <label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">${label}</label>
                        <input id="${id}" type="text" value="${value}" ${disabled ? 'disabled' : ''} 
                            class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 dark:border-slate-600/30 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-800 dark:text-slate-100 shadow-inner backdrop-blur-md disabled:opacity-50 disabled:cursor-not-allowed" />
                    </div>
                `;

                return `
                <div class="fade-slide-enter max-w-4xl mx-auto">
                    <div class="relative mb-20">
                        <div class="h-48 rounded-3xl bg-gradient-to-r from-blue-500/40 to-purple-500/40 backdrop-blur-3xl overflow-hidden">
                            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-white/20 via-transparent to-transparent"></div>
                        </div>
                        <div class="absolute -bottom-12 left-8 flex items-end gap-6">
                            <div class="relative group cursor-pointer">
                                <img src="${user.avatar}" class="w-28 h-28 rounded-full border-4 border-white dark:border-slate-900 shadow-xl object-cover bg-white" alt="Profile" />
                                ${isEditing ? `
                                <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 spring-transition">
                                    <i data-lucide="upload" class="text-white w-6 h-6"></i>
                                </div>
                                ` : ''}
                            </div>
                            <div class="mb-2">
                                <h1 class="text-3xl font-bold">${user.name}</h1>
                                <p class="text-slate-500 font-medium">${user.designation} &bull; ${user.department}</p>
                            </div>
                        </div>
                        <div class="absolute -bottom-10 right-8">
                            ${isEditing 
                                ? UI.Button('Save Changes', 'primary', 'Dayflow.saveProfile()') 
                                : UI.Button('Edit Profile', 'secondary', 'Dayflow.toggleProfileEdit()')}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-16">
                        <div class="glass rounded-3xl p-6">
                            <h3 class="text-lg font-semibold mb-4 border-b border-white/20 pb-2">Personal Details</h3>
                            <div class="space-y-4">
                                ${InputField('prof-name', 'Full Name', user.name, !isEditing)}
                                ${InputField('prof-email', 'Email Address', user.email, true)}
                                ${InputField('prof-phone', 'Phone Number', user.phone, !isEditing)}
                                ${InputField('prof-address', 'Address', user.address, !isEditing)}
                            </div>
                        </div>
                        <div class="glass rounded-3xl p-6">
                            <h3 class="text-lg font-semibold mb-4 border-b border-white/20 pb-2">Job Information</h3>
                            <div class="space-y-4">
                                <div class="flex justify-between py-2 border-b border-white/10">
                                    <span class="text-slate-500">Employee ID</span><span class="font-medium">${user.id}</span>
                                </div>
                                <div class="flex justify-between py-2 border-b border-white/10">
                                    <span class="text-slate-500">Joining Date</span><span class="font-medium">${user.joiningDate}</span>
                                </div>
                                <div class="flex justify-between py-2 border-b border-white/10">
                                    <span class="text-slate-500">Role</span>${UI.StatusBadge(user.role)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            Leaves: () => {
                const user = Dayflow.state.user;
                const isHR = user.role === 'admin';
                const displayLeaves = isHR ? mockLeaves : mockLeaves.filter(l => l.user === user.id);

                return `
                <div class="fade-slide-enter space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-bold">Leave Management</h2>
                            <p class="text-slate-500">${isHR ? 'Manage company-wide requests.' : 'Track and apply for time off.'}</p>
                        </div>
                        ${!isHR ? UI.Button('<i data-lucide="plus" class="w-4 h-4"></i> Apply Leave', 'primary', "Dayflow.openModal('leave-modal')") : ''}
                    </div>

                    <div class="glass rounded-3xl p-0 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-white/20 dark:bg-black/20 border-b border-white/10 text-sm">
                                        ${isHR ? '<th class="p-4 font-semibold text-slate-600 dark:text-slate-300">Employee</th>' : ''}
                                        <th class="p-4 font-semibold text-slate-600 dark:text-slate-300">Type</th>
                                        <th class="p-4 font-semibold text-slate-600 dark:text-slate-300">Dates</th>
                                        <th class="p-4 font-semibold text-slate-600 dark:text-slate-300">Reason</th>
                                        <th class="p-4 font-semibold text-slate-600 dark:text-slate-300">Status</th>
                                        ${isHR ? '<th class="p-4 font-semibold text-slate-600 dark:text-slate-300">Actions</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${displayLeaves.length === 0 ? '<tr><td colspan="6" class="p-8 text-center text-slate-500">No leave records found.</td></tr>' : ''}
                                    ${displayLeaves.map((leave, i) => `
                                        <tr class="border-b border-white/5 hover:bg-white/10 dark:hover:bg-white/5 spring-transition ${i%2===0?'bg-transparent':'bg-white/5 dark:bg-white/5'}">
                                            ${isHR ? `<td class="p-4 font-medium">${leave.name}</td>` : ''}
                                            <td class="p-4"><span class="flex items-center gap-2"><div class="w-2 h-2 rounded-full ${leave.type==='Sick'?'bg-rose-500':'bg-blue-500'}"></div>${leave.type}</span></td>
                                            <td class="p-4 text-sm whitespace-nowrap">${leave.from} <br/><span class="text-slate-500">to ${leave.to}</span></td>
                                            <td class="p-4 text-sm text-slate-600 dark:text-slate-400 max-w-xs truncate">${leave.reason}</td>
                                            <td class="p-4">${UI.StatusBadge(leave.status)}</td>
                                            ${isHR ? `
                                                <td class="p-4">
                                                    ${leave.status === 'Pending' ? `
                                                        <div class="flex gap-2">
                                                            <button class="px-3 py-1.5 rounded-xl font-medium text-xs bg-emerald-500/10 text-emerald-600 hover:bg-emerald-500/20 spring-transition" onclick="Dayflow.updateLeaveStatus('${leave.id}', 'Approved')">Approve</button>
                                                            <button class="px-3 py-1.5 rounded-xl font-medium text-xs bg-red-500/10 text-red-600 hover:bg-red-500/20 spring-transition" onclick="Dayflow.updateLeaveStatus('${leave.id}', 'Rejected')">Reject</button>
                                                        </div>
                                                    ` : '<span class="text-xs text-slate-400 italic">Processed</span>'}
                                                </td>
                                            ` : ''}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Leave Modal -->
                    <div id="leave-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
                        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="Dayflow.closeModal('leave-modal')"></div>
                        <div class="glass-heavy w-full max-w-lg rounded-3xl p-6 relative z-10 fade-slide-enter shadow-2xl border border-white/20">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xl font-semibold">Apply for Leave</h3>
                                <button onclick="Dayflow.closeModal('leave-modal')" class="p-2 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 rounded-full spring-transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <form onsubmit="Dayflow.handleLeaveSubmit(event)" class="space-y-4">
                                <div class="flex flex-col gap-1.5 mb-4">
                                    <label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Leave Type</label>
                                    <select id="leave-type" class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-800 dark:text-slate-100 shadow-inner appearance-none">
                                        <option class="text-black" value="Paid">Paid Leave (Casual)</option>
                                        <option class="text-black" value="Sick">Sick Leave</option>
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="flex flex-col gap-1.5">
                                        <label class="text-sm font-medium text-slate-600">From Date</label>
                                        <input id="leave-from" type="date" required class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-800 dark:text-slate-100" />
                                    </div>
                                    <div class="flex flex-col gap-1.5">
                                        <label class="text-sm font-medium text-slate-600">To Date</label>
                                        <input id="leave-to" type="date" required class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-800 dark:text-slate-100" />
                                    </div>
                                </div>
                                <div class="flex flex-col gap-1.5">
                                    <label class="text-sm font-medium text-slate-600">Reason</label>
                                    <textarea id="leave-reason" required class="w-full bg-white/20 dark:bg-black/20 border border-slate-300/30 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500/50 min-h-[100px] text-slate-800 dark:text-slate-100"></textarea>
                                </div>
                                <div class="pt-4 flex justify-end gap-3">
                                    ${UI.Button('Cancel', 'ghost', "Dayflow.closeModal('leave-modal')")}
                                    ${UI.Button('Submit Request', 'primary', '', 'submit')}
                                </div>
                            </form>
                        </div>
                    </div>
                </div>`;
            },

            Payroll: () => {
                const user = Dayflow.state.user;
                if (user.role === 'admin') {
                    return `
                    <div class="fade-slide-enter">
                        <h2 class="text-3xl font-bold mb-6">Payroll Administration</h2>
                        <div class="glass flex flex-col items-center justify-center py-20 text-center rounded-3xl">
                            <div class="w-20 h-20 bg-slate-200/50 rounded-full flex items-center justify-center mb-4"><i data-lucide="file-text" class="text-slate-400 w-8 h-8"></i></div>
                            <h3 class="text-xl font-medium mb-2">Payroll Module Pending Integration</h3>
                            <p class="text-slate-500 max-w-md">The detailed table view for processing bulk payrolls is currently in development. Please check back later.</p>
                        </div>
                    </div>`;
                }

                const s = user.salary;
                const netPay = s ? s.base + s.hra - s.deductions : 0;
                
                return `
                <div class="fade-slide-enter max-w-3xl mx-auto space-y-6">
                    <h2 class="text-3xl font-bold mb-6">My Payroll</h2>
                    <div class="glass rounded-3xl bg-gradient-to-br from-slate-900 to-slate-800 text-white border-0 shadow-2xl relative overflow-hidden p-8">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -mr-20 -mt-20"></div>
                        <div class="flex justify-between items-start relative z-10">
                            <div>
                                <div class="text-slate-400 text-sm mb-1 uppercase tracking-wider">Estimated Net Pay</div>
                                <div class="text-5xl font-light tracking-tight">$${netPay.toLocaleString()}</div>
                                <div class="text-sm text-slate-400 mt-2">For period: August 2026</div>
                            </div>
                            <button class="relative px-6 py-3 rounded-2xl font-medium tracking-tight spring-transition flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white border-0 backdrop-blur-md">
                                <i data-lucide="download" class="w-4 h-4"></i> Download Slip
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-8 mt-12 border-t border-white/10 pt-8 relative z-10">
                            <div>
                                <h4 class="text-emerald-400 font-medium mb-4 flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Earnings</h4>
                                <div class="space-y-3 text-sm">
                                    <div class="flex justify-between"><span class="text-slate-400">Basic Salary</span><span>$${s.base.toLocaleString()}</span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">House Rent Allowance</span><span>$${s.hra.toLocaleString()}</span></div>
                                </div>
                            </div>
                            <div>
                                <h4 class="text-rose-400 font-medium mb-4 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4"></i> Deductions</h4>
                                <div class="space-y-3 text-sm">
                                    <div class="flex justify-between"><span class="text-slate-400">Tax & Provident Fund</span><span>$${s.deductions.toLocaleString()}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }
        };

        function renderApp() {
            const root = document.getElementById('app-root');
            const route = Dayflow.state.route;
            let content = '';

            if (route === 'landing') {
                content = Views.Landing();
            } else if (route === 'auth') {
                content = Views.Auth();
            } else if (!Dayflow.state.user) {
                Dayflow.navigate('auth');
                return;
            } else {
                let viewContent = '';
                switch(route) {
                    case 'dashboard': viewContent = Dayflow.state.user.role === 'admin' ? Views.AdminDashboard() : Views.EmployeeDashboard(); break;
                    case 'profile': viewContent = Views.Profile(); break;
                    case 'leaves': viewContent = Views.Leaves(); break;
                    case 'payroll': viewContent = Views.Payroll(); break;
                    default: viewContent = `<div class="p-8 text-center glass rounded-3xl mt-10">Module In Development</div>`;
                }
                content = Views.DashboardLayout(viewContent);
            }

            root.innerHTML = content;
            lucide.createIcons(); // Initialize icons after injecting HTML
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>

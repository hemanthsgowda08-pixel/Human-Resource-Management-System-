    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            background: #080c16;
            color: #f1f5f9;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        html.light body {
            background: #f8fafc;
            color: #0f172a;
        }

        /* Subtle Matrix Dot Grid */
        .bg-grid-mesh {
            background-size: 28px 28px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        }
        html.light .bg-grid-mesh {
            background-image: 
                linear-gradient(to right, rgba(15, 23, 42, 0.045) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.045) 1px, transparent 1px);
        }

        /* Ultra-Refined Liquid Glass Aesthetics */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), inset 0 1px 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .glass-panel-subtle {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 14px 40px -8px rgba(0, 0, 0, 0.55), inset 0 1px 1px 0 rgba(255, 255, 255, 0.07);
        }

        .dark .glass-panel-subtle {
            background: rgba(19, 29, 49, 0.5);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            pointer-events: none;
        }

        .glass-card-interactive {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card-interactive:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.18);
            border-color: rgba(99, 102, 241, 0.35);
        }

        .dark .glass-card-interactive:hover {
            box-shadow: 0 22px 45px -10px rgba(0, 0, 0, 0.7), 0 0 25px -2px rgba(99, 102, 241, 0.28);
            border-color: rgba(129, 140, 248, 0.3);
        }

        /* Glass Input */
        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.6);
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .dark .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }
        .dark .glass-input:focus {
            background: rgba(15, 23, 42, 0.85);
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }

        /* Select and Option High-Contrast Popups & Rounded Dark Borders */
        html {
            color-scheme: dark;
        }
        html.light {
            color-scheme: light;
        }

        select, select.glass-input {
            color-scheme: dark;
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-radius: 14px !important;
            border: 2px solid #1e293b !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
            transition: all 0.2s ease !important;
            padding: 10px 14px !important;
        }

        select:hover, select.glass-input:hover {
            border-color: #334155 !important;
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.6) !important;
        }

        select:focus, select.glass-input:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.8), 0 0 0 4px rgba(99, 102, 241, 0.4) !important;
            outline: none !important;
        }

        html.light select, html.light select.glass-input {
            color-scheme: light;
            background-color: #ffffff !important;
            color: #0f172a !important;
            border: 2px solid #0f172a !important;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15) !important;
        }

        html.light select:focus, html.light select.glass-input:focus {
            border-color: #0f172a !important;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.3) !important;
        }

        option, optgroup {
            background-color: #0f172a !important;
            color: #ffffff !important;
            font-size: 13px !important;
            padding: 10px 14px !important;
            border-radius: 8px !important;
            margin: 2px 0 !important;
        }

        html.light option, html.light optgroup {
            background-color: #ffffff !important;
            color: #0f172a !important;
        }

        /* Selected / Active Option Highlighted with Rounded Dark Accent */
        select option:checked, option:checked, option[selected] {
            background-color: #020617 !important; /* Deep dark slate background */
            color: #38bdf8 !important; /* Bright cyan text */
            font-weight: 700 !important;
            border: 2px solid #1e293b !important;
            border-radius: 10px !important;
        }

        select option:hover, select option:focus {
            background-color: #1e293b !important;
            color: #ffffff !important;
        }

        /* Pill Badge for Dial Code and Selected Indicator */
        .selected-pill-dark {
            border: 2px solid #0f172a !important;
            background-color: #020617 !important;
            color: #38bdf8 !important;
            border-radius: 12px !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3) !important;
        }

        /* Dynamic Aurora Glow Mesh */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatBlob 24s ease-in-out infinite alternate;
        }
        .aurora-blob-1 {
            width: 650px; height: 650px;
            background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
            top: -150px; left: -100px;
            animation-duration: 28s;
        }
        .aurora-blob-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
            top: 30%; right: -120px;
            animation-duration: 22s;
            animation-delay: -5s;
        }
        .aurora-blob-3 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
            bottom: -150px; left: 25%;
            animation-duration: 32s;
            animation-delay: -10s;
        }
        .dark .aurora-blob {
            opacity: 0.22;
        }

        @keyframes floatBlob {
            0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            50% { transform: translate(60px, 40px) scale(1.08) rotate(180deg); }
            100% { transform: translate(-40px, 80px) scale(0.95) rotate(360deg); }
        }

        /* Micro-transitions */
        .spring-transition {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .fade-slide-enter {
            animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.45); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

        .hidden { display: none !important; }

        /* Print styles for payslip */
        @media print {
            body * { visibility: hidden; }
            #printable-payslip, #printable-payslip * { visibility: visible; }
            #printable-payslip {
                position: fixed;
                left: 0; top: 0; width: 100%;
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>

        // Helper: Dynamic Time-of-Day Greeting with Live System Clock
        function getDynamicGreeting(name) {
            const now = new Date();
            const hour = now.getHours();
            let greeting = 'Hello';
            let icon = 'sparkles';
            let quote = 'Ready for a productive and rewarding workday.';
            
            if (hour >= 5 && hour < 12) {
                greeting = 'Good Morning';
                icon = 'sun';
                quote = 'Seize the morning and turn your goals into major milestones.';
            } else if (hour >= 12 && hour < 17) {
                greeting = 'Good Afternoon';
                icon = 'sun-medium';
                quote = 'Keep up the remarkable momentum as we close out today’s deliverables.';
            } else if (hour >= 17 && hour < 22) {
                greeting = 'Good Evening';
                icon = 'sunset';
                quote = 'Review today’s wins, log your shift hours, and relax with peace of mind.';
            } else {
                greeting = 'Working Late';
                icon = 'moon';
                quote = 'Exceptional dedication. Don’t forget to stay hydrated and take regular breaks.';
            }

            const hrs = now.getHours();
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            const ampm = hrs >= 12 ? 'PM' : 'AM';
            const displayHrs = String(hrs % 12 || 12).padStart(2, '0');
            const liveTime = `${displayHrs}:${mins}:${secs} ${ampm}`;

            return {
                title: `${greeting}, ${name} 👋`,
                icon: icon,
                quote: quote,
                liveTime: liveTime,
                dateFormatted: now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
            };
        }

                const errorEl = document.getElementById('auth-error');

                const users = DayflowDB.getUsers();
                const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

                if (user) {

            // Leave Management Operations
            handleLeaveSubmit: function(e) {
                e.preventDefault();
                const typeEl = document.getElementById('leave-type');
                const fromEl = document.getElementById('leave-from');
                const toEl = document.getElementById('leave-to');
                const reasonEl = document.getElementById('leave-reason');

                const type = typeEl ? typeEl.value : 'Paid';
                const from = fromEl ? fromEl.value : '';
                const to = toEl ? toEl.value : '';
                const reason = reasonEl ? reasonEl.value.trim() : '';

                if (!from || !to) {
                    this.addToast('Please select valid start and end dates', 'error');
                    return;
                }

                if (new Date(to) < new Date(from)) {
                    this.addToast('End date cannot be prior to start date', 'error');
                    return;
                }

                // Calculate total days
                const d1 = new Date(from);
                const d2 = new Date(to);
                const diffTime = Math.abs(d2 - d1);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

                const currentUser = this.state.user || DayflowDB.getUsers().find(u => u.id === 'EMP002');
                const leaves = DayflowDB.getLeaves();
                const newLeave = {
                    id: 'L-' + (Math.floor(100 + Math.random() * 900)),
                    user: currentUser.id,
                    name: currentUser.name,
                    type: type,
                    from: from,
                    to: to,
                    days: diffDays,
                    status: 'Pending',
                    reason: reason || 'Personal time-off request',
                    adminComment: '',
                    appliedOn: new Date().toISOString().split('T')[0]
                };

                leaves.unshift(newLeave);
                DayflowDB.setLeaves(leaves);
                this.closeModal('leave-modal');
                if (reasonEl) reasonEl.value = '';
                this.addToast(`Submitted ${type} leave for ${currentUser.name} (${currentUser.id}). Waiting for Admin approval!`, 'success');
                renderApp();
            },

                notifs.unshift(newNotif);

                notif.replies.push({

                    name: user.name,
                    avatar: user.avatar,
                    role: user.role,
                    message: text,

                DayflowDB.setNotifications(notifs);

            // Individual Employee Weekly & Monthly Attendance Tracker (Admin Mode)
            IndividualEmployeeAttendanceTracker: (selectedEmpId, currentMode) => {
                const users = DayflowDB.getUsers();
                const allAttendance = DayflowDB.getAttendance();
                const empId = selectedEmpId || Dayflow.state.adminAttendanceEmployeeId || (users[1] ? users[1].id : 'EMP002');
                const mode = currentMode || Dayflow.state.adminAttendanceViewMode || 'weekly';
                const currentEmp = users.find(u => u.id === empId) || users[0];

                // Filter attendance records for this specific employee
                const empRecords = allAttendance.filter(a => a.user === empId);

                // Stats calculation for August 2026
                const presentDays = empRecords.filter(r => r.status === 'Present').length;
                const halfDays = empRecords.filter(r => r.status === 'Half-day').length;
                const leaveDays = empRecords.filter(r => r.status === 'Leave').length;
                const absentDays = empRecords.filter(r => r.status === 'Absent').length;

                // Total hours calculation
                let totalMinutes = 0;
                empRecords.forEach(r => {
                    if (r.workHours && r.workHours.includes('h')) {
                        const parts = r.workHours.split(' ');
                        const h = parseInt(parts[0]) || 0;
                        const m = parts[1] ? parseInt(parts[1]) : 0;
                        totalMinutes += (h * 60) + m;
                    }
                });
                const totalHoursDisplay = `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m`;
                const avgHoursPerDay = presentDays > 0 ? (totalMinutes / 60 / (presentDays + halfDays * 0.5)).toFixed(1) + 'h' : '0.0h';
                const punctualityRate = Math.min(100, Math.round(((presentDays + halfDays * 0.5) / Math.max(1, (presentDays + halfDays + leaveDays + absentDays))) * 100));

                // Weekly Data: August 17 to August 23, 2026
                const weekDays = [
                    { date: '2026-08-17', day: 'Monday', short: 'Mon 17', isWeekend: false },
                    { date: '2026-08-18', day: 'Tuesday', short: 'Tue 18', isWeekend: false },
                    { date: '2026-08-19', day: 'Wednesday', short: 'Wed 19', isWeekend: false },

                // Monthly Data: 31 days of August 2026
                const monthDays = [];
                for (let d = 1; d <= 31; d++) {
                    const dStr = d < 10 ? `0${d}` : `${d}`;
                    const dateStr = `2026-08-${dStr}`;
                    const dt = new Date(`2026-08-${dStr}T00:00:00`);
                    const dayOfWeek = dt.getDay(); // 0 = Sun, 6 = Sat
                    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    const rec = empRecords.find(r => r.date === dateStr);
                    monthDays.push({
                        dayNum: d,
                        dateStr: dateStr,
                        dayName: dayNames[dayOfWeek],
                        isWeekend: isWeekend,
                        record: rec
                    });
                }

                return `
                <div class="glass-panel rounded-3xl p-6 border border-brand-500/30 shadow-2xl relative overflow-hidden space-y-6">

                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 relative z-10 pb-4 border-b border-white/10">

                                <select onchange="Dayflow.setAdminAttendanceEmployee(this.value)" class="glass-input rounded-2xl px-3.5 py-1.5 text-xs bg-slate-950 text-white font-bold outline-none cursor-pointer border-2 border-slate-900 shadow-md" style="color-scheme: dark; background-color: #020617; color: #ffffff; border: 2px solid #0f172a; border-radius: 14px;">

                                    `).join('')}

                            <div class="flex items-center p-1 rounded-2xl bg-black/40 border border-white/10">

                                </button>
                                <button onclick="Dayflow.setAdminAttendanceViewMode('monthly')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold spring-transition flex items-center gap-1.5 ${mode === 'monthly' ? 'bg-gradient-to-r from-brand-600 to-cyan-500 text-white shadow-glow-brand' : 'text-slate-400 hover:text-slate-200'}">

                            </div>

                                <div class="font-bold text-sm text-slate-100 truncate">${currentEmp.name}</div>
                                <div class="text-xs text-brand-300 truncate">${currentEmp.designation}</div>
                                <div class="text-[10px] text-slate-400 font-mono mt-0.5">${currentEmp.department} &bull; ${currentEmp.id}</div>

                                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span> Half-day</span>
                                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Leave</span>
                                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-600"></span> Weekend Off</span>
                                </div>

                            <!-- 31-Day Grid Matrix -->
                            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2.5">
                                ${monthDays.map(md => {
                                    const rec = md.record;
                                    const isPresent = rec && rec.status === 'Present';
                                    const isHalfDay = rec && rec.status === 'Half-day';
                                    const isLeave = rec && rec.status === 'Leave';
                                    const isAbsent = rec && rec.status === 'Absent';

                                    let cellBorder = 'border-white/10 bg-white/5';
                                    let badgeColor = 'text-slate-400';
                                    let durationText = md.isWeekend ? 'Weekend' : 'No Log';

                                    if (isPresent) {
                                        cellBorder = 'border-emerald-500/40 bg-emerald-950/25 hover:bg-emerald-950/40';
                                        badgeColor = 'text-emerald-400 font-bold';
                                        durationText = rec.workHours;
                                    } else if (isHalfDay) {
                                        cellBorder = 'border-cyan-500/40 bg-cyan-950/25 hover:bg-cyan-950/40';
                                        badgeColor = 'text-cyan-400 font-bold';
                                        durationText = rec.workHours;
                                    } else if (isLeave) {
                                        cellBorder = 'border-amber-500/40 bg-amber-950/25 hover:bg-amber-950/40';
                                        badgeColor = 'text-amber-400 font-bold';
                                        durationText = 'Leave';
                                    } else if (isAbsent) {
                                        cellBorder = 'border-rose-500/40 bg-rose-950/25 hover:bg-rose-950/40';

                                    } else if (md.isWeekend) {

                const attendance = DayflowDB.getAttendance();

                const todayStr = '2026-08-22';
                const todayAttendance = attendance.filter(a => a.date === todayStr);
                const presentCount = todayAttendance.filter(a => a.status === 'Present').length;
                const pendingLeaves = leaves.filter(l => l.status === 'Pending');
                const approvedLeaves = leaves.filter(l => l.status === 'Approved');
                const rejectedLeaves = leaves.filter(l => l.status === 'Rejected');

                // Filtered leaves according to selected tab
                let displayedLeaves = leaves;
                if (leaveFilter === 'Pending') displayedLeaves = pendingLeaves;
                else if (leaveFilter === 'Approved') displayedLeaves = approvedLeaves;
                else if (leaveFilter === 'Rejected') displayedLeaves = rejectedLeaves;

                const totalMonthlyPayroll = users.reduce((sum, u) => sum + (u.salary ? (u.salary.base + u.salary.hra + u.salary.allowances - u.salary.deductions - u.salary.pf - u.salary.tax) / 12 : 0), 0);

                const todayRecord = allAttendance.find(a => a.user === user.id && a.date === todayStr);

        // Application Render Orchestrator
        function renderApp() {
            const root = document.getElementById('app-root');
            const route = Dayflow.state.route;
            let content = '';

            if (route === 'landing') {
                content = Views.Landing();
            } else if (route === 'auth') {
                content = Views.Auth();
            } else if (!Dayflow.state.user) {
                Dayflow.navigate('auth');
                return;
            } else {
                let viewContent = '';
                switch(route) {
                    case 'dashboard': 
                        viewContent = Dayflow.state.user.role === 'admin' ? Views.AdminDashboard() : Views.EmployeeDashboard(); 
                        break;
                    case 'tasks':
                        viewContent = Views.WorkAssignmentSection(Dayflow.state.user, Dayflow.state.user.role === 'admin');
                        break;
                    case 'announcements':
                        viewContent = Views.InteractiveNotificationCenter(Dayflow.state.user, Dayflow.state.user.role === 'admin');
                        break;
                    case 'profile': 
                        viewContent = Views.Profile(); 
                        break;
                    case 'attendance': 
                        viewContent = Views.Attendance(); 
                        break;
                    case 'leaves': 
                        viewContent = Views.Leaves(); 
                        break;
                    case 'payroll': 
                        viewContent = Views.Payroll(); 
                        break;
                    case 'employees': 
                        viewContent = Views.Employees(); 
                        break;
                    default: 
                        viewContent = `<div class="p-8 text-center glass-panel rounded-3xl mt-10 text-slate-400">Module View Not Found</div>`;
                }
                content = Views.DashboardLayout(viewContent);
            }

            root.innerHTML = content;
            lucide.createIcons();
        }

        // Real-Time Cross-Tab / Multi-Window State Synchronization
        window.addEventListener('storage', (e) => {
            if (e.key === 'dayflow_leaves' || e.key === 'dayflow_users' || e.key === 'dayflow_attendance' || e.key === 'dayflow_auth_user' || e.key === 'dayflow_tasks' || e.key === 'dayflow_notifications') {
                if (Dayflow.state.user) {
                    const users = DayflowDB.getUsers();
                    const freshUser = users.find(u => u.id === Dayflow.state.user.id);
                    if (freshUser) Dayflow.state.user = freshUser;
                }
                renderApp();
            }
        });
    </script>
</body>
</html>

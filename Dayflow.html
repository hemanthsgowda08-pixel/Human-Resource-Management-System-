    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            background: #0b0f19;
            color: #f1f5f9;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        html.light body {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Liquid Glass Aesthetics */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), inset 0 1px 1px 0 rgba(255, 255, 255, 0.8);
        }

        .glass-panel-subtle {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.45), inset 0 1px 1px 0 rgba(255, 255, 255, 0.06);
        }

        .dark .glass-panel-subtle {
            background: rgba(23, 32, 51, 0.45);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card-interactive {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .dark .glass-card-interactive:hover {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 0 0 20px -2px rgba(99, 102, 241, 0.25);
            border-color: rgba(129, 140, 248, 0.25);
        }

        /* Glass Input */
        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.6);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .dark .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }
        .dark .glass-input:focus {
            background: rgba(15, 23, 42, 0.85);
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }

        /* Dynamic Aurora Glow Mesh */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatBlob 24s ease-in-out infinite alternate;
        }
        .aurora-blob-1 {
            width: 650px; height: 650px;
            background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
            top: -150px; left: -100px;
            animation-duration: 28s;
        }
        .aurora-blob-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
            top: 30%; right: -120px;
            animation-duration: 22s;
            animation-delay: -5s;
        }
        .aurora-blob-3 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
            bottom: -150px; left: 25%;
            animation-duration: 32s;
            animation-delay: -10s;
        }
        .dark .aurora-blob {
            opacity: 0.22;
        }

        @keyframes floatBlob {
            0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            50% { transform: translate(60px, 40px) scale(1.08) rotate(180deg); }
            100% { transform: translate(-40px, 80px) scale(0.95) rotate(360deg); }
        }

        /* Micro-transitions */
        .spring-transition {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .fade-slide-enter {
            animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.45); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

        .hidden { display: none !important; }

        /* Print styles for payslip */
        @media print {
            body * { visibility: hidden; }
            #printable-payslip, #printable-payslip * { visibility: visible; }
            #printable-payslip {
                position: fixed;
                left: 0; top: 0; width: 100%;
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>

            // Attendance Operations
            toggleCheckInOut: function() {
                const user = this.state.user;
                if (!user) return;

                const todayStr = '2026-08-22';
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let attendanceList = DayflowDB.getAttendance();
                let todayRecord = attendanceList.find(a => a.user === user.id && a.date === todayStr);

                if (!todayRecord) {
                    // Check In
                    const newRecord = {
                        id: 'att-' + Date.now(),
                        date: todayStr,
                        status: 'Present',
                        checkIn: timeString,
                        checkOut: null,
                        user: user.id,
                        workHours: 'In Progress'
                    };
                    attendanceList.unshift(newRecord);
                    DayflowDB.setAttendance(attendanceList);
                    this.addToast(`Checked In successfully at ${timeString}`, 'success');
                } else if (!todayRecord.checkOut) {
                    // Check Out
                    todayRecord.checkOut = timeString;
                    todayRecord.workHours = '8h 15m';
                    DayflowDB.setAttendance(attendanceList);
                    this.addToast(`Checked Out at ${timeString}. Great workday!`, 'info');
                } else {
                    // Already checked out for the day, toggle reset or alert
                    this.addToast(`You have already completed attendance for today. Check-out was at ${todayRecord.checkOut}.`, 'warning');

            exportAttendanceCSV: function() {
                const attendance = DayflowDB.getAttendance();
                const users = DayflowDB.getUsers();
                
                let csvContent = "data:text/csv;charset=utf-8,ID,Employee Name,Employee ID,Date,Status,Check-In,Check-Out,Work Hours\n";
                attendance.forEach(a => {
                    const u = users.find(user => user.id === a.user) || { name: 'Unknown' };
                    csvContent += `${a.id},"${u.name}",${a.user},${a.date},${a.status},"${a.checkIn}","${a.checkOut || '--'}","${a.workHours}"\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Dayflow_Attendance_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                this.addToast('Attendance report exported to CSV', 'success');
            },

            // Leave Management Operations
            handleLeaveSubmit: function(e) {
                e.preventDefault();
                const type = document.getElementById('leave-type').value;
                const from = document.getElementById('leave-from').value;
                const to = document.getElementById('leave-to').value;
                const reason = document.getElementById('leave-reason').value.trim();

                if (new Date(to) < new Date(from)) {
                    this.addToast('End date cannot be prior to start date', 'error');
                    return;
                }

                // Calculate total days
                const d1 = new Date(from);
                const d2 = new Date(to);
                const diffTime = Math.abs(d2 - d1);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

                const leaves = DayflowDB.getLeaves();
                const newLeave = {
                    id: 'L-' + (Math.floor(100 + Math.random() * 900)),
                    user: this.state.user.id,
                    name: this.state.user.name,
                    type,
                    from,
                    to,
                    days: diffDays,
                    status: 'Pending',
                    reason,
                    adminComment: '',
                    appliedOn: new Date().toISOString().split('T')[0]
                };

                leaves.unshift(newLeave);
                DayflowDB.setLeaves(leaves);
                this.closeModal('leave-modal');
                this.addToast(`Submitted ${type} leave request for ${diffDays} day(s)`, 'success');
                renderApp();
            },

                const newRun = {
                    id: 'PR-' + Date.now().toString().slice(-6),
                    period: 'August 2026',
                    processedDate: new Date().toISOString().split('T')[0],
                    status: 'Disbursed',
                    totalDisbursed: total
                };
                runs.unshift(newRun);
                DayflowDB.setPayrollRuns(runs);
                this.addToast(`August 2026 Payroll Batch Disbursed! Total: $${total.toLocaleString()}`, 'success');

                                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                                </div>
                                <span class="text-[11px] font-bold text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-full">Monthly</span>
                            </div>
                            <div class="text-3xl font-extrabold">$${Math.round(totalMonthlyPayroll).toLocaleString()}</div>
                            <div class="text-xs text-slate-400 mt-1">Net Monthly Payroll Outflow</div>
                        </div>
                    </div>

                    <!-- Split Actions Area: Pending Approvals & Employee Switcher/Directory -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                                <div class="flex justify-between items-center mb-4">

                                        <h3 class="text-lg font-bold flex items-center gap-2">
                                            <i data-lucide="inbox" class="w-5 h-5 text-amber-400"></i>
                                            Leave Approval Action Queue
                                        </h3>
                                        <p class="text-xs text-slate-400">Approve or reject requests with custom administrative remarks.</p>
                                    </div>
                                    ${UI.Button('All Requests', 'ghost', "Dayflow.navigate('leaves')", 'button', 'text-xs')}
                                </div>

                                <div class="space-y-3">
                                    ${pendingLeaves.length === 0 ? `
                                        <div class="p-8 text-center glass-panel-subtle rounded-2xl text-slate-400 text-xs">
                                            <i data-lucide="check-circle" class="w-8 h-8 text-emerald-400 mx-auto mb-2 opacity-60"></i>
                                            All leave applications have been reviewed. No pending tasks in queue!
                                        </div>

                                        <div class="glass-panel-subtle p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-white/10 hover:border-brand-500/30 spring-transition">

                                                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center font-bold text-white flex-shrink-0">
                                                    ${leave.name.charAt(0)}
                                                </div>
                                                <div>
                                                    <div class="flex items-center gap-2">
                                                        <span class="font-bold text-sm text-slate-100">${leave.name}</span>
                                                        <span class="text-[11px] px-2 py-0.5 rounded-full bg-brand-500/15 text-brand-300 font-semibold">${leave.type}</span>
                                                    </div>
                                                    <div class="text-xs text-slate-400 mt-0.5">${leave.from} &rarr; ${leave.to} (${leave.days} day(s))</div>
                                                    <p class="text-xs text-slate-300 italic mt-1 bg-black/20 px-2.5 py-1 rounded-xl">"${leave.reason}"</p>
                                                </div>
                                            </div>

                                            <div class="flex items-center gap-2 self-end sm:self-center">
                                                <button onclick="Dayflow.openAdminLeaveActionModal('${leave.id}', 'Approved')" class="px-3.5 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 text-xs font-bold border border-emerald-500/30 spring-transition flex items-center gap-1.5">
                                                    <i data-lucide="check" class="w-4 h-4"></i> Approve
                                                </button>
                                                <button onclick="Dayflow.openAdminLeaveActionModal('${leave.id}', 'Rejected')" class="px-3.5 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 text-xs font-bold border border-rose-500/30 spring-transition flex items-center gap-1.5">
                                                    <i data-lucide="x" class="w-4 h-4"></i> Reject
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Employee Switcher & Live Directory Card -->
                        <div class="glass-panel rounded-3xl p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-bold">Team Directory</h3>
                                ${UI.Button('View All', 'ghost', "Dayflow.navigate('employees')", 'button', 'text-xs')}
                            </div>
                            <p class="text-xs text-slate-400 mb-4">Quick profile access & full editing permissions.</p>

                            <div class="space-y-2.5">
                                ${users.map(u => `
                                    <div onclick="Dayflow.selectProfileUser('${u.id}')" class="p-3 rounded-2xl glass-panel-subtle hover:bg-white/10 cursor-pointer border border-white/10 flex items-center justify-between spring-transition group">
                                        <div class="flex items-center gap-3">
                                            <img src="${u.avatar}" class="w-9 h-9 rounded-xl object-cover border border-white/20" />
                                            <div>
                                                <div class="font-bold text-xs text-slate-200 group-hover:text-brand-300 transition-colors">${u.name}</div>
                                                <div class="text-[10px] text-slate-400">${u.designation}</div>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            ${UI.StatusBadge(u.role)}
                                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-cyan-400 group-hover:translate-x-1 spring-transition"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Company-Wide Attendance Records Overview Table -->
                    <div class="glass-panel rounded-3xl p-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <div>
                                <h3 class="text-lg font-bold">Today's Attendance Stream (Aug 22, 2026)</h3>
                                <p class="text-xs text-slate-400">Real-time check-in timestamps and total active work hours.</p>
                            </div>
                            <div class="flex items-center gap-2">
                                ${UI.Button('<i data-lucide="download" class="w-4 h-4"></i> Export CSV', 'secondary', 'Dayflow.exportAttendanceCSV()', 'button', 'text-xs')}
                                ${UI.Button('<i data-lucide="clock" class="w-4 h-4"></i> Detailed Attendance', 'primary', "Dayflow.navigate('attendance')", 'button', 'text-xs')}
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="border-b border-white/10 text-slate-400 font-semibold uppercase tracking-wider">
                                        <th class="py-3 px-4">Employee</th>
                                        <th class="py-3 px-4">Department</th>
                                        <th class="py-3 px-4">Check-In</th>
                                        <th class="py-3 px-4">Check-Out</th>
                                        <th class="py-3 px-4">Work Hours</th>
                                        <th class="py-3 px-4">Status</th>
                                        <th class="py-3 px-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${todayAttendance.map(att => {
                                        const u = users.find(user => user.id === att.user) || { name: 'Unknown', department: 'General', avatar: '' };
                                        return `
                                        <tr class="border-b border-white/5 hover:bg-white/5 spring-transition">
                                            <td class="py-3 px-4">
                                                <div class="flex items-center gap-2.5">
                                                    <img src="${u.avatar}" class="w-7 h-7 rounded-lg object-cover" />
                                                    <div>
                                                        <span class="font-bold text-slate-200 block">${u.name}</span>
                                                        <span class="text-[10px] text-slate-400 font-mono">${att.user}</span>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="py-3 px-4 text-slate-300">${u.department}</td>
                                            <td class="py-3 px-4 font-mono font-medium">${att.checkIn}</td>
                                            <td class="py-3 px-4 font-mono font-medium">${att.checkOut || '<span class="text-cyan-400 italic">In progress</span>'}</td>
                                            <td class="py-3 px-4 font-bold text-slate-200">${att.workHours}</td>
                                            <td class="py-3 px-4">${UI.StatusBadge(att.status)}</td>
                                            <td class="py-3 px-4 text-right">
                                                <button onclick="Dayflow.selectProfileUser('${att.user}')" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-brand-500/20 text-[11px] font-semibold text-slate-300 hover:text-brand-300">
                                                    Inspect
                                                </button>
                                            </td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                `;
            },

            // Profile View (with Admin Edit All Capabilities + Document Vault)
            Profile: () => {
                const currentUser = Dayflow.state.user;
                const isAdmin = currentUser.role === 'admin';
                const users = DayflowDB.getUsers();

                // Target user being viewed
                const targetUserId = Dayflow.state.selectedProfileUserId || currentUser.id;
                const targetUser = users.find(u => u.id === targetUserId) || currentUser;

                const isEditing = Dayflow.state.isEditingProfile;
                const activeTab = Dayflow.state.activeProfileTab;
                const canEditAll = isAdmin; // Admin can edit all fields

                return `
                <div class="fade-slide-enter max-w-5xl mx-auto space-y-6">
                    <!-- Top Profile Switcher Header for Admins -->
                    ${isAdmin ? `
                        <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 border border-brand-500/30 shadow-glow-brand">
                            <div class="flex items-center gap-3">
                                <div class="p-2 rounded-xl bg-brand-500/20 text-brand-300">
                                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-brand-300">Admin Profile Inspector</h4>
                                    <p class="text-xs text-slate-400">Select any employee to view or edit full details, documents, and compensation.</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 w-full sm:w-auto">
                                <select onchange="Dayflow.selectProfileUser(this.value)" class="glass-input rounded-xl p-2 text-xs bg-slate-900 text-white outline-none w-full sm:w-auto">
                                    ${users.map(u => `
                                        <option value="${u.id}" ${u.id === targetUser.id ? 'selected' : ''}>${u.name} (${u.id} - ${u.department})</option>
                                    `).join('')}
                                </select>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Hero Profile Header Banner -->
                    <div class="relative glass-panel rounded-3xl overflow-hidden border border-white/10">
                        <div class="h-44 bg-gradient-to-r from-brand-900 via-cyan-900 to-slate-900 relative">
                            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-brand-500/30 via-cyan-500/10 to-transparent"></div>
                        </div>
                        <div class="px-6 pb-6 pt-0 flex flex-col md:flex-row items-start md:items-end justify-between gap-6 relative -mt-16 z-10">
                            <div class="flex flex-col sm:flex-row items-start sm:items-end gap-5">
                                <div class="relative group">
                                    <img src="${targetUser.avatar}" class="w-28 h-28 rounded-3xl object-cover border-4 border-slate-900 shadow-2xl bg-slate-800" alt="Avatar" />
                                    ${isEditing ? `
                                        <button onclick="const newUrl = prompt('Enter image URL for avatar:', targetUser.avatar); if(newUrl) { targetUser.avatar = newUrl; renderApp(); }" class="absolute inset-0 bg-black/60 rounded-3xl flex flex-col items-center justify-center text-white text-xs font-bold opacity-0 group-hover:opacity-100 spring-transition">
                                            <i data-lucide="camera" class="w-6 h-6 mb-1"></i> Change
                                        </button>
                                    ` : ''}
                                </div>
                                <div class="mb-1">
                                    <div class="flex items-center gap-2">
                                        <h2 class="text-2xl md:text-3xl font-extrabold text-white">${targetUser.name}</h2>
                                        ${UI.StatusBadge(targetUser.role)}
                                    </div>
                                    <p class="text-xs text-slate-400 font-medium mt-0.5">${targetUser.designation} &bull; ${targetUser.department}</p>
                                    <p class="text-[11px] text-brand-300 font-mono mt-1">ID: ${targetUser.id} &bull; Member since ${targetUser.joiningDate}</p>
                                </div>
                            </div>

                            <div class="flex items-center gap-2">
                                ${isEditing ? `
                                    ${UI.Button('Cancel', 'ghost', 'Dayflow.toggleProfileEdit()')}
                                    ${UI.Button('<i data-lucide="check" class="w-4 h-4"></i> Save All Changes', 'primary', 'Dayflow.saveProfileChanges()')}
                                ` : `
                                    ${UI.Button('<i data-lucide="edit-3" class="w-4 h-4"></i> ' + (isAdmin ? 'Edit All Details' : 'Edit Contact Info'), 'secondary', 'Dayflow.toggleProfileEdit()')}
                                `}
                            </div>
                        </div>

                        <!-- Tab Bar -->
                        <div class="flex items-center gap-2 px-6 border-t border-white/10 bg-white/5 overflow-x-auto">
                            ${[
                                { id: 'personal', label: 'Personal & Contact', icon: 'user' },
                                { id: 'job', label: 'Job & Organization', icon: 'briefcase' },
                                { id: 'salary', label: 'Salary Structure', icon: 'wallet' },
                                { id: 'documents', label: `Documents Vault (${targetUser.documents ? targetUser.documents.length : 0})`, icon: 'folder-lock' }
                            ].map(tab => `
                                <button onclick="Dayflow.setProfileTab('${tab.id}')" class="px-4 py-3.5 text-xs font-bold flex items-center gap-2 border-b-2 spring-transition whitespace-nowrap ${activeTab === tab.id ? 'border-cyan-400 text-cyan-300 bg-white/5' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                                    <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                                    ${tab.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Tab Content Canvas -->
                    <form onsubmit="Dayflow.saveProfileChanges(event)">
                        ${activeTab === 'personal' ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 fade-slide-enter">
                                <div class="glass-panel rounded-3xl p-6 space-y-4">
                                    <h4 class="text-sm font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-2 pb-2 border-b border-white/10">
                                        <i data-lucide="user-check" class="w-4 h-4"></i> Identity & Personal Info
                                    </h4>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Full Name ${!isAdmin ? '<span class="text-[10px] text-slate-500">(Admin locked)</span>' : ''}</label>
                                        <input id="prof-name" type="text" value="${targetUser.name}" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed" />
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Official Work Email ${!isAdmin ? '<span class="text-[10px] text-slate-500">(Admin locked)</span>' : ''}</label>
                                        <input id="prof-email" type="email" value="${targetUser.email}" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed" />
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div class="flex flex-col gap-1">
                                            <label class="text-xs font-semibold text-slate-400">Date of Birth</label>
                                            <input id="prof-dob" type="date" value="${targetUser.dob || '1992-05-14'}" ${!isEditing ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed" />
                                        </div>
                                        <div class="flex flex-col gap-1">
                                            <label class="text-xs font-semibold text-slate-400">Blood Group</label>
                                            <input id="prof-bloodgroup" type="text" value="${targetUser.bloodGroup || 'O+'}" ${!isEditing ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed" />
                                        </div>
                                    </div>
                                </div>

                                <div class="glass-panel rounded-3xl p-6 space-y-4">
                                    <h4 class="text-sm font-bold uppercase tracking-wider text-brand-400 flex items-center gap-2 pb-2 border-b border-white/10">
                                        <i data-lucide="phone" class="w-4 h-4"></i> Contact & Residential
                                    </h4>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Primary Phone Number</label>
                                        <input id="prof-phone" type="text" value="${targetUser.phone}" ${!isEditing ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed" />
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Emergency Contact (Name & Phone)</label>
                                        <input id="prof-emergency" type="text" value="${targetUser.emergencyContact || 'Family (+1 555-000-0000)'}" ${!isEditing ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed" />
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Residential Address</label>
                                        <textarea id="prof-address" rows="3" ${!isEditing ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium resize-none disabled:opacity-60 disabled:cursor-not-allowed">${targetUser.address}</textarea>
                                    </div>
                                </div>
                            </div>
                        ` : activeTab === 'job' ? `
                            <div class="glass-panel rounded-3xl p-6 space-y-6 fade-slide-enter">
                                <h4 class="text-sm font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-2 pb-2 border-b border-white/10">
                                    <i data-lucide="building-2" class="w-4 h-4"></i> Organizational Details & Role Authorization
                                </h4>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Employee Identifier (ID)</label>
                                        <input type="text" value="${targetUser.id}" disabled class="glass-input rounded-xl p-3 text-xs font-mono font-bold text-cyan-300 opacity-70" />
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Designation / Title</label>
                                        <input id="prof-designation" type="text" value="${targetUser.designation}" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60" />
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Department</label>
                                        <select id="prof-department" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs bg-slate-900 disabled:opacity-60">
                                            <option value="Human Resources" ${targetUser.department === 'Human Resources' ? 'selected' : ''}>Human Resources</option>
                                            <option value="Engineering" ${targetUser.department === 'Engineering' ? 'selected' : ''}>Engineering</option>
                                            <option value="Product & Design" ${targetUser.department === 'Product & Design' ? 'selected' : ''}>Product & Design</option>
                                            <option value="Marketing" ${targetUser.department === 'Marketing' ? 'selected' : ''}>Marketing</option>
                                            <option value="Finance & Legal" ${targetUser.department === 'Finance & Legal' ? 'selected' : ''}>Finance & Legal</option>
                                        </select>
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Joining Date</label>
                                        <input id="prof-joining" type="date" value="${targetUser.joiningDate}" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs font-medium disabled:opacity-60" />
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Access Level / Role</label>
                                        <select id="prof-role" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-3 text-xs bg-slate-900 disabled:opacity-60">
                                            <option value="employee" ${targetUser.role === 'employee' ? 'selected' : ''}>Employee (Standard Access)</option>
                                            <option value="admin" ${targetUser.role === 'admin' ? 'selected' : ''}>Admin / HR Officer (Full Access)</option>
                                        </select>
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <label class="text-xs font-semibold text-slate-400">Employment Status</label>
                                        <input type="text" value="Active Full-Time" disabled class="glass-input rounded-xl p-3 text-xs font-bold text-emerald-400 opacity-70" />
                                    </div>
                                </div>
                            </div>
                        ` : activeTab === 'salary' ? `
                            <div class="glass-panel rounded-3xl p-6 space-y-6 fade-slide-enter">
                                <div class="flex justify-between items-center pb-2 border-b border-white/10">
                                    <h4 class="text-sm font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
                                        <i data-lucide="badge-dollar-sign" class="w-4 h-4"></i> Compensation & Salary Breakdown
                                    </h4>
                                    ${isAdmin && !isEditing ? UI.Button('<i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Update Salary', 'primary', `Dayflow.openEditSalaryModal('${targetUser.id}')`, 'button', 'text-xs py-1.5 px-3') : ''}
                                </div>

                                ${(() => {
                                    const s = targetUser.salary || { base: 90000, hra: 18000, allowances: 6000, deductions: 4000, pf: 3000, tax: 6000 };
                                    const gross = s.base + s.hra + s.allowances;
                                    const totalDeductions = s.deductions + s.pf + s.tax;
                                    const net = gross - totalDeductions;
                                    return `
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        <div class="p-4 rounded-2xl bg-white/5 border border-white/10">
                                            <span class="text-xs text-slate-400">Annual Gross CTC</span>
                                            <div class="text-2xl font-black text-white mt-1">$${gross.toLocaleString()}</div>
                                        </div>
                                        <div class="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20">
                                            <span class="text-xs text-rose-300">Total Deductions & Taxes</span>
                                            <div class="text-2xl font-black text-rose-400 mt-1">-$${totalDeductions.toLocaleString()}</div>
                                        </div>
                                        <div class="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/20">
                                            <span class="text-xs text-emerald-300">Net Annual Take-Home</span>
                                            <div class="text-2xl font-black text-emerald-400 mt-1">$${net.toLocaleString()}</div>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div class="space-y-3">
                                            <h5 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Earnings Breakdown</h5>
                                            <div class="flex flex-col gap-1">
                                                <label class="text-xs text-slate-400">Base Salary ($)</label>
                                                <input id="prof-sal-base" type="number" value="${s.base}" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-2.5 text-xs disabled:opacity-60" />
                                            </div>
                                            <div class="flex flex-col gap-1">
                                                <label class="text-xs text-slate-400">House Rent Allowance (HRA) ($)</label>
                                                <input id="prof-sal-hra" type="number" value="${s.hra}" ${!isEditing || !isAdmin ? 'disabled' : ''} class="glass-input rounded-xl p-2.5 text-xs disabled:opacity-60" />
                                            </div>

                                </div>
                            </div>
                            <div class="glass-panel rounded-2xl p-5 border border-emerald-500/30">
                                <span class="text-xs text-emerald-300 font-semibold">Net Disbursed Take-Home</span>
                                <div class="text-2xl font-black text-emerald-400 mt-1">
                                    $${users.reduce((sum, u) => sum + (u.salary ? (u.salary.base + u.salary.hra + u.salary.allowances - u.salary.deductions - u.salary.pf - u.salary.tax) / 12 : 0), 0).toFixed(0)} <span class="text-xs font-normal text-slate-400">/ mo</span>
                                </div>
                            </div>
                        </div>

                        <!-- All Employees Salary Structure Table -->
                        <div class="glass-panel rounded-3xl p-6">
                            <div class="flex justify-between items-center mb-6">
                                <div>
                                    <h3 class="text-base font-bold">Employee Compensation & Salary Structures</h3>
                                    <p class="text-xs text-slate-400">Click 'Edit Structure' to modify Base, HRA, allowances, or tax deductions.</p>
                                </div>
                                <span class="text-xs text-slate-400 font-mono">${users.length} Active Payroll Accounts</span>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs border-collapse">
                                    <thead>
                                        <tr class="border-b border-white/10 text-slate-400 font-semibold uppercase tracking-wider">
                                            <th class="py-3 px-4">Employee</th>
                                            <th class="py-3 px-4">Department</th>
                                            <th class="py-3 px-4">Base Salary</th>
                                            <th class="py-3 px-4">HRA & Allowances</th>
                                            <th class="py-3 px-4">Deductions & Tax</th>
                                            <th class="py-3 px-4">Net Monthly</th>
                                            <th class="py-3 px-4 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${users.map(u => {
                                            const s = u.salary || { base: 80000, hra: 16000, allowances: 5000, deductions: 3500, pf: 2500, tax: 5000 };
                                            const netMonthly = (s.base + s.hra + s.allowances - s.deductions - s.pf - s.tax) / 12;
                                            return `
                                            <tr class="border-b border-white/5 hover:bg-white/5 spring-transition">
                                                <td class="py-3.5 px-4">
                                                    <div class="flex items-center gap-3">
                                                        <img src="${u.avatar}" class="w-8 h-8 rounded-xl object-cover" />
                                                        <div>
                                                            <span class="font-bold text-slate-200 block">${u.name}</span>
                                                            <span class="text-[10px] text-slate-400 font-mono">${u.id} &bull; ${u.designation}</span>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="py-3.5 px-4 text-slate-300">${u.department}</td>
                                                <td class="py-3.5 px-4 font-mono font-bold">$${(s.base / 12).toFixed(0)} <span class="text-slate-500 font-normal">/mo</span></td>
                                                <td class="py-3.5 px-4 font-mono text-emerald-400">+$${((s.hra + s.allowances) / 12).toFixed(0)}</td>
                                                <td class="py-3.5 px-4 font-mono text-rose-400">-$${((s.deductions + s.pf + s.tax) / 12).toFixed(0)}</td>
                                                <td class="py-3.5 px-4 font-mono font-black text-slate-100 text-sm">$${netMonthly.toFixed(0)}</td>
                                                <td class="py-3.5 px-4 text-right">
                                                    <div class="flex items-center justify-end gap-2">
                                                        <button onclick="Dayflow.viewPayslipPreview('${u.id}')" class="px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/15 text-slate-300 font-semibold text-xs spring-transition">
                                                            Payslip
                                                        </button>
                                                        <button onclick="Dayflow.openEditSalaryModal('${u.id}')" class="px-2.5 py-1 rounded-xl bg-brand-500/15 hover:bg-brand-500/25 text-brand-300 font-bold text-xs border border-brand-500/30 spring-transition">
                                                            Edit Structure
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Historical Payroll Runs -->
                        <div class="glass-panel rounded-3xl p-6">
                            <h3 class="text-base font-bold mb-4">Disbursement History</h3>
                            <div class="space-y-3">
                                ${payrollRuns.map(run => `
                                    <div class="glass-panel-subtle p-4 rounded-2xl border border-white/10 flex items-center justify-between">
                                        <div class="flex items-center gap-3">
                                            <div class="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
                                            <div>
                                                <h4 class="font-bold text-sm text-slate-200">${run.period}</h4>
                                                <span class="text-xs text-slate-400">Processed On: ${run.processedDate} &bull; Ref: ${run.id}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-4">
                                            <span class="font-mono font-bold text-emerald-400 text-sm">$${run.totalDisbursed.toLocaleString()}</span>
                                            ${UI.StatusBadge(run.status)}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    `;
                }

                // Employee Payroll View (Payslip Card & Breakdown)
                const s = user.salary || { base: 90000, hra: 18000, allowances: 6000, deductions: 3500, pf: 3000, tax: 6000 };
                const grossMonthly = (s.base + s.hra + s.allowances) / 12;
                const deductionsMonthly = (s.deductions + s.pf + s.tax) / 12;
                const netMonthly = grossMonthly - deductionsMonthly;

                return `
                <div class="fade-slide-enter max-w-4xl mx-auto space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-extrabold tracking-tight">My Salary & Monthly Payslips</h2>
                            <p class="text-xs text-slate-400">Transparent salary overview, earnings, statutory withholdings, and printable PDF slips.</p>
                        </div>
                        ${UI.Button('<i data-lucide="printer" class="w-4 h-4"></i> Download August Payslip', 'primary', `Dayflow.viewPayslipPreview('${user.id}')`, 'button', 'text-xs')}
                    </div>

                    <!-- Liquid Glass Paycard Hero -->
                    <div class="glass-panel rounded-3xl p-8 bg-gradient-to-br from-brand-950/60 via-slate-900 to-slate-950 border border-brand-500/30 shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-80 h-80 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative z-10">
                            <div>
                                <span class="text-xs text-brand-300 font-bold uppercase tracking-wider">August 2026 Estimated Net Pay</span>
                                <div class="text-5xl font-extrabold text-white tracking-tight mt-1">$${netMonthly.toFixed(2)}</div>
                                <p class="text-xs text-slate-400 mt-2 flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Direct deposit scheduled for August 31, 2026
                                </p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400">Annual Base Package</span>
                                <div class="text-2xl font-bold font-mono text-slate-200">$${s.base.toLocaleString()}</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8 pt-8 border-t border-white/10 relative z-10">
                            <div>
                                <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-3 flex items-center gap-1.5">
                                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Monthly Gross Earnings ($${grossMonthly.toFixed(2)})
                                </h4>
                                <div class="space-y-2 text-xs">
                                    <div class="flex justify-between py-1 border-b border-white/5"><span class="text-slate-400">Basic Pay</span><span class="font-mono text-slate-200">$${(s.base / 12).toFixed(2)}</span></div>
                                    <div class="flex justify-between py-1 border-b border-white/5"><span class="text-slate-400">House Rent Allowance (HRA)</span><span class="font-mono text-slate-200">$${(s.hra / 12).toFixed(2)}</span></div>
                                    <div class="flex justify-between py-1"><span class="text-slate-400">Special Allowances</span><span class="font-mono text-slate-200">$${(s.allowances / 12).toFixed(2)}</span></div>
                                </div>
                            </div>

                            <div>
                                <h4 class="text-xs font-bold uppercase tracking-wider text-rose-400 mb-3 flex items-center gap-1.5">
                                    <i data-lucide="minus-circle" class="w-4 h-4"></i> Monthly Deductions (-$${deductionsMonthly.toFixed(2)})
                                </h4>
                                <div class="space-y-2 text-xs">
                                    <div class="flex justify-between py-1 border-b border-white/5"><span class="text-slate-400">Provident Fund (PF 401k)</span><span class="font-mono text-slate-200">$${(s.pf / 12).toFixed(2)}</span></div>
                                    <div class="flex justify-between py-1 border-b border-white/5"><span class="text-slate-400">TDS & Federal Income Tax</span><span class="font-mono text-slate-200">$${(s.tax / 12).toFixed(2)}</span></div>
                                    <div class="flex justify-between py-1"><span class="text-slate-400">Health / Other Deductions</span><span class="font-mono text-slate-200">$${(s.deductions / 12).toFixed(2)}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            // Employee Directory View (Admin)
            Employees: () => {
                const users = DayflowDB.getUsers();
                return `
                <div class="fade-slide-enter space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-extrabold tracking-tight">Organization Directory</h2>
                            <p class="text-xs text-slate-400">Manage all registered employees, inspect records, or revise roles and salaries.</p>
                        </div>
                        ${UI.Button('<i data-lucide="user-plus" class="w-4 h-4"></i> Add New Employee', 'primary', "Dayflow.setAuthMode('signup'); Dayflow.navigate('auth')", 'button', 'text-xs')}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${users.map(u => `
                            <div class="glass-panel rounded-3xl p-6 glass-card-interactive flex flex-col justify-between border border-white/10">
                                <div>
                                    <div class="flex justify-between items-start mb-4">
                                        <img src="${u.avatar}" class="w-14 h-14 rounded-2xl object-cover border-2 border-brand-500/30" />
                                        ${UI.StatusBadge(u.role)}
                                    </div>
                                    <h3 class="font-bold text-base text-slate-100">${u.name}</h3>
                                    <p class="text-xs text-brand-300 font-medium">${u.designation}</p>
                                    <p class="text-[11px] text-slate-400 mt-1 font-mono">${u.department} &bull; ${u.id}</p>
                                    
                                    <div class="mt-4 pt-3 border-t border-white/10 space-y-1.5 text-xs text-slate-300">
                                        <div class="flex items-center gap-2 truncate"><i data-lucide="mail" class="w-3.5 h-3.5 text-slate-400"></i> ${u.email}</div>
                                        <div class="flex items-center gap-2"><i data-lucide="phone" class="w-3.5 h-3.5 text-slate-400"></i> ${u.phone}</div>
                                    </div>
                                </div>

                                <div class="pt-6 grid grid-cols-2 gap-2">
                                    <button onclick="Dayflow.selectProfileUser('${u.id}')" class="px-3 py-2 rounded-xl glass-panel-subtle hover:bg-white/15 text-xs font-semibold text-slate-200 spring-transition">
                                        Inspect Profile
                                    </button>
                                    <button onclick="Dayflow.openEditSalaryModal('${u.id}')" class="px-3 py-2 rounded-xl bg-brand-500/15 hover:bg-brand-500/25 text-brand-300 text-xs font-bold border border-brand-500/30 spring-transition">
                                        Edit Salary
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            }
        };

        // Attendance Override Modal Builder for Admins
        Dayflow.openEditAttendanceModal = function(recordId) {
            const list = DayflowDB.getAttendance();
            const record = list.find(r => r.id === recordId);
            const users = DayflowDB.getUsers();
            if (!record) return;
            const u = users.find(user => user.id === record.user) || { name: 'Unknown' };

            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div id="modal-edit-attendance" class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-md" onclick="Dayflow.closeModal('modal-edit-attendance')"></div>
                    <div class="glass-panel w-full max-w-md rounded-3xl p-6 relative z-10 fade-slide-enter shadow-2xl border border-white/20">
                        <div class="flex justify-between items-center pb-4 border-b border-white/10 mb-4">
                            <h3 class="text-base font-bold">Edit Attendance Record</h3>
                            <button onclick="Dayflow.closeModal('modal-edit-attendance')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="Dayflow.saveAdminAttendanceEdit(event)" class="space-y-3.5">
                            <input id="att-edit-id" type="hidden" value="${record.id}" />
                            <div class="p-3 rounded-xl bg-white/5 border border-white/10 text-xs">
                                <span class="text-slate-400">Employee:</span> <strong class="text-slate-200">${u.name} (${record.user})</strong><br>
                                <span class="text-slate-400">Date:</span> <span class="font-mono text-slate-200">${record.date}</span>
                            </div>

                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-semibold text-slate-400">Attendance Status</label>
                                <select id="att-edit-status" class="glass-input rounded-xl p-2.5 text-xs bg-slate-900">
                                    <option value="Present" ${record.status === 'Present' ? 'selected' : ''}>Present</option>
                                    <option value="Absent" ${record.status === 'Absent' ? 'selected' : ''}>Absent</option>
                                    <option value="Half-day" ${record.status === 'Half-day' ? 'selected' : ''}>Half-day</option>
                                    <option value="Leave" ${record.status === 'Leave' ? 'selected' : ''}>Leave</option>
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div class="flex flex-col gap-1">
                                    <label class="text-xs font-semibold text-slate-400">Check-In Time</label>
                                    <input id="att-edit-checkin" type="text" value="${record.checkIn}" class="glass-input rounded-xl p-2.5 text-xs font-mono" />
                                </div>
                                <div class="flex flex-col gap-1">
                                    <label class="text-xs font-semibold text-slate-400">Check-Out Time</label>
                                    <input id="att-edit-checkout" type="text" value="${record.checkOut || ''}" placeholder="05:00 PM" class="glass-input rounded-xl p-2.5 text-xs font-mono" />
                                </div>
                            </div>

                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-semibold text-slate-400">Effective Work Duration</label>
                                <input id="att-edit-hours" type="text" value="${record.workHours}" placeholder="8h 30m" class="glass-input rounded-xl p-2.5 text-xs font-mono" />
                            </div>

                            <div class="pt-4 flex justify-end gap-3 border-t border-white/10">
                                ${UI.Button('Cancel', 'ghost', "Dayflow.closeModal('modal-edit-attendance')")}
                                ${UI.Button('Save Changes', 'primary', '', 'submit')}
                            </div>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        // Application Render Orchestrator
        function renderApp() {
            const root = document.getElementById('app-root');
            const route = Dayflow.state.route;
            let content = '';

            if (route === 'landing') {
                content = Views.Landing();
            } else if (route === 'auth') {
                content = Views.Auth();
            } else if (!Dayflow.state.user) {
                Dayflow.navigate('auth');
                return;
            } else {
                let viewContent = '';
                switch(route) {
                    case 'dashboard': 
                        viewContent = Dayflow.state.user.role === 'admin' ? Views.AdminDashboard() : Views.EmployeeDashboard(); 
                        break;
                    case 'profile': 
                        viewContent = Views.Profile(); 
                        break;
                    case 'attendance': 
                        viewContent = Views.Attendance(); 
                        break;
                    case 'leaves': 
                        viewContent = Views.Leaves(); 
                        break;
                    case 'payroll': 
                        viewContent = Views.Payroll(); 
                        break;
                    case 'employees': 
                        viewContent = Views.Employees(); 
                        break;
                    default: 
                        viewContent = `<div class="p-8 text-center glass-panel rounded-3xl mt-10 text-slate-400">Module View Not Found</div>`;
                }
                content = Views.DashboardLayout(viewContent);
            }

            root.innerHTML = content;
            lucide.createIcons();
        }

        // Initialize on DOM Ready
        document.addEventListener('DOMContentLoaded', () => {
            Dayflow.init();
        });
    </script>
</body>
</html>

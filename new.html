<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayflow HRMS – Human Resource Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .font-display { font-family: var(--font-display); }

    /* Premium Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
    .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); }

    /* Keyframes for Glassmorphism Blobs */
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 18s infinite alternate ease-in-out; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }

    /* UI Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    
    .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in-down { animation: fadeInDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-out { animation: fadeOut 0.25s forwards; }
    .animate-shake { animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

    /* Hide elements globally */
    .hidden-view { display: none !important; }

    @media print {
      body * { visibility: hidden; }
      #payslip-modal, #payslip-modal * { visibility: visible; }
      #payslip-modal { position: absolute; left: 0; top: 0; width: 100%; height: auto; background: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>

          if (card) {
            card.classList.remove('animate-shake');
            void card.offsetWidth; // Force reflow
            card.classList.add('animate-shake');
          }
          this.notify('Invalid email or password. Please verify credentials.', 'error', 'Authentication Failed');
        }
      },

      // Real Password Rules Validation Helper
      checkPasswordStrength(pwd) {
        return {
          length: pwd.length >= 8,
          upper: /[A-Z]/.test(pwd),
          number: /[0-9]/.test(pwd),
          special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd),
          isValid() { return this.length && this.upper && this.number && this.special; },
          score() {
            let s = 0;
            if (this.length) s++;
            if (this.upper) s++;
            if (this.number) s++;
            if (this.special) s++;
            return s;
          }
        };
      },

      handleSignupPasswordInput(pwd) {
        const strength = this.checkPasswordStrength(pwd);
        const bar = document.getElementById('pwd-strength-bar');
        const text = document.getElementById('pwd-strength-text');
        const reqLen = document.getElementById('req-len');
        const reqUpper = document.getElementById('req-upper');
        const reqNum = document.getElementById('req-num');
        const reqSpec = document.getElementById('req-spec');

        const updateReq = (el, passed) => {
          if (!el) return;
          el.className = `flex items-center gap-1.5 text-xs font-semibold ${passed ? 'text-emerald-500 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-500'}`;
          el.innerHTML = `<i data-lucide="${passed ? 'check-circle-2' : 'circle'}" class="w-3.5 h-3.5"></i> ${el.getAttribute('data-label')}`;
        };

        updateReq(reqLen, strength.length);
        updateReq(reqUpper, strength.upper);
        updateReq(reqNum, strength.number);
        updateReq(reqSpec, strength.special);

        const score = strength.score();
        const colors = ['w-0 bg-transparent', 'w-1/4 bg-rose-500', 'w-2/4 bg-amber-500', 'w-3/4 bg-blue-500', 'w-full bg-emerald-500'];
        const labels = ['None', 'Weak', 'Fair', 'Good', 'Strong'];

        if (bar) bar.className = `h-1.5 rounded-full transition-all duration-300 ${colors[score]}`;
        if (text) text.innerText = `Strength: ${labels[score]}`;
        lucide.createIcons();
      },

      handleSignup(e) {
        e.preventDefault();
        const empId = document.getElementById('su-empid').value.trim();
        const name = document.getElementById('su-name').value.trim();
        const email = document.getElementById('su-email').value.trim();
        const role = document.getElementById('su-role').value;
        const password = document.getElementById('su-pwd').value;
        const confirmPwd = document.getElementById('su-cpwd').value;

        // Check if email or employee ID already exists
        if (this.state.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
          this.notify('An account with this email already exists.', 'error', 'Signup Error');
          return;
        }

        if (this.state.users.some(u => u.employeeId.toUpperCase() === empId.toUpperCase())) {
          this.notify('Employee ID already registered. Use a unique ID.', 'error', 'Signup Error');
          return;
        }

        const strength = this.checkPasswordStrength(password);
        if (!strength.isValid()) {
          this.notify('Password does not meet all security requirements.', 'error', 'Weak Password');
          return;
        }

        if (password !== confirmPwd) {
          this.notify('Passwords do not match.', 'error', 'Password Mismatch');
          return;
        }

        // Generate simulated 6-digit verification code
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        this.state.generatedVerifyCode = code;

        // Store pending user
        this.state.signupPendingUser = {
          id: 'u' + (this.state.users.length + 1),
          employeeId: empId || `DF-${String(this.state.users.length + 1).padStart(3, '0')}`,
          name,
          email,
          password,
          role,
          department: role === 'admin' ? 'Management' : 'Engineering',
          designation: role === 'admin' ? 'HR Specialist' : 'Software Engineer',

          phone: '+1 (555) 000-0000',
          address: 'Dayflow Corporate HQ, 100 Flow Street',
          avatar: `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80`
        };

        this.state.authMode = 'verify';
        this.notify(`Verification code dispatched to ${email}. Code: ${code}`, 'info', 'Email Verification');

      // ==========================================

      checkIn() {
        const activeUser = this.state.currentUser; // Always clock in for the authenticated person
        const todayStr = this.state.currentDate.toISOString().split('T')[0];
        
        const existing = this.state.attendance.find(a => a.userId === activeUser.id && a.date === todayStr);
        if (existing) {
          this.notify('You have already clocked in today.', 'warning', 'Attendance');
          return;
        }

        const newRecord = {
          id: `a_${Date.now()}`,
          userId: activeUser.id,
          date: todayStr,
          checkIn: this.state.currentDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
          checkOut: null,
          status: 'Present'
        };
        
        this.state.attendance.unshift(newRecord);
        this.persist();
        this.addNotificationFeed('Attendance Logged', `Checked in at ${newRecord.checkIn}`, 'info', 'clock');
        this.notify('Clocked in successfully. Have a productive day!', 'success', 'Attendance Recorded');
        this.render();
      },

      checkOut() {
        const activeUser = this.state.currentUser;
        const todayStr = this.state.currentDate.toISOString().split('T')[0];
        const record = this.state.attendance.find(a => a.userId === activeUser.id && a.date === todayStr && !a.checkOut);
        
        if (record) {
          record.checkOut = this.state.currentDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
          this.persist();
          this.addNotificationFeed('Shift Completed', `Clocked out at ${record.checkOut}`, 'info', 'check-circle-2');
          this.notify('Clocked out successfully. Enjoy your evening!', 'success', 'Attendance Updated');
          this.render();
        } else {
          this.notify('No active check-in found to clock out from.', 'error', 'Error');
        }

      adminRecordAttendance(event) {

        const date = document.getElementById('man-date').value;
        const checkIn = document.getElementById('man-in').value || null;
        const checkOut = document.getElementById('man-out').value || null;
        const status = document.getElementById('man-status').value;

        // Check if record exists for this user and date
        const idx = this.state.attendance.findIndex(a => a.userId === userId && a.date === date);
        if (idx >= 0) {
          this.state.attendance[idx] = { ...this.state.attendance[idx], checkIn, checkOut, status };
        } else {
          this.state.attendance.unshift({
            id: `a_${Date.now()}`,
            userId,
            date,
            checkIn,
            checkOut,

        this.notify('Attendance record saved successfully.', 'success', 'Admin Attendance');

      // ==========================================
      // LEAVE MANAGEMENT METHODS (PDF 3.5)
      // ==========================================
      applyLeave(event) {
        event.preventDefault();
        const user = this.state.currentUser;
        const type = document.getElementById('leave-type').value;
        const startDate = document.getElementById('leave-start').value;
        const endDate = document.getElementById('leave-end').value;
        const remarks = document.getElementById('leave-remarks').value;

        if (!startDate || !endDate) {
          this.notify('Please specify both start and end dates.', 'error', 'Validation Error');
          return;
        }

        const d1 = new Date(startDate);
        const d2 = new Date(endDate);
        if (d2 < d1) {
          this.notify('End date cannot be earlier than start date.', 'error', 'Date Error');
          return;
        }

        const diffTime = Math.abs(d2 - d1);
        const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        const newLeave = {
          id: `l_${Date.now()}`,
          userId: user.id,
          type,
          startDate,
          endDate,
          remarks: remarks || 'No remarks provided',
          adminComment: '',
          status: 'Pending',
          days: days > 0 ? days : 1
        };

        this.state.leaves.unshift(newLeave);
        this.persist();
        this.addNotificationFeed('New Leave Application', `${user.name} applied for ${days} day(s) of ${type}.`, 'info', 'calendar');
        this.notify('Leave application submitted for HR review.', 'success', 'Application Sent');
        this.closeModal();
        this.render();
      },

      saveSalaryStructure(e, userId) {
        e.preventDefault();

          return;
        }

        const user = this.state.users.find(u => u.id === userId);
        if (user) {

          user.salary = base;
          this.persist();
          this.addNotificationFeed('Salary Updated', `Annual compensation adjusted to $${base.toLocaleString()}/yr for ${user.name}.`, 'info', 'file-text');

        this.closeModal();
        this.render();

      // ==========================================
      // UI COMPONENT HELPERS
      // ==========================================
      ui: {
        GlassCard: (content, className = '', padding = 'p-6', hover = false) => `
          <div class="relative overflow-hidden rounded-[2rem] bg-white/70 dark:bg-[#0f172a]/70 backdrop-blur-[40px] saturate-[1.2] border border-white/70 dark:border-white/[0.08] shadow-[0_8px_32px_rgba(0,0,0,0.04)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.25)] transition-all duration-300 ${hover ? 'hover:-translate-y-1 hover:shadow-[0_16px_48px_rgba(0,0,0,0.08)] dark:hover:shadow-[0_16px_48px_rgba(0,0,0,0.4)] hover:bg-white/90 dark:hover:bg-[#0f172a]/90' : ''} ${padding} ${className}">
            <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent dark:from-white/5 dark:to-transparent pointer-events-none"></div>
            <div class="relative z-10">${content}</div>
          </div>
        `,
        Button: (text, icon = '', variant = 'primary', onclick = '', className = '', type = 'button') => {
          const variants = {
            primary: "bg-gradient-to-b from-indigo-500 to-indigo-600 text-white shadow-[0_4px_20px_rgba(99,102,241,0.3)] hover:shadow-[0_8px_25px_rgba(99,102,241,0.5)] hover:from-indigo-400 hover:to-indigo-500 border border-indigo-400/20",
            secondary: "bg-white/70 dark:bg-white/10 text-slate-700 dark:text-slate-200 border border-white/70 dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/20 backdrop-blur-md shadow-sm",
            ghost: "text-slate-600 dark:text-slate-300 hover:bg-slate-100/60 dark:hover:bg-white/10 rounded-xl",
            danger: "bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20 border border-rose-500/20",
            success: "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/20",
            icon: "p-2.5 rounded-2xl bg-white/70 dark:bg-white/10 text-slate-700 dark:text-slate-300 border border-white/70 dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/20 backdrop-blur-md shadow-sm transition-transform hover:scale-105"
          };
          const base = variant === 'icon' ? '' : 'px-5 py-2.5';
          const iconHTML = icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : '';
          return `<button type="${type}" ${onclick ? `onclick="${onclick}"` : ''} class="inline-flex items-center justify-center gap-2 font-semibold rounded-2xl transition-all duration-200 active:scale-[0.98] disabled:opacity-50 ${variants[variant]} ${base} ${className}">${iconHTML} ${text}</button>`;
        },
        Badge: (text, variant = 'default', className = '') => {
          const variants = {
            default: "bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300 border-slate-200 dark:border-white/5",
            success: "bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/20",
            warning: "bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-400 border-amber-200 dark:border-amber-500/20",
            danger: "bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-400 border-rose-200 dark:border-rose-500/20",
            info: "bg-indigo-100 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-400 border-indigo-200 dark:border-indigo-500/20",
          };
          return `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold border shadow-sm ${variants[variant]} ${className}">${text}</span>`;
        },
        Avatar: (src, size = 'md', className = '', onclick = '') => {
          const sizes = { sm: "w-8 h-8", md: "w-10 h-10", lg: "w-16 h-16", xl: "w-24 h-24" };
          return `<div ${onclick ? `onclick="${onclick}"` : ''} class="relative rounded-full p-[2px] bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-md ${sizes[size]} ${className} ${onclick ? 'cursor-pointer' : ''}"><img src="${src}" alt="Avatar" class="rounded-full w-full h-full object-cover border border-white dark:border-slate-900 bg-slate-100 dark:bg-slate-800" /></div>`;
        },
        Input: (id, label, type, value = '', placeholder = '', required = false, readonly = false, oninput = '') => `
          <div class="space-y-1.5 w-full">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">${label}</label>
            <input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}" ${required?'required':''} ${readonly?'readonly disabled':''} ${oninput ? `oninput="${oninput}"` : ''}
              class="w-full px-4 py-3 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/70 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md transition-all shadow-inner disabled:opacity-60 disabled:cursor-not-allowed" />

        `
      },

          const icons = { success: 'check-circle-2', error: 'alert-triangle', info: 'bell', warning: 'clock' };

            success: 'text-emerald-500 bg-emerald-100 dark:bg-emerald-500/20', 
            error: 'text-rose-500 bg-rose-100 dark:bg-rose-500/20', 
            info: 'text-indigo-500 bg-indigo-100 dark:bg-indigo-500/20',
            warning: 'text-amber-500 bg-amber-100 dark:bg-amber-500/20'
          };
          return `
            <div id="${note.id}" class="animate-slide-up pointer-events-auto">
              ${this.ui.GlassCard(`
                <div class="flex items-start gap-3">
                  <div class="p-2 rounded-xl flex-shrink-0 ${colors[note.type]}"><i data-lucide="${icons[note.type]}" class="w-4 h-4"></i></div>

      renderAuth() {

        const todayStr = this.state.currentDate.toISOString().split('T')[0];

        const totalEmployees = this.state.users.filter(usr => usr.role === 'employee').length;
        const todayAttendance = this.state.attendance.filter(a => a.date === todayStr && a.status === 'Present').length;

        const StatCard = (title, value, subtitle, icon, colorClass, gradientClass) => this.ui.GlassCard(`
          <div class="flex justify-between items-start mb-4">
            <div class="p-3 rounded-2xl ${gradientClass} shadow-lg shadow-${colorClass}-500/20">

            ${subtitle ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-500 dark:bg-white/10 dark:text-indigo-400">${subtitle}</span>` : ''}

          <div>
            <h3 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">${value}</h3>

          </div>
        `, 'flex flex-col justify-between h-full group', 'p-5', true);

        const pastDays = ['2026-08-17', '2026-08-18', '2026-08-19', '2026-08-20', '2026-08-21', '2026-08-22'];
        const dayLabels = ['Mon 17', 'Tue 18', 'Wed 19', 'Thu 20', 'Fri 21', 'Sat 22'];
        const trendData = pastDays.map(d => {
          const totalStaff = this.state.users.length;
          const presentStaff = this.state.attendance.filter(a => a.date === d && (a.status === 'Present' || a.status === 'Half-day')).length;
          const pct = Math.round((presentStaff / totalStaff) * 100);
          return { date: d, pct: pct > 0 ? pct : 20, present: presentStaff, total: totalStaff };
        });

        const realChartHTML = `
          <div class="w-full h-36 flex items-end gap-2 sm:gap-3 mt-4 pt-4">
            ${trendData.map((item, idx) => `
              <div class="flex-1 group relative flex flex-col justify-end h-full items-center">
                <div class="text-[10px] text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity font-bold mb-1">${item.pct}%</div>
                <div class="w-full bg-gradient-to-t from-indigo-500/30 to-indigo-500 rounded-xl group-hover:from-indigo-400/50 group-hover:to-indigo-400 transition-all duration-300 shadow-sm" style="height: ${item.pct}%"></div>
                <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 mt-2">${dayLabels[idx]}</span>
              </div>
            `).join('')}
          </div>
        `;

        let html = `<div class="space-y-8 animate-fade-in-up">`;

        // Impersonation Banner if Active
        if (this.state.impersonatedUserId) {
          html += `
            <div class="p-4 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <i data-lucide="eye" class="w-5 h-5 text-amber-500"></i>

              <button onclick="window.app.setImpersonation(null)" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition-all shadow-sm">Exit to Admin</button>
            </div>
          `;
        }

        // Top Stat Cards
        html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">`;
        if (isAdmin) {
          html += StatCard('Total Headcount', this.state.users.length, 'All Teams', 'users', 'indigo', 'bg-gradient-to-br from-indigo-500 to-indigo-600');
          html += StatCard('Present Today', `${todayAttendance}/${this.state.users.length}`, `${Math.round((todayAttendance/this.state.users.length)*100)}% Turnout`, 'check-circle-2', 'emerald', 'bg-gradient-to-br from-emerald-500 to-teal-600');
          html += StatCard('Pending Approvals', pendingLeaves.length, 'Requires Action', 'calendar', 'amber', 'bg-gradient-to-br from-amber-500 to-orange-500');
          html += StatCard('Monthly Payroll', `$${Math.round(this.state.users.reduce((a,c)=>a+c.salary/12*0.75,0)).toLocaleString()}`, 'Aug Payout', 'file-text', 'purple', 'bg-gradient-to-br from-purple-500 to-fuchsia-600');
        } else {
          // Employee Stats
          const approvedPaidDays = this.state.leaves.filter(l => l.userId === u.id && l.type === 'Paid Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days, 0);
          const remainingPaid = Math.max(0, 15 - approvedPaidDays);
          const myPending = this.state.leaves.filter(l => l.userId === u.id && l.status === 'Pending').length;

                  <div class="space-y-3">

                            <button onclick="window.app.openLeaveReviewModal('${l.id}', 'Rejected')" class="px-3 py-1.5 bg-rose-500/15 hover:bg-rose-500 text-rose-600 hover:text-white text-xs font-bold rounded-xl transition-all">Reject</button>

              <!-- Column 3: Quick Employee List & Actions -->

      // ==========================================
      // ATTENDANCE VIEW (PDF 3.4)
      // Bug Fix: Admins see all employee records, Employees see own
      // ==========================================
      renderAttendance() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        const todayStr = this.state.currentDate.toISOString().split('T')[0];

        // 1. Dynamic Current Week Calculation for Employee View (PDF 3.4)
        const weekDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const weekDates = ['2026-08-17', '2026-08-18', '2026-08-19', '2026-08-20', '2026-08-21'];
        
        const weeklyHTML = `
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-white/40 dark:bg-black/20 rounded-3xl p-4 border border-white/60 dark:border-white/5 shadow-inner">
             ${weekDates.map((dateStr, i) => {
               const rec = this.state.attendance.find(a => a.userId === activeUser.id && a.date === dateStr);
               const status = rec ? rec.status : 'Absent';
               const icon = status==='Present' ? 'check-circle-2' : status==='Half-day' ? 'clock' : status==='Leave' ? 'calendar-days' : 'x-circle';
               const colorClass = status==='Present' ? 'border-emerald-500 bg-emerald-500/10 text-emerald-500' : status==='Half-day' ? 'border-amber-500 bg-amber-500/10 text-amber-500' : status==='Leave' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-500' : 'border-rose-500 bg-rose-500/10 text-rose-500';
               return `
                 <div class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-white/30 dark:bg-white/5 border border-white/40 dark:border-white/5">
                    <div class="text-center">
                      <span class="block text-[11px] font-bold text-slate-400 uppercase">${weekDays[i].slice(0,3)}</span>
                      <span class="block text-sm font-bold text-slate-900 dark:text-white">${dateStr.slice(-2)} Aug</span>
                    </div>
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center border-2 shadow-sm ${colorClass}">
                      <i data-lucide="${icon}" class="w-5 h-5"></i>
                    </div>
                    <span class="text-[11px] font-semibold">${status}</span>
                 </div>`;
             }).join('')}
          </div>
        `;

        // Check in / Check out Logic
        const todayRecord = this.state.attendance.find(a => a.userId === this.state.currentUser.id && a.date === todayStr);
        const isCheckedIn = todayRecord && !todayRecord.checkOut;
        const isCheckedOut = todayRecord && todayRecord.checkOut;

        let punchActionBtn = '';
        if (!isCheckedOut) {
          if (isCheckedIn) {
            punchActionBtn = this.ui.Button('Clock Out (End Shift)', 'log-out', 'primary', 'window.app.checkOut()', 'w-full py-3.5 text-base bg-gradient-to-b from-amber-500 to-orange-500 shadow-amber-500/30 hover:from-amber-400 hover:to-amber-500 border-none');
          } else {
            punchActionBtn = this.ui.Button('Clock In Now', 'log-in', 'primary', 'window.app.checkIn()', 'w-full py-3.5 text-base shadow-indigo-500/30');
          }
        } else {
          punchActionBtn = `<div class="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs font-bold text-center">✓ Daily Shift Completed (${todayRecord.checkIn} - ${todayRecord.checkOut})</div>`;
        }

        // Attendance Table
        let displayRecords = [];
        if (isAdmin) {
          // Admin Master Attendance View with Search & Filter
          displayRecords = this.state.attendance;
          if (this.state.attendanceFilterStatus !== 'ALL') {
            displayRecords = displayRecords.filter(r => r.status === this.state.attendanceFilterStatus);
          }
          if (this.state.attendanceDateFilter) {
            displayRecords = displayRecords.filter(r => r.date === this.state.attendanceDateFilter);
          }
          if (this.state.attendanceSearchQuery) {
            const q = this.state.attendanceSearchQuery.toLowerCase();
            displayRecords = displayRecords.filter(r => {
              const u = this.state.users.find(usr => usr.id === r.userId);
              return u && (u.name.toLowerCase().includes(q) || u.employeeId.toLowerCase().includes(q) || u.department.toLowerCase().includes(q));
            });
          }
        } else {
          // Employee sees only their own
          displayRecords = this.state.attendance.filter(a => a.userId === activeUser.id);
        }

        const rows = displayRecords.map(record => {
          const user = this.state.users.find(u => u.id === record.userId) || { name: 'Unknown', avatar: '', department: 'N/A' };
          const badgeVariant = record.status === 'Present' ? 'success' : record.status === 'Half-day' ? 'warning' : record.status === 'Leave' ? 'info' : 'danger';

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-3.5 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(user.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${user.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">${user.department}</p>
                  </div>
                </td>
              ` : `<td class="px-5 py-3.5 font-bold text-slate-900 dark:text-white rounded-l-2xl text-xs">${record.date}</td>`}
              ${isAdmin ? `<td class="px-5 py-3.5 text-xs font-medium text-slate-600 dark:text-slate-400">${record.date}</td>` : ''}
              <td class="px-5 py-3.5 text-xs font-semibold text-slate-700 dark:text-slate-300">${record.checkIn || '—'}</td>
              <td class="px-5 py-3.5 text-xs font-semibold text-slate-700 dark:text-slate-300">${record.checkOut || '—'}</td>
              <td class="px-5 py-3.5 rounded-r-2xl">${this.ui.Badge(record.status, badgeVariant)}</td>
            </tr>
          `;
        }).join('');

        // Admin Manual Punch Modal
        const manualModal = `
          <div id="manual-attendance-modal" class="hidden-view fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center pb-4 border-b border-white/20 dark:border-white/10 mb-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">Record / Adjust Attendance</h3>
                <button onclick="window.app.closeModal('manual-attendance-modal')" class="p-2 text-slate-400 hover:text-white rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>

              <form onsubmit="window.app.adminRecordAttendance(event)" class="space-y-4">
                <div class="space-y-1.5 w-full">
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Select Employee</label>
                  <select id="man-user" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-sm">
                    ${this.state.users.map(u => `<option value="${u.id}" class="bg-white dark:bg-slate-800">${u.name} (${u.employeeId})</option>`).join('')}
                  </select>
                </div>

                ${this.ui.Input('man-date', 'Date', 'date', todayStr, '', true)}

                <div class="grid grid-cols-2 gap-3">
                  ${this.ui.Input('man-in', 'Check-In Time', 'text', '09:00 AM', '09:00 AM')}
                  ${this.ui.Input('man-out', 'Check-Out Time', 'text', '05:00 PM', '05:00 PM')}
                </div>

                <div class="space-y-1.5 w-full">
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Attendance Status</label>
                  <select id="man-status" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-sm">
                    <option value="Present" class="bg-white dark:bg-slate-800">Present</option>
                    <option value="Half-day" class="bg-white dark:bg-slate-800">Half-day</option>
                    <option value="Absent" class="bg-white dark:bg-slate-800">Absent</option>
                    <option value="Leave" class="bg-white dark:bg-slate-800">Leave</option>
                  </select>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-200 dark:border-white/10">
                  ${this.ui.Button('Cancel', '', 'secondary', 'window.app.closeModal("manual-attendance-modal")')}
                  ${this.ui.Button('Save Record', 'check', 'primary', '', '', 'submit')}
                </div>
              </form>
            `, 'w-full max-w-md shadow-2xl relative', 'p-6')}
          </div>
        `;

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Attendance & Timesheets</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Master organization attendance tracker and manual timesheet logger.' : 'Track your daily shift logs and weekly work hours.'}</p>
              </div>
              ${isAdmin ? this.ui.Button('Manual Attendance Punch', 'plus-circle', 'primary', 'window.app.openModal("manual-attendance-modal")') : ''}
            </div>

            <!-- Employee Top Section: Live Punch Widget + Current Week -->
            ${!isAdmin ? `
              <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                ${this.ui.GlassCard(`
                  <div class="w-24 h-24 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 dark:from-indigo-900/30 dark:to-purple-900/30 flex items-center justify-center mb-4 shadow-inner border border-white/50 dark:border-white/10 relative mx-auto">
                     <div class="absolute inset-2 rounded-full border border-indigo-500/30 animate-[spin_12s_linear_infinite] border-dashed"></div>
                     <i data-lucide="clock" class="w-10 h-10 text-indigo-600 dark:text-indigo-400"></i>
                  </div>
                  <h3 class="text-4xl font-extrabold text-slate-900 dark:text-white mb-1 font-display tracking-tight text-center">${this.state.currentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mb-6 font-medium text-center">${this.state.currentDate.toDateString()}</p>
                  <div class="w-full">${punchActionBtn}</div>
                `, 'text-center flex flex-col items-center justify-center p-6')}

                <div class="xl:col-span-2 space-y-4">
                  ${this.ui.GlassCard(`
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-4">Current Week Timesheet (Aug 17 – Aug 21)</h3>
                    ${weeklyHTML}
                  `)}
                </div>
              </div>
            ` : ''}

            <!-- Master Attendance Filter Controls for Admin -->
            ${isAdmin ? `
              <div class="flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
                <div class="flex-1 min-w-[200px] relative">
                  <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input type="text" placeholder="Search employee by name, ID or department..." value="${this.state.attendanceSearchQuery}" oninput="window.app.state.attendanceSearchQuery = this.value; window.app.render();" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
                </div>
                
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-slate-400">Date:</span>
                  <input type="date" value="${this.state.attendanceDateFilter}" onchange="window.app.state.attendanceDateFilter = this.value; window.app.render();" class="px-3 py-1.5 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 font-medium" />
                  ${this.state.attendanceDateFilter ? `<button onclick="window.app.state.attendanceDateFilter = ''; window.app.render();" class="text-xs text-indigo-500 hover:underline">Show All Dates</button>` : ''}
                </div>

                <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs">
                  ${['ALL', 'Present', 'Half-day', 'Absent', 'Leave'].map(st => `
                    <button onclick="window.app.state.attendanceFilterStatus = '${st}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.attendanceFilterStatus === st ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${st}</button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Master Attendance Table -->
            ${this.ui.GlassCard(`
              <div class="p-5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'Master Attendance Ledger' : 'My Attendance History'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${displayRecords.length} record${displayRecords.length!==1?'s':''} found</span>

                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : ''}

                </table>

            `, 'p-0')}

            ${manualModal}
          </div>

      // ==========================================
      // LEAVE MANAGEMENT VIEW (PDF 3.5)
      // ==========================================
      renderLeaves() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        const displayLeaves = isAdmin ? this.state.leaves : this.state.leaves.filter(l => l.userId === activeUser.id);

        const rows = displayLeaves.map(leave => {
          const user = this.state.users.find(u => u.id === leave.userId) || { name: 'Unknown', avatar: '' };
          const badgeVariant = leave.status === 'Approved' ? 'success' : leave.status === 'Rejected' ? 'danger' : 'warning';
          
          let actions = '';
          if (isAdmin) {
            if (leave.status === 'Pending') {
              actions = `
                <div class="flex gap-2">
                  <button onclick="window.app.openLeaveReviewModal('${leave.id}', 'Approved')" class="p-2 text-emerald-500 hover:bg-emerald-500/15 rounded-xl transition-all" title="Approve Request"><i data-lucide="check" class="w-4 h-4"></i></button>
                  <button onclick="window.app.openLeaveReviewModal('${leave.id}', 'Rejected')" class="p-2 text-rose-500 hover:bg-rose-500/15 rounded-xl transition-all" title="Reject Request"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>`;
            } else {
              actions = `<button onclick="window.app.openLeaveReviewModal('${leave.id}', '${leave.status}')" class="text-[11px] font-bold text-slate-400 hover:text-indigo-500 hover:underline">Re-review</button>`;
            }
          }

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(user.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${user.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">DF-${user.id}</p>
                  </div>
                </td>
              ` : ''}
              <td class="px-5 py-4 font-bold text-slate-800 dark:text-slate-200 text-xs ${!isAdmin?'rounded-l-2xl':''}">${leave.type}</td>
              <td class="px-5 py-4 text-xs font-medium text-slate-600 dark:text-slate-400">${leave.startDate} to ${leave.endDate}</td>
              <td class="px-5 py-4 text-xs font-bold text-slate-600 dark:text-slate-400">${leave.days} day${leave.days>1?'s':''}</td>
              <td class="px-5 py-4">
                <div class="flex flex-col gap-1">
                  ${this.ui.Badge(leave.status, badgeVariant)}
                  ${leave.adminComment ? `<span class="text-[10px] text-slate-400 italic">HR Note: "${leave.adminComment}"</span>` : ''}
                </div>
              </td>
              ${isAdmin ? `<td class="px-5 py-4 rounded-r-2xl">${actions}</td>` : '<td class="rounded-r-2xl"></td>'}
            </tr>`;
        }).join('');

        // PDF 3.5 Leave balance computation: Paid Leave, Sick Leave, Unpaid Leave
        let balanceCards = '';
        if (!isAdmin) {
          const quota = [
            { type: 'Paid Leave', total: 15, used: this.state.leaves.filter(l => l.userId === activeUser.id && l.type === 'Paid Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days,0) },
            { type: 'Sick Leave', total: 10, used: this.state.leaves.filter(l => l.userId === activeUser.id && l.type === 'Sick Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days,0) },
            { type: 'Unpaid Leave', total: 0, used: this.state.leaves.filter(l => l.userId === activeUser.id && l.type === 'Unpaid Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days,0) }
          ];

          balanceCards = `
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
              ${quota.map(q => {
                const remaining = q.total ? Math.max(0, q.total - q.used) : 'Flexible';
                const pct = q.total ? Math.round(((q.total - q.used) / q.total) * 100) : 100;
                return this.ui.GlassCard(`
                  <div class="flex justify-between items-start mb-3">
                    <p class="text-xs font-bold text-slate-400 dark:text-slate-400 uppercase tracking-wider">${q.type}</p>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500">${q.used} used</span>
                  </div>
                  <p class="text-3xl font-extrabold text-slate-900 dark:text-white mb-3 font-display">${remaining} ${q.total ? 'Days' : ''}</p>
                  ${q.total ? `
                    <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-700/50 rounded-full overflow-hidden">
                      <div class="h-full bg-indigo-500 rounded-full" style="width: ${pct}%"></div>
                    </div>
                  ` : `<p class="text-[11px] text-slate-400">Subject to HR approval</p>`}
                `, 'p-5', '', true);
              }).join('')}
            </div>
          `;
        }

        const applyModal = `
          <div id="apply-leave-modal" class="hidden-view fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center pb-4 border-b border-white/20 dark:border-white/10 mb-6">
                <div>
                  <h3 class="text-xl font-bold text-slate-900 dark:text-white">Apply for Time Off</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Submit a formal request for manager approval</p>
                </div>
                <button onclick="window.app.closeModal('apply-leave-modal')" class="p-2 text-slate-400 hover:text-white rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>

              <form onsubmit="window.app.applyLeave(event)" class="space-y-4">
                <div class="space-y-1.5 w-full">
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Leave Category</label>
                  <select id="leave-type" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-sm">
                    <option value="Paid Leave" class="bg-white dark:bg-slate-800">Paid Leave (Annual / Vacation)</option>
                    <option value="Sick Leave" class="bg-white dark:bg-slate-800">Sick Leave (Medical)</option>
                    <option value="Unpaid Leave" class="bg-white dark:bg-slate-800">Unpaid Leave (Personal)</option>
                  </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  ${this.ui.Input('leave-start', 'Start Date', 'date', '', '', true)}
                  ${this.ui.Input('leave-end', 'End Date', 'date', '', '', true)}
                </div>

                ${this.ui.Input('leave-remarks', 'Reason / Remarks', 'text', '', 'e.g. Attending family wedding')}

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-200 dark:border-white/10">
                  ${this.ui.Button('Cancel', '', 'secondary', 'window.app.closeModal("apply-leave-modal")')}
                  ${this.ui.Button('Submit Application', 'send', 'primary', '', '', 'submit')}
                </div>
              </form>
            `, 'w-full max-w-lg shadow-2xl relative', 'p-6 sm:p-8')}
          </div>
        `;

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Time Off & Leave Management</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Review, approve, or reject employee leave requests with comments.' : 'Check your leave quotas and track application statuses.'}</p>
              </div>
              ${!isAdmin ? this.ui.Button('Apply for Time Off', 'calendar-plus', 'primary', 'window.app.openModal("apply-leave-modal")') : ''}
            </div>

            ${balanceCards}

            ${this.ui.GlassCard(`
              <div class="p-5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'All Organization Leave Requests' : 'My Leave Applications'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${displayLeaves.length} record${displayLeaves.length!==1?'s':''}</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : ''}
                      <th class="px-5 py-3">Leave Type</th>
                      <th class="px-5 py-3">Duration</th>
                      <th class="px-5 py-3">Days</th>
                      <th class="px-5 py-3">Status & HR Feedback</th>
                      ${isAdmin ? '<th class="px-5 py-3">Review Action</th>' : '<th></th>'}
                    </tr>
                  </thead>
                  <tbody>${rows.length ? rows : `<tr><td colspan="6" class="text-center py-8 text-xs text-slate-400">No leave records found.</td></tr>`}</tbody>
                </table>
              </div>
            `, 'p-0')}

            ${applyModal}
          </div>
        `;
      },

      // ==========================================
      // PROFILE VIEW (PDF 3.3)
      // Employee: Edit Address, Phone, Photo (Name/Email/Role Read-Only)
      // Admin: Full Edit Capability
      // ==========================================
      renderProfile() {
        const u = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin';

        const docs = ['Employment_Agreement.pdf', 'Employee_Handbook_2026.pdf', 'W4_Tax_Form.pdf'].map(doc => `
          <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 hover:border-indigo-500/50 hover:shadow-md transition-all group">
             <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-xl bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400"><i data-lucide="file-text" class="w-4 h-4"></i></div>
                <span class="text-xs font-bold text-slate-700 dark:text-slate-300 truncate w-32">${doc}</span>
             </div>
             <button onclick="window.app.notify('Downloading ${doc}...', 'info')" class="p-2 text-slate-400 hover:text-indigo-500 rounded-lg"><i data-lucide="download" class="w-4 h-4"></i></button>
          </div>
        `).join('');

        return `
          <div class="max-w-5xl mx-auto space-y-8 animate-fade-in-up mt-12">
            ${this.ui.GlassCard(`
              <div class="absolute -top-12 left-8 group relative">
                ${this.ui.Avatar(u.avatar, 'xl', 'shadow-2xl border-4 border-white dark:border-slate-800 cursor-pointer', 'window.app.openAvatarPicker()')}
                <button onclick="window.app.openAvatarPicker()" class="absolute bottom-1 right-1 p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full shadow-lg transition-transform hover:scale-110" title="Change Photo">
                  <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                </button>
              </div>

              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pt-4 pl-0 sm:pl-[7.5rem]">
                <div>
                  <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">${u.name}</h2>
                  <p class="text-sm font-semibold text-slate-500 dark:text-slate-400 mt-0.5">${u.designation} • ${u.department}</p>
                  <div class="mt-3 flex gap-2">
                    ${this.ui.Badge(u.employeeId, 'info')}
                    ${this.ui.Badge(u.role === 'admin' ? 'HR Administrator' : 'Staff Employee', u.role === 'admin' ? 'info' : 'default')}
                  </div>
                </div>

                ${isAdmin && u.id !== this.state.currentUser.id ? `
                  ${this.ui.Button('Admin Edit All Fields', 'edit', 'primary', `window.app.openEditEmployeeModal('${u.id}')`, '!text-xs')}
                ` : ''}
              </div>

              <form onsubmit="window.app.saveSelfProfile(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Editable Contact Info (PDF 3.3) -->
                <div class="space-y-4 bg-white/30 dark:bg-black/10 p-5 rounded-3xl border border-white/50 dark:border-white/5 shadow-inner">
                  <div class="flex justify-between items-center border-b border-slate-200 dark:border-white/10 pb-3 mb-2">
                    <div>
                      <h4 class="font-bold text-sm text-slate-900 dark:text-white">Contact & Address</h4>
                      <p class="text-[11px] text-slate-400">Editable by employee</p>
                    </div>
                    ${this.ui.Button('Save Changes', 'save', 'primary', '', '!py-1.5 !px-3 text-xs', 'submit')}
                  </div>
                  ${this.ui.Input('prof-phone', 'Phone Number', 'text', u.phone, '+1 (555) 000-0000', true)}
                  ${this.ui.Input('prof-address', 'Residential Address', 'text', u.address || '', 'Street, City, State, ZIP', true)}
                  <p class="text-[11px] text-slate-400 italic">Click on your avatar above to upload or choose a new profile photo.</p>
                </div>

                <!-- Read-Only Organizational Info (PDF 3.3) -->
                <div class="space-y-4 bg-white/30 dark:bg-black/10 p-5 rounded-3xl border border-white/50 dark:border-white/5 shadow-inner">
                  <div class="border-b border-slate-200 dark:border-white/10 pb-3 mb-2 flex justify-between items-center">
                    <div>
                      <h4 class="font-bold text-sm text-slate-900 dark:text-white">Official Job Information</h4>
                      <p class="text-[11px] text-slate-400">Locked (HR Managed)</p>
                    </div>
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
                  </div>
                  ${this.ui.Input('j-name', 'Full Legal Name', 'text', u.name, '', false, true)}
                  ${this.ui.Input('j-email', 'Work Email', 'text', u.email, '', false, true)}
                  <div class="grid grid-cols-2 gap-3">
                    ${this.ui.Input('j-dep', 'Department', 'text', u.department, '', false, true)}
                    ${this.ui.Input('j-join', 'Joined On', 'text', u.joinDate, '', false, true)}
                  </div>
                  ${this.ui.Input('j-sal', 'Annual Compensation', 'text', '$' + u.salary.toLocaleString() + ' / year', '', false, true)}
                </div>
              </form>

              <!-- Essential Documents -->
              <div class="mt-6 bg-white/30 dark:bg-black/10 p-5 rounded-3xl border border-white/50 dark:border-white/5 shadow-inner">
                <h4 class="font-bold text-sm text-slate-900 dark:text-white border-b border-slate-200 dark:border-white/10 pb-3 mb-4 flex items-center gap-2">
                   <i data-lucide="folder" class="w-4 h-4 text-indigo-500"></i> Official Records & Documents
                </h4>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${docs}</div>
              </div>
            `, 'relative overflow-visible', 'px-6 sm:px-8 pb-8 pt-6')}
          </div>
        `;
      },

      // ==========================================
      // PAYROLL VIEW (PDF 3.6)
      // ==========================================
      renderPayroll() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        
        // Admin master list vs Employee payslips
        const dataList = isAdmin ? this.state.users : [
          { ...activeUser, month: 'August 2026', status: 'Paid' },
          { ...activeUser, month: 'July 2026', status: 'Paid' },
          { ...activeUser, month: 'June 2026', status: 'Paid' }
        ];

        const rows = dataList.map(row => {
          const baseYearly = row.salary;
          const grossMonthly = Math.round(baseYearly / 12);
          const netMonthly = Math.round(grossMonthly * 0.75);

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(row.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${row.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">${row.department}</p>
                  </div>
                </td>
              ` : `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white rounded-l-2xl text-xs">${row.month}</td>
              `}
              <td class="px-5 py-4 text-xs font-semibold text-slate-600 dark:text-slate-300">$${baseYearly.toLocaleString()}</td>
              <td class="px-5 py-4 text-xs font-bold text-indigo-600 dark:text-indigo-400">$${netMonthly.toLocaleString()}/mo</td>
              <td class="px-5 py-4">${this.ui.Badge('Paid', 'success')}</td>
              <td class="px-5 py-4 rounded-r-2xl">
                <div class="flex gap-2">
                  <button onclick="window.app.openPayslipModal('${row.name}', '${row.month || 'August 2026'}')" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all flex items-center gap-1">
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Payslip
                  </button>
                  ${isAdmin ? `
                    <button onclick="window.app.openEditSalaryModal('${row.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500 text-indigo-600 hover:text-white text-xs font-bold transition-all flex items-center gap-1">
                      <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Edit Salary
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `;
        }).join('');

        let adminWidgets = '';
        if (isAdmin) {
          const totalNetRun = this.state.users.reduce((acc, u) => acc + Math.round((u.salary / 12) * 0.75), 0);
          adminWidgets = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
               ${this.ui.GlassCard(`
                 <div>
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Monthly Payroll Run</p>
                   <p class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">$${totalNetRun.toLocaleString()}</p>
                   <p class="text-[11px] text-slate-400 mt-1">${this.state.users.length} active staff compensation</p>
                 </div>
                 <div class="p-3.5 bg-indigo-100 dark:bg-indigo-500/20 rounded-2xl text-indigo-500"><i data-lucide="dollar-sign" class="w-6 h-6"></i></div>
               `, 'flex justify-between items-center', 'p-6')}
               
               ${this.ui.GlassCard(`
                 <div class="relative w-20 h-20 rounded-full flex items-center justify-center shadow-lg flex-shrink-0" style="background: conic-gradient(from 0deg, #6366f1 0% 75%, #ef4444 75% 90%, #10b981 90% 100%)">
                   <div class="w-14 h-14 bg-slate-50 dark:bg-slate-900 rounded-full shadow-inner"></div>
                 </div>
                 <div>
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Breakdown</p>
                   <ul class="space-y-0.5 text-xs font-medium text-slate-600 dark:text-slate-300">
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-indigo-500"></span> Net Take-Home (75%)</li>
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Tax & Benefits (20%)</li>
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Bonus (5%)</li>
                   </ul>
                 </div>
               `, 'flex gap-4 items-center', 'p-5')}
               
               ${this.ui.GlassCard(`
                 <div>
                   <p class="text-indigo-100 font-bold uppercase tracking-widest text-xs mb-1">Pay Period Finalization</p>
                   <p class="text-2xl font-bold text-white tracking-tight">August 31, 2026</p>
                 </div>
                 ${this.ui.Button('Process Monthly Payroll', 'send', 'secondary', 'window.app.processMonthlyPayroll()', 'w-full text-xs py-2.5 mt-3 border-none bg-white/20 hover:bg-white/30 text-white shadow-none')}
               `, 'bg-gradient-to-br from-indigo-500 to-indigo-600 border-none shadow-[0_8px_30px_rgba(99,102,241,0.4)] relative overflow-hidden flex flex-col justify-between', 'p-6')}
            </div>
          `;
        }

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Compensation & Payroll</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Manage employee salaries, structure adjustments, and monthly disbursement.' : 'View your itemized payslips and annual compensation structure.'}</p>
              </div>
              ${isAdmin ? this.ui.Button('Run Monthly Payroll', 'credit-card', 'primary', 'window.app.processMonthlyPayroll()') : ''}
            </div>

            ${adminWidgets}

            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center p-5 border-b border-slate-200 dark:border-white/10">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'Employee Salary Master List' : 'My Historical Payslips'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${dataList.length} record${dataList.length!==1?'s':''}</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : '<th class="px-5 py-3">Period</th>'}
                      <th class="px-5 py-3">Base Annual</th>
                      <th class="px-5 py-3">Net Take-Home</th>
                      <th class="px-5 py-3">Status</th>
                      <th class="px-5 py-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            `, 'p-0')}
          </div>
        `;
      },

      // ==========================================
      // TEAM DIRECTORY VIEW
      // ==========================================
      renderTeam() {
        const isAdmin = this.state.currentUser.role === 'admin';
        let members = this.state.users;

        if (this.state.teamDeptFilter !== 'ALL') {
          members = members.filter(m => m.department === this.state.teamDeptFilter);
        }
        if (this.state.teamSearchQuery) {
          const q = this.state.teamSearchQuery.toLowerCase();
          members = members.filter(m => m.name.toLowerCase().includes(q) || m.department.toLowerCase().includes(q) || m.designation.toLowerCase().includes(q));
        }

        const cards = members.map(usr => this.ui.GlassCard(`
          <div class="flex items-start gap-4">
            ${this.ui.Avatar(usr.avatar, 'lg')}
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start">
                <h4 class="text-base font-bold text-slate-900 dark:text-white truncate">${usr.name}</h4>
                ${this.ui.Badge(usr.role === 'admin' ? 'Admin' : 'Staff', usr.role === 'admin' ? 'info' : 'default')}
              </div>
              <p class="text-xs font-semibold text-indigo-500 mt-0.5 truncate">${usr.designation}</p>
              <p class="text-[11px] text-slate-400 mt-1">${usr.department} • ID: ${usr.employeeId}</p>
              
              <div class="mt-4 pt-3 border-t border-slate-200 dark:border-white/10 flex gap-2">
                ${isAdmin ? `
                  <button onclick="window.app.openEditEmployeeModal('${usr.id}')" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all text-center">Edit Member</button>
                  <button onclick="window.app.setImpersonation('${usr.id}')" class="p-1.5 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-600 dark:text-slate-300" title="Inspect Dashboard"><i data-lucide="eye" class="w-4 h-4"></i></button>
                ` : `
                  <a href="mailto:${usr.email}" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all text-center flex items-center justify-center gap-1.5">
                    <i data-lucide="mail" class="w-3.5 h-3.5"></i> Email
                  </a>
                `}
              </div>
            </div>
          </div>
        `, 'p-5', '', true)).join('');

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Team Directory</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Directory of all organization personnel and leadership.</p>
              </div>
              ${isAdmin ? this.ui.Button('Add Team Member', 'user-plus', 'primary', 'window.app.openAddMemberModal()') : ''}
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
              <div class="flex-1 min-w-[200px] relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" placeholder="Search by name, designation, department..." value="${this.state.teamSearchQuery}" oninput="window.app.state.teamSearchQuery = this.value; window.app.render();" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
              </div>

              <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs">
                ${['ALL', 'Engineering', 'Design', 'Sales', 'Marketing', 'Management'].map(d => `
                  <button onclick="window.app.state.teamDeptFilter = '${d}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.teamDeptFilter === d ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${d}</button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">${cards.length ? cards : '<p class="col-span-3 text-center py-12 text-slate-400 text-sm">No members match your search criteria.</p>'}</div>
          </div>
        `;
      },

      // ==========================================
      // ROOT RENDER FUNCTION
      // ==========================================
      render() {
        const authView = document.getElementById('auth-view');
        const appLayout = document.getElementById('app-layout');
        const routeContainer = document.getElementById('route-container');

        if (!this.state.currentUser) {
          authView.classList.remove('hidden-view');
          appLayout.classList.add('hidden-view');
          this.renderAuth();
        } else {
          authView.classList.add('hidden-view');
          appLayout.classList.remove('hidden-view');
          
          this.renderSidebar();
          this.renderTopbar();
          
          let contentHTML = '';
          switch(this.state.currentRoute) {
            case 'dashboard': contentHTML = this.renderDashboard(); break;
            case 'attendance': contentHTML = this.renderAttendance(); break;
            case 'leaves': contentHTML = this.renderLeaves(); break;
            case 'profile': contentHTML = this.renderProfile(); break;
            case 'team': contentHTML = this.renderTeam(); break;
            case 'payroll': contentHTML = this.renderPayroll(); break;
            default: contentHTML = this.renderDashboard();
          }
          routeContainer.innerHTML = contentHTML;
        }
        lucide.createIcons();
      },

      init() {
        if (this.state.theme === 'dark') document.documentElement.classList.add('dark');

        // Click outside listener to close notification dropdown
        document.addEventListener('click', (e) => {
          if (this.state.notifDropdownOpen) {
            const btn = document.getElementById('notif-dropdown-container');
            if (btn && !btn.contains(e.target)) {
              this.state.notifDropdownOpen = false;
              this.renderTopbar();
              lucide.createIcons();
            }
          }
        });

        this.render();
      }
    };

    // Boot App on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      window.app.init();
    });
  </script>
</body>
</html>

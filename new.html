            ${balanceCards}

            ${this.ui.GlassCard(`
              <div class="p-5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'All Organization Leave Requests' : 'My Leave Applications'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${displayLeaves.length} record${displayLeaves.length!==1?'s':''}</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : ''}
                      <th class="px-5 py-3">Leave Type</th>
                      <th class="px-5 py-3">Duration</th>
                      <th class="px-5 py-3">Days</th>
                      <th class="px-5 py-3">Status & HR Feedback</th>
                      ${isAdmin ? '<th class="px-5 py-3">Review Action</th>' : '<th></th>'}
                    </tr>
                  </thead>
                  <tbody>${rows.length ? rows : `<tr><td colspan="6" class="text-center py-8 text-xs text-slate-400">No leave records found.</td></tr>`}</tbody>
                </table>
              </div>
            `, 'p-0')}

            ${applyModal}
          </div>
        `;
      },

      // ==========================================
      // DAY-TO-DAY EXPENSES VIEW (NEW FEATURE)
      // ==========================================
      renderExpenses() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;

        let displayExpenses = isAdmin ? this.state.expenses : this.state.expenses.filter(e => e.userId === activeUser.id);

        if (this.state.expenseFilterStatus !== 'ALL') {
          displayExpenses = displayExpenses.filter(e => e.status === this.state.expenseFilterStatus);
        }
        if (this.state.expenseFilterCategory !== 'ALL') {
          displayExpenses = displayExpenses.filter(e => e.category === this.state.expenseFilterCategory);
        }
        if (this.state.expenseSearchQuery) {
          const q = this.state.expenseSearchQuery.toLowerCase();
          displayExpenses = displayExpenses.filter(e => {
            const u = this.state.users.find(usr => usr.id === e.userId);
            return e.merchant.toLowerCase().includes(q) || e.description.toLowerCase().includes(q) || (u && u.name.toLowerCase().includes(q));
          });
        }

        // Metrics
        const totalClaimed = displayExpenses.reduce((acc, c) => acc + c.amount, 0);
        const pendingAmount = displayExpenses.filter(e => e.status === 'Pending').reduce((acc, c) => acc + c.amount, 0);
        const approvedAmount = displayExpenses.filter(e => e.status === 'Approved').reduce((acc, c) => acc + c.amount, 0);
        const reimbursedAmount = displayExpenses.filter(e => e.status === 'Reimbursed').reduce((acc, c) => acc + c.amount, 0);

        const rows = displayExpenses.map(exp => {
          const user = this.state.users.find(u => u.id === exp.userId) || { name: 'Unknown', avatar: '', department: 'N/A' };
          const badgeVariant = exp.status === 'Reimbursed' ? 'success' : exp.status === 'Approved' ? 'info' : exp.status === 'Rejected' ? 'danger' : 'warning';

          let actions = '';
          if (isAdmin) {
            if (exp.status === 'Pending') {
              actions = `
                <div class="flex gap-2">
                  <button onclick="window.app.openExpenseReviewModal('${exp.id}', 'Approved')" class="p-2 text-emerald-500 hover:bg-emerald-500/15 rounded-xl transition-all" title="Approve Claim"><i data-lucide="check" class="w-4 h-4"></i></button>
                  <button onclick="window.app.openExpenseReviewModal('${exp.id}', 'Rejected')" class="p-2 text-rose-500 hover:bg-rose-500/15 rounded-xl transition-all" title="Reject Claim"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
              `;
            } else if (exp.status === 'Approved') {
              actions = `
                <button onclick="window.app.markExpenseReimbursed('${exp.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500 text-emerald-600 hover:text-white text-xs font-bold transition-all">
                  Reimburse ₹
                </button>
              `;
            } else {
              actions = `<span class="text-[11px] font-bold text-slate-400">Processed</span>`;
            }
          }

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(user.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${user.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">${user.department}</p>
                  </div>
                </td>
              ` : ''}
              <td class="px-5 py-4 text-xs font-semibold text-slate-600 dark:text-slate-400 ${!isAdmin?'rounded-l-2xl':''}">${exp.date}</td>
              <td class="px-5 py-4">
                <span class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-800 dark:text-slate-200">
                  <i data-lucide="${exp.category.includes('Travel')?'car':exp.category.includes('Meals')?'utensils':exp.category.includes('Hotel')?'building':exp.category.includes('Internet')?'wifi':'receipt'}" class="w-3.5 h-3.5 text-indigo-500"></i>
                  ${exp.category}
                </span>
              </td>
              <td class="px-5 py-4">
                <p class="text-xs font-bold text-slate-900 dark:text-white">${exp.merchant}</p>
                <p class="text-[11px] text-slate-500 truncate max-w-xs">${exp.description}</p>
              </td>
              <td class="px-5 py-4 font-extrabold text-slate-900 dark:text-white text-sm">
                ${this.formatINR(exp.amount)}
              </td>
              <td class="px-5 py-4">
                <button onclick="window.app.viewReceiptModal('${exp.id}')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-white/10 hover:bg-indigo-500 hover:text-white text-[11px] font-semibold text-slate-600 dark:text-slate-300 transition-all font-mono">
                  <i data-lucide="paperclip" class="w-3 h-3"></i> Receipt
                </button>
              </td>
              <td class="px-5 py-4">
                <div class="flex flex-col gap-1">
                  ${this.ui.Badge(exp.status, badgeVariant)}
                  ${exp.adminComment ? `<span class="text-[10px] text-slate-400 italic">Note: "${exp.adminComment}"</span>` : ''}
                </div>
              </td>
              ${isAdmin ? `<td class="px-5 py-4 rounded-r-2xl">${actions}</td>` : '<td class="rounded-r-2xl"></td>'}
            </tr>
          `;
        }).join('');

        const categories = ['ALL', 'Travel & Commute', 'Meals & Dining', 'Office Supplies', 'Hotel & Lodging', 'Internet & Phone', 'Software & Tools', 'Miscellaneous'];

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Day-to-Day Expense Claims</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Audit, approve, and reimburse employee business expenses in Indian Rupees (₹).' : 'File daily travel, meals, internet, and office expenses for prompt reimbursement.'}</p>
              </div>
              <div class="flex gap-2">
                ${isAdmin ? this.ui.Button('Disburse Approved Claims', 'wallet', 'secondary', 'window.app.bulkReimburseExpenses()') : ''}
                ${this.ui.Button('Submit Expense Claim', 'plus-circle', 'primary', 'window.app.openSubmitExpenseModal()')}
              </div>
            </div>

            <!-- Expense Summary Metrics in Rupees ₹ -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Total Claims Value</p>
                <p class="text-3xl font-extrabold text-slate-900 dark:text-white font-display">${this.formatINR(totalClaimed)}</p>
                <p class="text-[11px] text-slate-400 mt-1">${displayExpenses.length} claims submitted</p>
              `, 'p-5', '', true)}

              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-amber-500 uppercase tracking-widest mb-1">Pending Audit</p>
                <p class="text-3xl font-extrabold text-amber-500 font-display">${this.formatINR(pendingAmount)}</p>
                <p class="text-[11px] text-slate-400 mt-1">${displayExpenses.filter(e => e.status === 'Pending').length} awaiting approval</p>
              `, 'p-5', '', true)}

              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-1">Approved for Payout</p>
                <p class="text-3xl font-extrabold text-indigo-500 font-display">${this.formatINR(approvedAmount)}</p>
                <p class="text-[11px] text-slate-400 mt-1">${displayExpenses.filter(e => e.status === 'Approved').length} in payout queue</p>
              `, 'p-5', '', true)}

              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">Total Reimbursed</p>
                <p class="text-3xl font-extrabold text-emerald-500 font-display">${this.formatINR(reimbursedAmount)}</p>
                <p class="text-[11px] text-slate-400 mt-1">Direct bank settlements</p>
              `, 'p-5', '', true)}
            </div>

            <!-- Search & Filters -->
            <div class="flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
              <div class="flex-1 min-w-[200px] relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" placeholder="Search by merchant, purpose, or employee..." value="${this.state.expenseSearchQuery}" oninput="window.app.state.expenseSearchQuery = this.value; window.app.render();" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
              </div>

              <!-- Category Dropdown Filter -->
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-400">Category:</span>
                <select onchange="window.app.state.expenseFilterCategory = this.value; window.app.render();" class="px-3 py-1.5 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 font-medium text-slate-700 dark:text-slate-300 focus:outline-none">
                  ${categories.map(c => `<option value="${c}" ${this.state.expenseFilterCategory===c?'selected':''} class="bg-white dark:bg-slate-800">${c}</option>`).join('')}
                </select>
              </div>

              <!-- Status Pills -->
              <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs">
                ${['ALL', 'Pending', 'Approved', 'Reimbursed', 'Rejected'].map(st => `
                  <button onclick="window.app.state.expenseFilterStatus = '${st}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.expenseFilterStatus === st ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${st}</button>
                `).join('')}
              </div>
            </div>

            <!-- Expense Claims Table -->
            ${this.ui.GlassCard(`
              <div class="p-5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'Master Expense Audit Ledger' : 'My Expense Reimbursements'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${displayExpenses.length} claim${displayExpenses.length!==1?'s':''} listed</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Claimant</th>' : ''}
                      <th class="px-5 py-3">Date</th>
                      <th class="px-5 py-3">Category</th>
                      <th class="px-5 py-3">Merchant & Purpose</th>
                      <th class="px-5 py-3">Amount (INR)</th>
                      <th class="px-5 py-3">Receipt</th>
                      <th class="px-5 py-3">Status</th>
                      ${isAdmin ? '<th class="px-5 py-3">Audit Action</th>' : '<th></th>'}
                    </tr>
                  </thead>
                  <tbody>${rows.length ? rows : `<tr><td colspan="${isAdmin?8:7}" class="text-center py-8 text-xs text-slate-400">No expense claims match current filters.</td></tr>`}</tbody>
                </table>
              </div>
            `, 'p-0')}
          </div>
        `;
      },

      // ==========================================
      // DAILY TARGETS VIEW
      // ==========================================
      renderTargets() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        const selectedDate = this.state.targetFilterDate;

        let displayTargets = this.state.targets.filter(t => t.date === selectedDate);
        if (!isAdmin) {
          displayTargets = displayTargets.filter(t => t.userId === activeUser.id);
        }

        if (this.state.targetFilterStatus !== 'ALL') {
          displayTargets = displayTargets.filter(t => t.status === this.state.targetFilterStatus);
        }
        if (this.state.targetFilterPriority !== 'ALL') {
          displayTargets = displayTargets.filter(t => t.priority === this.state.targetFilterPriority);
        }

        // Metrics computation
        const totalCount = displayTargets.length;
        const completedCount = displayTargets.filter(t => t.status === 'Completed').length;
        const inProgressCount = displayTargets.filter(t => t.status === 'In Progress').length;
        const blockedCount = displayTargets.filter(t => t.status === 'Blocked').length;
        const totalHours = displayTargets.reduce((acc, t) => acc + (t.estimatedHours || 0), 0);
        const completionPct = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;

        const targetCards = displayTargets.map(tgt => {
          const user = this.state.users.find(u => u.id === tgt.userId) || { name: 'Unknown', avatar: '' };
          const isDone = tgt.status === 'Completed';
          const isBlocked = tgt.status === 'Blocked';
          const isInProgress = tgt.status === 'In Progress';

          const prioVariant = tgt.priority === 'High' ? 'danger' : tgt.priority === 'Medium' ? 'warning' : 'default';
          const statusVariant = isDone ? 'success' : isBlocked ? 'danger' : isInProgress ? 'info' : 'default';

          return this.ui.GlassCard(`
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex items-start gap-3 min-w-0">
                <button onclick="window.app.toggleTargetStatus('${tgt.id}')" class="mt-0.5 w-6 h-6 rounded-xl flex items-center justify-center transition-all flex-shrink-0 ${isDone ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/30' : 'border-2 border-slate-300 dark:border-slate-600 hover:border-indigo-500'}">
                  ${isDone ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                </button>
                <div class="min-w-0">
                  <h4 class="text-sm font-bold text-slate-900 dark:text-white leading-snug ${isDone ? 'line-through opacity-70' : ''}">${tgt.title}</h4>
                  <div class="flex flex-wrap items-center gap-2 mt-1">
                    <span class="px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-500 text-[10px] font-bold uppercase tracking-wider">${tgt.project}</span>
                    <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${tgt.estimatedHours}h est.</span>
                    ${tgt.completedAt ? `<span class="text-[11px] text-emerald-500 font-semibold flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3 h-3"></i> Done at ${tgt.completedAt}</span>` : ''}
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-1.5 flex-shrink-0">
                ${this.ui.Badge(tgt.priority, prioVariant, '!text-[10px]')}
                <button onclick="window.app.openEditTargetModal('${tgt.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-indigo-500/10 transition-all" title="Edit Target">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            ${tgt.notes ? `
              <p class="text-xs text-slate-600 dark:text-slate-300 bg-white/40 dark:bg-black/20 p-2.5 rounded-xl border border-white/50 dark:border-white/5 italic mb-3">
                "${tgt.notes}"
              </p>
            ` : ''}

            <div class="flex items-center justify-between pt-3 border-t border-slate-200 dark:border-white/10 text-xs">
              <div class="flex items-center gap-2">
                ${isAdmin ? `
                  ${this.ui.Avatar(user.avatar, 'sm')}
                  <span class="text-slate-700 dark:text-slate-300 font-semibold text-[11px]">${user.name}</span>
                ` : `
                  <span class="text-[11px] text-slate-400 font-medium">Status:</span>
                  ${this.ui.Badge(tgt.status, statusVariant, '!text-[10px]')}
                `}
              </div>

              <!-- Quick Status Selector -->
              <div class="flex items-center gap-1">
                <select onchange="window.app.setTargetStatus('${tgt.id}', this.value)" class="text-[11px] font-bold px-2 py-1 rounded-lg bg-white/60 dark:bg-white/10 border border-white/60 dark:border-white/10 text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer">
                  <option value="To Do" ${tgt.status==='To Do'?'selected':''} class="bg-white dark:bg-slate-800">To Do</option>
                  <option value="In Progress" ${tgt.status==='In Progress'?'selected':''} class="bg-white dark:bg-slate-800">In Progress</option>
                  <option value="Completed" ${tgt.status==='Completed'?'selected':''} class="bg-white dark:bg-slate-800">Completed</option>
                  <option value="Blocked" ${tgt.status==='Blocked'?'selected':''} class="bg-white dark:bg-slate-800">Blocked</option>
                </select>
              </div>
            </div>
          `, 'p-4', '', true);
        }).join('');

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Daily Targets & Tasks</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Manage, assign, and track daily operational deliverables across all teams.' : 'Track, update, and complete your daily goals and deliverables.'}</p>
              </div>
              <div class="flex gap-2">
                ${this.ui.Button('Daily Progress Report', 'trending-up', 'secondary', 'window.app.navigate("reports")')}
                ${this.ui.Button('Set Daily Target', 'plus-circle', 'primary', 'window.app.openCreateTargetModal()')}
              </div>
            </div>

            <!-- Daily Target Progress Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              ${this.ui.GlassCard(`
                <div class="flex justify-between items-start mb-2">
                  <p class="text-xs font-bold text-indigo-500 uppercase tracking-widest">Daily Progress</p>
                  <span class="text-xs font-bold text-indigo-500">${completionPct}%</span>
                </div>
                <p class="text-3xl font-extrabold text-slate-900 dark:text-white font-display mb-3">${completedCount} / ${totalCount} Done</p>
                <div class="w-full bg-slate-200 dark:bg-slate-700/50 h-2 rounded-full overflow-hidden">
                  <div class="bg-gradient-to-r from-indigo-500 to-emerald-500 h-full rounded-full transition-all duration-500" style="width: ${completionPct}%"></div>
                </div>
              `, 'p-5', '', true)}

              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">Completed Deliverables</p>
                <p class="text-3xl font-extrabold text-emerald-500 font-display">${completedCount}</p>
                <p class="text-[11px] text-slate-400 mt-1">${completedCount ? 'Great velocity today!' : 'No tasks finished yet'}</p>
              `, 'p-5', '', true)}

              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-amber-500 uppercase tracking-widest mb-1">In Progress / Pending</p>
                <p class="text-3xl font-extrabold text-amber-500 font-display">${inProgressCount + (totalCount - completedCount - inProgressCount - blockedCount)}</p>
                <p class="text-[11px] text-slate-400 mt-1">${blockedCount ? `${blockedCount} target(s) blocked` : 'On schedule'}</p>
              `, 'p-5', '', true)}

              ${this.ui.GlassCard(`
                <p class="text-xs font-bold text-purple-500 uppercase tracking-widest mb-1">Estimated Effort</p>
                <p class="text-3xl font-extrabold text-purple-500 font-display">${totalHours.toFixed(1)} hrs</p>
                <p class="text-[11px] text-slate-400 mt-1">Daily workload allocation</p>
              `, 'p-5', '', true)}
            </div>

            <!-- Filters & Date Selector -->
            <div class="flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4 text-indigo-500"></i> Date:</span>
                <input type="date" value="${this.state.targetFilterDate}" onchange="window.app.state.targetFilterDate = this.value; window.app.render();" class="px-3 py-1.5 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 font-bold text-slate-800 dark:text-white focus:outline-none" />
                ${this.state.targetFilterDate !== this.state.currentDate.toISOString().split('T')[0] ? `
                  <button onclick="window.app.state.targetFilterDate = '${this.state.currentDate.toISOString().split('T')[0]}'; window.app.render();" class="text-xs text-indigo-500 font-bold hover:underline">Jump to Today</button>
                ` : ''}
              </div>

              <!-- Priority Dropdown -->
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-400">Priority:</span>
                <select onchange="window.app.state.targetFilterPriority = this.value; window.app.render();" class="px-3 py-1.5 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 font-medium text-slate-700 dark:text-slate-300 focus:outline-none">
                  ${['ALL', 'High', 'Medium', 'Low'].map(p => `<option value="${p}" ${this.state.targetFilterPriority===p?'selected':''} class="bg-white dark:bg-slate-800">${p}</option>`).join('')}
                </select>
              </div>

              <!-- Status Pills -->
              <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs ml-auto">
                ${['ALL', 'To Do', 'In Progress', 'Completed', 'Blocked'].map(st => `
                  <button onclick="window.app.state.targetFilterStatus = '${st}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.targetFilterStatus === st ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${st}</button>
                `).join('')}
              </div>
            </div>

            <!-- Target Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${targetCards.length ? targetCards : `
                <div class="col-span-full py-16 text-center">
                  <div class="w-16 h-16 rounded-3xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="check-square" class="w-8 h-8"></i>
                  </div>
                  <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">No Daily Targets Found</h3>
                  <p class="text-xs text-slate-400 max-w-sm mx-auto mb-4">No targets logged for ${selectedDate} matching your filters.</p>
                  ${this.ui.Button('Set a Target Now', 'plus', 'primary', 'window.app.openCreateTargetModal()', '!text-xs')}
                </div>
              `}
            </div>
          </div>
        `;
      },

      // ==========================================
      // DAILY PROGRESS & PRODUCTIVITY REPORTS VIEW
      // ==========================================
      renderReports() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        const selectedDate = this.state.reportSelectedDate;

        // Targets on this report date
        const dateTargets = this.state.targets.filter(t => t.date === selectedDate);
        const totalTargets = dateTargets.length;
        const completedTargets = dateTargets.filter(t => t.status === 'Completed').length;
        const overallVelocityPct = totalTargets ? Math.round((completedTargets / totalTargets) * 100) : 0;
        const totalHoursLogged = dateTargets.reduce((acc, t) => acc + (t.estimatedHours || 0), 0);

        // Standup note for active user
        const myReport = this.state.dailyReports.find(r => r.userId === activeUser.id && r.date === selectedDate) || { standupSummary: '', blockers: '', managerRating: '', managerFeedback: '' };

        // Department breakdown
        const depts = ['Engineering', 'Design', 'Sales', 'Marketing'];
        const deptStats = depts.map(dept => {
          const deptUserIds = this.state.users.filter(u => u.department === dept).map(u => u.id);
          const deptTargets = dateTargets.filter(t => deptUserIds.includes(t.userId));
          const deptDone = deptTargets.filter(t => t.status === 'Completed').length;
          const pct = deptTargets.length ? Math.round((deptDone / deptTargets.length) * 100) : (dept === 'Engineering' ? 90 : dept === 'Sales' ? 95 : 85);
          return { dept, total: deptTargets.length || 2, done: deptDone || 2, pct };
        });

        // Team progress feed for Admins / Overview
        const teamReportsHTML = this.state.users.map(usr => {
          const uTargets = dateTargets.filter(t => t.userId === usr.id);
          const uDone = uTargets.filter(t => t.status === 'Completed').length;
          const uPct = uTargets.length ? Math.round((uDone / uTargets.length) * 100) : 0;
          const uReport = this.state.dailyReports.find(r => r.userId === usr.id && r.date === selectedDate);

          return this.ui.GlassCard(`
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-4">
              <div class="flex items-center gap-3.5">
                ${this.ui.Avatar(usr.avatar, 'md')}
                <div>
                  <h4 class="text-sm font-bold text-slate-900 dark:text-white">${usr.name}</h4>
                  <p class="text-xs text-slate-400 font-medium">${usr.designation} • ${usr.department}</p>
                </div>
              </div>

              <div class="flex items-center gap-3 self-end sm:self-auto">
                <div class="text-right">
                  <span class="text-xs font-bold text-slate-900 dark:text-white">${uDone}/${uTargets.length} Deliverables</span>
                  <p class="text-[10px] text-slate-400 font-semibold">${uPct}% Target Velocity</p>
                </div>
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center font-extrabold text-xs shadow-inner ${uPct >= 80 ? 'bg-emerald-500/15 text-emerald-500 border border-emerald-500/20' : uPct >= 50 ? 'bg-amber-500/15 text-amber-500 border border-amber-500/20' : 'bg-slate-100 dark:bg-white/10 text-slate-500'}">
                  ${uPct}%
                </div>
              </div>
            </div>

            <!-- Target Highlights for this user -->
            <div class="space-y-1.5 mb-3 bg-white/40 dark:bg-black/20 p-3 rounded-2xl border border-white/50 dark:border-white/5">
              <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Target Deliverables:</p>
              ${uTargets.length ? uTargets.map(t => `
                <div class="flex items-center justify-between text-xs">
                  <span class="flex items-center gap-2 ${t.status==='Completed' ? 'line-through text-slate-400' : 'font-medium text-slate-800 dark:text-slate-200'}">
                    <i data-lucide="${t.status==='Completed'?'check-circle-2':'circle'}" class="w-3.5 h-3.5 ${t.status==='Completed'?'text-emerald-500':'text-slate-400'}"></i>
                    ${t.title}
                  </span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${t.status==='Completed'?'bg-emerald-500/10 text-emerald-500':t.status==='In Progress'?'bg-indigo-500/10 text-indigo-500':'bg-slate-200 dark:bg-white/10 text-slate-500'}">${t.status}</span>
                </div>
              `).join('') : `<p class="text-xs text-slate-400 italic">No targets set for this date.</p>`}
            </div>

            <!-- EOD Standup Note & Blockers -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs mb-3">
              <div class="p-3 rounded-xl bg-white/50 dark:bg-white/5 border border-white/50 dark:border-white/5">
                <span class="font-bold text-indigo-500 block mb-0.5">EOD Accomplishments:</span>
                <p class="text-slate-600 dark:text-slate-300 italic">${uReport && uReport.standupSummary ? uReport.standupSummary : 'Work log in progress...'}</p>
              </div>
              <div class="p-3 rounded-xl bg-white/50 dark:bg-white/5 border border-white/50 dark:border-white/5">
                <span class="font-bold text-rose-500 block mb-0.5">Blockers / Dependencies:</span>
                <p class="text-slate-600 dark:text-slate-300 italic">${uReport && uReport.blockers && uReport.blockers !== 'None' ? uReport.blockers : 'None reported (All clear)'}</p>
              </div>
            </div>

            <!-- Manager Appraisal & Feedback -->
            <div class="p-3 rounded-2xl bg-gradient-to-r from-indigo-500/10 to-purple-500/10 border border-indigo-500/20 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
              <div>
                <span class="font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                  <i data-lucide="award" class="w-4 h-4 text-amber-500"></i> Appraisal: ${uReport && uReport.managerRating ? uReport.managerRating : 'Pending Review'}
                </span>
                ${uReport && uReport.managerFeedback ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">"${uReport.managerFeedback}"</p>` : ''}
              </div>
              ${isAdmin ? `
                <button onclick="window.app.openManagerFeedbackModal('${uReport ? uReport.id : ''}', '${usr.id}', '${selectedDate}')" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all shadow-md shadow-indigo-500/20 flex items-center gap-1 self-end sm:self-auto">
                  <i data-lucide="message-square" class="w-3.5 h-3.5"></i> ${uReport && uReport.managerRating ? 'Edit Feedback' : 'Give Feedback'}
                </button>
              ` : ''}
            </div>
          `, 'p-5', '', true);
        }).join('');

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Daily Progress & Work Reports</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Audit daily team velocity, standup progress logs, and submit performance appraisals.' : 'Log your daily standup achievements, identify blockers, and track team velocity.'}</p>
              </div>
              <div class="flex gap-2">
                <button onclick="window.print()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-white/70 dark:bg-white/10 hover:bg-white/90 text-xs font-bold transition-all border border-white/70 dark:border-white/10 shadow-sm">
                  <i data-lucide="printer" class="w-4 h-4"></i> Export / Print Report
                </button>
                ${this.ui.Button('Daily Target Board', 'check-square', 'primary', 'window.app.navigate("targets")')}
              </div>
            </div>

            <!-- Date Selector & Summary Banner -->
            <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-3xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
              <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-2xl bg-indigo-500/10 text-indigo-500 font-bold"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                <div>
                  <span class="text-xs font-bold text-slate-400 block uppercase tracking-wider">Report For Date:</span>
                  <input type="date" value="${this.state.reportSelectedDate}" onchange="window.app.state.reportSelectedDate = this.value; window.app.render();" class="px-3 py-1 text-sm font-extrabold rounded-xl bg-white/70 dark:bg-white/10 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none" />
                </div>
              </div>

              <div class="flex items-center gap-6">
                <div class="text-center">
                  <span class="text-[11px] font-bold text-slate-400 uppercase">Target Velocity</span>
                  <p class="text-xl font-extrabold text-indigo-500 font-display">${overallVelocityPct}%</p>
                </div>
                <div class="text-center">
                  <span class="text-[11px] font-bold text-slate-400 uppercase">Completed</span>
                  <p class="text-xl font-extrabold text-emerald-500 font-display">${completedTargets}/${totalTargets}</p>
                </div>
                <div class="text-center">
                  <span class="text-[11px] font-bold text-slate-400 uppercase">Logged Hours</span>
                  <p class="text-xl font-extrabold text-purple-500 font-display">${totalHoursLogged.toFixed(1)}h</p>
                </div>
              </div>
            </div>

            <!-- Visual Analytics Grid: Velocity Meter + Department Breakdown -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <!-- Velocity Circle / Progress Card -->
              ${this.ui.GlassCard(`
                <h3 class="text-base font-bold text-slate-900 dark:text-white mb-4">Overall Completion Velocity</h3>
                <div class="flex flex-col items-center justify-center py-4">
                  <div class="relative w-32 h-32 rounded-full flex items-center justify-center shadow-2xl" style="background: conic-gradient(from 0deg, #6366f1 0% ${overallVelocityPct}%, #e2e8f0 ${overallVelocityPct}% 100%)">
                    <div class="w-24 h-24 rounded-full bg-white dark:bg-[#0b1329] flex flex-col items-center justify-center shadow-inner">
                      <span class="text-2xl font-extrabold text-slate-900 dark:text-white font-display">${overallVelocityPct}%</span>
                      <span class="text-[9px] font-bold text-slate-400 uppercase">Velocity</span>
                    </div>
                  </div>
                  <p class="text-xs font-semibold text-slate-600 dark:text-slate-300 mt-4 text-center">
                    ${completedTargets} of ${totalTargets} scheduled daily targets finished
                  </p>
                </div>
              `, 'p-6')}

              <!-- Department Productivity Breakdown -->
              <div class="lg:col-span-2 space-y-4">
                ${this.ui.GlassCard(`
                  <h3 class="text-base font-bold text-slate-900 dark:text-white mb-4">Department Productivity Breakdown</h3>
                  <div class="space-y-3.5">
                    ${deptStats.map(d => `
                      <div>
                        <div class="flex justify-between text-xs font-bold mb-1">
                          <span class="text-slate-800 dark:text-slate-200">${d.dept}</span>
                          <span class="text-indigo-500 font-extrabold">${d.pct}% Target Velocity</span>
                        </div>
                        <div class="w-full bg-slate-200 dark:bg-slate-700/50 h-2.5 rounded-full overflow-hidden">
                          <div class="bg-gradient-to-r from-indigo-500 to-emerald-500 h-full rounded-full transition-all duration-500" style="width: ${d.pct}%"></div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `, 'p-6')}
              </div>
            </div>

            <!-- Employee EOD Standup Submission Form -->
            ${!isAdmin ? `
              ${this.ui.GlassCard(`
                <div class="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-white/10 mb-4">
                  <div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-white">My End-of-Day (EOD) Standup Work Log</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Submit daily accomplishments and notify management of any blockers</p>
                  </div>
                  <span class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-500">Date: ${selectedDate}</span>
                </div>

                <form onsubmit="window.app.saveDailyStandupReport(event)" class="space-y-4">
                  <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">What did you accomplish today?</label>
                    <textarea id="rep-summary" rows="3" required placeholder="Detail completed targets, features delivered, meetings conducted..." class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-xs">${myReport.standupSummary || ''}</textarea>
                  </div>

                  <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Any blockers, delays, or dependencies?</label>
                    <input id="rep-blockers" type="text" value="${myReport.blockers || ''}" placeholder="e.g. Waiting on API approval from security team, or None" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-xs" />
                  </div>

                  <div class="flex justify-end gap-3 pt-2">
                    ${this.ui.Button('Save & Submit Work Log', 'send', 'primary', '', '!text-xs !py-2.5', 'submit')}
                  </div>
                </form>
              `, 'p-6')}
            ` : ''}

            <!-- Master Team Progress & Standup Logs Ledger -->
            <div>
              <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">${isAdmin ? 'Organization Daily Progress Feed & Appraisals' : 'Team Daily Standup Overview'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${this.state.users.length} members tracked</span>
              </div>
              <div class="space-y-5">${teamReportsHTML}</div>
            </div>
          </div>
        `;
      },

      // ==========================================
      // PROFILE VIEW (PDF 3.3)
      // ==========================================
      renderProfile() {
        const u = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin';

        const docs = ['Employment_Agreement.pdf', 'Employee_Handbook_2026.pdf', 'Form_16_Tax_Certificate.pdf'].map(doc => `
          <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 hover:border-indigo-500/50 hover:shadow-md transition-all group">
             <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-xl bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400"><i data-lucide="file-text" class="w-4 h-4"></i></div>
                <span class="text-xs font-bold text-slate-700 dark:text-slate-300 truncate w-32">${doc}</span>
             </div>
             <button onclick="window.app.notify('Downloading ${doc}...', 'info')" class="p-2 text-slate-400 hover:text-indigo-500 rounded-lg"><i data-lucide="download" class="w-4 h-4"></i></button>
          </div>
        `).join('');

        return `
          <div class="max-w-5xl mx-auto space-y-8 animate-fade-in-up mt-12">
            ${this.ui.GlassCard(`
              <div class="absolute -top-12 left-8 group relative">
                ${this.ui.Avatar(u.avatar, 'xl', 'shadow-2xl border-4 border-white dark:border-slate-800 cursor-pointer', 'window.app.openAvatarPicker()')}
                <button onclick="window.app.openAvatarPicker()" class="absolute bottom-1 right-1 p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full shadow-lg transition-transform hover:scale-110" title="Change Photo">
                  <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                </button>
              </div>

              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pt-4 pl-0 sm:pl-[7.5rem]">
                <div>
                  <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">${u.name}</h2>
                  <p class="text-sm font-semibold text-slate-500 dark:text-slate-400 mt-0.5">${u.designation} • ${u.department}</p>
                  <div class="mt-3 flex gap-2">
                    ${this.ui.Badge(u.employeeId, 'info')}
                    ${this.ui.Badge(u.role === 'admin' ? 'HR Administrator' : 'Staff Employee', u.role === 'admin' ? 'info' : 'default')}
                  </div>
                </div>

                ${isAdmin && u.id !== this.state.currentUser.id ? `
                  ${this.ui.Button('Admin Edit All Fields', 'edit', 'primary', `window.app.openEditEmployeeModal('${u.id}')`, '!text-xs')}
                ` : ''}
              </div>

              <form onsubmit="window.app.saveSelfProfile(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Editable Contact Info (PDF 3.3) -->
                <div class="space-y-4 bg-white/30 dark:bg-black/10 p-5 rounded-3xl border border-white/50 dark:border-white/5 shadow-inner">
                  <div class="flex justify-between items-center border-b border-slate-200 dark:border-white/10 pb-3 mb-2">
                    <div>
                      <h4 class="font-bold text-sm text-slate-900 dark:text-white">Contact & Address</h4>
                      <p class="text-[11px] text-slate-400">Editable by employee</p>
                    </div>
                    ${this.ui.Button('Save Changes', 'save', 'primary', '', '!py-1.5 !px-3 text-xs', 'submit')}
                  </div>
                  ${this.ui.Input('prof-phone', 'Phone Number', 'text', u.phone, '+91 98000 00000', true)}
                  ${this.ui.Input('prof-address', 'Residential Address', 'text', u.address || '', 'Flat, Street, City, State, PIN', true)}
                  <p class="text-[11px] text-slate-400 italic">Click on your avatar above to upload or choose a new profile photo.</p>
                </div>

                <!-- Read-Only Organizational Info in Rupees ₹ -->
                <div class="space-y-4 bg-white/30 dark:bg-black/10 p-5 rounded-3xl border border-white/50 dark:border-white/5 shadow-inner">
                  <div class="border-b border-slate-200 dark:border-white/10 pb-3 mb-2 flex justify-between items-center">
                    <div>
                      <h4 class="font-bold text-sm text-slate-900 dark:text-white">Official Job Information</h4>
                      <p class="text-[11px] text-slate-400">Locked (HR Managed)</p>
                    </div>
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
                  </div>
                  ${this.ui.Input('j-name', 'Full Legal Name', 'text', u.name, '', false, true)}
                  ${this.ui.Input('j-email', 'Work Email', 'text', u.email, '', false, true)}
                  <div class="grid grid-cols-2 gap-3">
                    ${this.ui.Input('j-dep', 'Department', 'text', u.department, '', false, true)}
                    ${this.ui.Input('j-join', 'Joined On', 'text', u.joinDate, '', false, true)}
                  </div>
                  ${this.ui.Input('j-sal', 'Annual CTC Compensation', 'text', '₹' + u.salary.toLocaleString('en-IN') + ' / year', '', false, true)}
                </div>
              </form>

              <!-- Essential Documents -->
              <div class="mt-6 bg-white/30 dark:bg-black/10 p-5 rounded-3xl border border-white/50 dark:border-white/5 shadow-inner">
                <h4 class="font-bold text-sm text-slate-900 dark:text-white border-b border-slate-200 dark:border-white/10 pb-3 mb-4 flex items-center gap-2">
                   <i data-lucide="folder" class="w-4 h-4 text-indigo-500"></i> Official Records & Compliance
                </h4>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${docs}</div>
              </div>
            `, 'relative overflow-visible', 'px-6 sm:px-8 pb-8 pt-6')}
          </div>
        `;
      },

      // ==========================================
      // PAYROLL VIEW (PDF 3.6 - In Rupees ₹)
      // ==========================================
      renderPayroll() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        
        // Admin master list vs Employee payslips
        const dataList = isAdmin ? this.state.users : [
          { ...activeUser, month: 'August 2026', status: 'Paid' },
          { ...activeUser, month: 'July 2026', status: 'Paid' },
          { ...activeUser, month: 'June 2026', status: 'Paid' }
        ];

        const rows = dataList.map(row => {
          const baseYearly = row.salary;
          const grossMonthly = Math.round(baseYearly / 12);
          const netMonthly = Math.round(grossMonthly * 0.75);

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(row.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${row.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">${row.department}</p>
                  </div>
                </td>
              ` : `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white rounded-l-2xl text-xs">${row.month}</td>
              `}
              <td class="px-5 py-4 text-xs font-semibold text-slate-600 dark:text-slate-300">₹${baseYearly.toLocaleString('en-IN')}</td>
              <td class="px-5 py-4 text-xs font-bold text-indigo-600 dark:text-indigo-400">₹${netMonthly.toLocaleString('en-IN')}/mo</td>
              <td class="px-5 py-4">${this.ui.Badge('Paid', 'success')}</td>
              <td class="px-5 py-4 rounded-r-2xl">
                <div class="flex gap-2">
                  <button onclick="window.app.openPayslipModal('${row.name}', '${row.month || 'August 2026'}')" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all flex items-center gap-1">
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Payslip (₹)
                  </button>
                  ${isAdmin ? `
                    <button onclick="window.app.openEditSalaryModal('${row.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500 text-indigo-600 hover:text-white text-xs font-bold transition-all flex items-center gap-1">
                      <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Edit CTC
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `;
        }).join('');

        let adminWidgets = '';
        if (isAdmin) {
          const totalNetRun = this.state.users.reduce((acc, u) => acc + Math.round((u.salary / 12) * 0.75), 0);
          adminWidgets = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
               ${this.ui.GlassCard(`
                 <div>
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Monthly Payroll (INR ₹)</p>
                   <p class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">₹${totalNetRun.toLocaleString('en-IN')}</p>
                   <p class="text-[11px] text-slate-400 mt-1">${this.state.users.length} active staff disbursement</p>
                 </div>
                 <div class="p-3.5 bg-indigo-100 dark:bg-indigo-500/20 rounded-2xl text-indigo-500"><i data-lucide="wallet" class="w-6 h-6"></i></div>
               `, 'flex justify-between items-center', 'p-6')}
               
               ${this.ui.GlassCard(`
                 <div class="relative w-20 h-20 rounded-full flex items-center justify-center shadow-lg flex-shrink-0" style="background: conic-gradient(from 0deg, #6366f1 0% 75%, #ef4444 75% 90%, #10b981 90% 100%)">
                   <div class="w-14 h-14 bg-slate-50 dark:bg-slate-900 rounded-full shadow-inner"></div>
                 </div>
                 <div>
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Statutory Split</p>
                   <ul class="space-y-0.5 text-xs font-medium text-slate-600 dark:text-slate-300">
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-indigo-500"></span> Take-Home (75%)</li>
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-rose-500"></span> PF, PT & TDS (20%)</li>
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Performance Bonus (5%)</li>
                   </ul>
                 </div>
               `, 'flex gap-4 items-center', 'p-5')}
               
               ${this.ui.GlassCard(`
                 <div>
                   <p class="text-indigo-100 font-bold uppercase tracking-widest text-xs mb-1">Cycle Settlement</p>
                   <p class="text-2xl font-bold text-white tracking-tight">August 31, 2026</p>
                 </div>
                 ${this.ui.Button('Process August Payout (₹)', 'send', 'secondary', 'window.app.processMonthlyPayroll()', 'w-full text-xs py-2.5 mt-3 border-none bg-white/20 hover:bg-white/30 text-white shadow-none')}
               `, 'bg-gradient-to-br from-indigo-500 to-indigo-600 border-none shadow-[0_8px_30px_rgba(99,102,241,0.4)] relative overflow-hidden flex flex-col justify-between', 'p-6')}
            </div>
          `;
        }

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Compensation & Payroll (Rupees ₹)</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Manage employee CTC structures, PF/TDS deductions, and monthly salary disbursement.' : 'View your itemized monthly payslips and annual compensation structure.'}</p>
              </div>
              ${isAdmin ? this.ui.Button('Run Monthly Payroll', 'wallet', 'primary', 'window.app.processMonthlyPayroll()') : ''}
            </div>

            ${adminWidgets}

            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center p-5 border-b border-slate-200 dark:border-white/10">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'Employee CTC Master Register' : 'My Historical Salary Payslips'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${dataList.length} record${dataList.length!==1?'s':''}</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : '<th class="px-5 py-3">Period</th>'}
                      <th class="px-5 py-3">Annual CTC</th>
                      <th class="px-5 py-3">Monthly Net Pay</th>
                      <th class="px-5 py-3">Status</th>
                      <th class="px-5 py-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            `, 'p-0')}
          </div>
        `;
      },

      // ==========================================
      // TEAM DIRECTORY VIEW
      // ==========================================
      renderTeam() {
        const isAdmin = this.state.currentUser.role === 'admin';
        let members = this.state.users;

        if (this.state.teamDeptFilter !== 'ALL') {
          members = members.filter(m => m.department === this.state.teamDeptFilter);
        }
        if (this.state.teamSearchQuery) {
          const q = this.state.teamSearchQuery.toLowerCase();
          members = members.filter(m => m.name.toLowerCase().includes(q) || m.department.toLowerCase().includes(q) || m.designation.toLowerCase().includes(q));
        }

        const cards = members.map(usr => this.ui.GlassCard(`
          <div class="flex items-start gap-4">
            ${this.ui.Avatar(usr.avatar, 'lg')}
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start">
                <h4 class="text-base font-bold text-slate-900 dark:text-white truncate">${usr.name}</h4>
                ${this.ui.Badge(usr.role === 'admin' ? 'Admin' : 'Staff', usr.role === 'admin' ? 'info' : 'default')}
              </div>
              <p class="text-xs font-semibold text-indigo-500 mt-0.5 truncate">${usr.designation}</p>
              <p class="text-[11px] text-slate-400 mt-1">${usr.department} • ID: ${usr.employeeId}</p>
              
              <div class="mt-4 pt-3 border-t border-slate-200 dark:border-white/10 flex gap-2">
                ${isAdmin ? `
                  <button onclick="window.app.openEditEmployeeModal('${usr.id}')" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all text-center">Edit Member</button>
                  <button onclick="window.app.setImpersonation('${usr.id}')" class="p-1.5 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-600 dark:text-slate-300" title="Inspect Dashboard"><i data-lucide="eye" class="w-4 h-4"></i></button>
                ` : `
                  <a href="mailto:${usr.email}" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all text-center flex items-center justify-center gap-1.5">
                    <i data-lucide="mail" class="w-3.5 h-3.5"></i> Email
                  </a>
                `}
              </div>
            </div>
          </div>
        `, 'p-5', '', true)).join('');

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Team Directory</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Directory of all organization personnel and leadership.</p>
              </div>
              ${isAdmin ? this.ui.Button('Add Team Member', 'user-plus', 'primary', 'window.app.openAddMemberModal()') : ''}
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
              <div class="flex-1 min-w-[200px] relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" placeholder="Search by name, designation, department..." value="${this.state.teamSearchQuery}" oninput="window.app.state.teamSearchQuery = this.value; window.app.render();" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
              </div>

              <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs">
                ${['ALL', 'Engineering', 'Design', 'Sales', 'Marketing', 'Management'].map(d => `
                  <button onclick="window.app.state.teamDeptFilter = '${d}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.teamDeptFilter === d ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${d}</button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">${cards.length ? cards : '<p class="col-span-3 text-center py-12 text-slate-400 text-sm">No members match your search criteria.</p>'}</div>
          </div>
        `;
      },

      // ==========================================
      // CHART.JS INTEGRATIONS
      // ==========================================
      initDashboardCharts() {
        const canvas = document.getElementById('attendanceTrendsChart');
        if (!canvas || !window.Chart) return;
        
        if (window._dashChartInstance) {
          window._dashChartInstance.destroy();
        }

        const ctx = canvas.getContext('2d');
        const isDark = document.documentElement.classList.contains('dark');
        const textColor = isDark ? '#94a3b8' : '#64748b';
        const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)';

        const gradient = ctx.createLinearGradient(0, 0, 0, 150);
        gradient.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
        gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

        window._dashChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['Mon 17', 'Tue 18', 'Wed 19', 'Thu 20', 'Fri 21', 'Sat 22'],
            datasets: [{
              label: 'Attendance Turnout (%)',
              data: [92, 95, 88, 96, 94, 98],
              borderColor: '#6366f1',
              backgroundColor: gradient,
              borderWidth: 3,
              fill: true,
              tension: 0.35,
              pointBackgroundColor: '#6366f1',
              pointBorderColor: '#fff',
              pointRadius: 4,
              pointHoverRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: isDark ? '#1e293b' : '#ffffff',
                titleColor: isDark ? '#ffffff' : '#0f172a',
                bodyColor: isDark ? '#cbd5e1' : '#334155',
                borderColor: 'rgba(99, 102, 241, 0.3)',
                borderWidth: 1,
                padding: 10,
                displayColors: false,
                callbacks: {
                  label: (ctx) => `Turnout: ${ctx.parsed.y}% Active Staff`
                }
              }
            },
            scales: {
              y: {
                min: 60,
                max: 100,
                grid: { color: gridColor },
                ticks: { color: textColor, callback: (v) => v + '%' }
              },
              x: {
                grid: { display: false },
                ticks: { color: textColor }
              }
            }
          }
        });
      },

      // ==========================================
      // ROOT RENDER FUNCTION
      // ==========================================
      render() {
        const authView = document.getElementById('auth-view');
        const appLayout = document.getElementById('app-layout');
        const routeContainer = document.getElementById('route-container');

        if (!this.state.currentUser) {
          authView.classList.remove('hidden-view');
          appLayout.classList.add('hidden-view');
          this.renderAuth();
          this.renderChatWidget();
        } else {
          authView.classList.add('hidden-view');
          appLayout.classList.remove('hidden-view');
          
          this.renderSidebar();
          this.renderTopbar();
          
          let contentHTML = '';
          switch(this.state.currentRoute) {
            case 'dashboard': contentHTML = this.renderDashboard(); break;
            case 'targets': contentHTML = this.renderTargets(); break;
            case 'reports': contentHTML = this.renderReports(); break;
            case 'attendance': contentHTML = this.renderAttendance(); break;
            case 'leaves': contentHTML = this.renderLeaves(); break;
            case 'expenses': contentHTML = this.renderExpenses(); break;
            case 'profile': contentHTML = this.renderProfile(); break;
            case 'team': contentHTML = this.renderTeam(); break;
            case 'payroll': contentHTML = this.renderPayroll(); break;
            default: contentHTML = this.renderDashboard();
          }
          routeContainer.innerHTML = contentHTML;
          this.renderChatWidget();

          if (this.state.currentRoute === 'dashboard') {
            setTimeout(() => this.initDashboardCharts(), 60);
          }
        }
        lucide.createIcons();
      },

      init() {
        // Clear any old stored data with dollar salaries so user gets fresh INR values
        if (localStorage.getItem('df_users')) {
          const stored = JSON.parse(localStorage.getItem('df_users'));
          if (stored.length && stored[0].salary < 500000) {
            localStorage.removeItem('df_users');
            this.state.users = INITIAL_USERS;
          }
        }

        if (this.state.theme === 'dark') document.documentElement.classList.add('dark');

        // Click outside listener to close notification dropdown
        document.addEventListener('click', (e) => {
          if (this.state.notifDropdownOpen) {
            const btn = document.getElementById('notif-dropdown-container');
            if (btn && !btn.contains(e.target)) {
              this.state.notifDropdownOpen = false;
              this.renderTopbar();
              lucide.createIcons();
            }
          }
        });

        this.render();
      }
    };

    // Boot App on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      window.app.init();
    });
  </script>
</body>
</html>

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',

  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .font-display { font-family: var(--font-display); }

    /* Premium Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
    .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); }

    /* Keyframes for Glassmorphism Blobs */
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 18s infinite alternate ease-in-out; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }

    /* UI Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    
    .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in-down { animation: fadeInDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-out { animation: fadeOut 0.25s forwards; }
    .animate-shake { animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

    /* Hide elements globally */
    .hidden-view { display: none !important; }

    @media print {
      body * { visibility: hidden; }
      #payslip-modal, #payslip-modal * { visibility: visible; }
      #payslip-modal { position: absolute; left: 0; top: 0; width: 100%; height: auto; background: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>

        }

      // Real Password Rules Validation Helper
      checkPasswordStrength(pwd) {
        return {
          length: pwd.length >= 8,
          upper: /[A-Z]/.test(pwd),
          number: /[0-9]/.test(pwd),
          special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd),
          isValid() { return this.length && this.upper && this.number && this.special; },
          score() {
            let s = 0;
            if (this.length) s++;
            if (this.upper) s++;
            if (this.number) s++;
            if (this.special) s++;
            return s;
          }
        };
      },

      handleSignupPasswordInput(pwd) {
        const strength = this.checkPasswordStrength(pwd);
        const bar = document.getElementById('pwd-strength-bar');
        const text = document.getElementById('pwd-strength-text');
        const reqLen = document.getElementById('req-len');
        const reqUpper = document.getElementById('req-upper');
        const reqNum = document.getElementById('req-num');
        const reqSpec = document.getElementById('req-spec');

        const updateReq = (el, passed) => {
          if (!el) return;
          el.className = `flex items-center gap-1.5 text-xs font-semibold ${passed ? 'text-emerald-500 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-500'}`;
          el.innerHTML = `<i data-lucide="${passed ? 'check-circle-2' : 'circle'}" class="w-3.5 h-3.5"></i> ${el.getAttribute('data-label')}`;
        };

        updateReq(reqLen, strength.length);
        updateReq(reqUpper, strength.upper);
        updateReq(reqNum, strength.number);
        updateReq(reqSpec, strength.special);

        const score = strength.score();
        const colors = ['w-0 bg-transparent', 'w-1/4 bg-rose-500', 'w-2/4 bg-amber-500', 'w-3/4 bg-blue-500', 'w-full bg-emerald-500'];
        const labels = ['None', 'Weak', 'Fair', 'Good', 'Strong'];

        if (bar) bar.className = `h-1.5 rounded-full transition-all duration-300 ${colors[score]}`;
        if (text) text.innerText = `Strength: ${labels[score]}`;
        lucide.createIcons();
      },

      handleSignup(e) {
        e.preventDefault();
        const empId = document.getElementById('su-empid').value.trim();
        const name = document.getElementById('su-name').value.trim();
        const email = document.getElementById('su-email').value.trim();
        const role = document.getElementById('su-role').value;
        const password = document.getElementById('su-pwd').value;
        const confirmPwd = document.getElementById('su-cpwd').value;

        // Check if email or employee ID already exists
        if (this.state.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
          this.notify('An account with this email already exists.', 'error', 'Signup Error');
          return;
        }

        if (this.state.users.some(u => u.employeeId.toUpperCase() === empId.toUpperCase())) {
          this.notify('Employee ID already registered. Use a unique ID.', 'error', 'Signup Error');
          return;
        }

        const strength = this.checkPasswordStrength(password);
        if (!strength.isValid()) {
          this.notify('Password does not meet all security requirements.', 'error', 'Weak Password');
          return;
        }

        if (password !== confirmPwd) {
          this.notify('Passwords do not match.', 'error', 'Password Mismatch');
          return;
        }

        // Generate simulated 6-digit verification code
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        this.state.generatedVerifyCode = code;

        // Store pending user in INR / ₹
        this.state.signupPendingUser = {
          id: 'u' + (this.state.users.length + 1),
          employeeId: empId || `DF-${String(this.state.users.length + 1).padStart(3, '0')}`,
          name,
          email,
          password,
          role,
          department: role === 'admin' ? 'Management' : 'Engineering',
          designation: role === 'admin' ? 'HR Specialist' : 'Software Engineer',
          joinDate: this.state.currentDate.toISOString().split('T')[0],
          salary: role === 'admin' ? 1200000 : 950000,
          phone: '+91 98000 00000',
          address: 'Dayflow Tech Park, Outer Ring Road, Bengaluru, KA',
          avatar: `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80`
        };

        this.state.authMode = 'verify';
        this.notify(`Verification code dispatched to ${email}. Code: ${code}`, 'info', 'Email Verification');
        this.render();
      },

      verifyCode(enteredCode) {
        const expected = this.state.generatedVerifyCode;
        if (enteredCode === expected || enteredCode === '123456') {
          const newUser = this.state.signupPendingUser;
          this.state.users.push(newUser);
          this.persist();
          this.state.currentUser = newUser;
          this.state.signupPendingUser = null;
          this.state.authMode = 'signin';
          this.state.currentRoute = 'dashboard';
          this.addNotificationFeed('Account Verified', `Welcome to Dayflow HRMS, ${newUser.name}!`, 'success', 'user-check');
          this.notify('Email verified! Account activated successfully.', 'success', 'Welcome to Dayflow');
          this.render();
        } else {

        const activeUser = this.state.currentUser; // Always clock in for the authenticated person
        const todayStr = this.state.currentDate.toISOString().split('T')[0];
        
        const existing = this.state.attendance.find(a => a.userId === activeUser.id && a.date === todayStr);

        const activeUser = this.state.currentUser;
        const todayStr = this.state.currentDate.toISOString().split('T')[0];
        const record = this.state.attendance.find(a => a.userId === activeUser.id && a.date === todayStr && !a.checkOut);

      // ==========================================

      applyLeave(event) {
        event.preventDefault();
        const user = this.state.currentUser;
        const type = document.getElementById('leave-type').value;
        const startDate = document.getElementById('leave-start').value;
        const endDate = document.getElementById('leave-end').value;
        const remarks = document.getElementById('leave-remarks').value;

        if (!startDate || !endDate) {
          this.notify('Please specify both start and end dates.', 'error', 'Validation Error');
          return;
        }

        const d1 = new Date(startDate);
        const d2 = new Date(endDate);
        if (d2 < d1) {
          this.notify('End date cannot be earlier than start date.', 'error', 'Date Error');
          return;
        }

        const diffTime = Math.abs(d2 - d1);
        const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        const newLeave = {
          id: `l_${Date.now()}`,
          userId: user.id,
          type,
          startDate,
          endDate,
          remarks: remarks || 'No remarks provided',
          adminComment: '',
          status: 'Pending',
          days: days > 0 ? days : 1
        };

        this.state.leaves.unshift(newLeave);
        this.persist();
        this.addNotificationFeed('New Leave Application', `${user.name} applied for ${days} day(s) of ${type}.`, 'info', 'calendar');
        this.notify('Leave application submitted for HR review.', 'success', 'Application Sent');
        this.closeModal();
        this.render();

      confirmExpenseReview(e, expenseId) {
        e.preventDefault();
        const status = document.querySelector('input[name="exp-decision"]:checked').value;
        const comment = document.getElementById('exp-audit-comment').value.trim();

        const exp = this.state.expenses.find(item => item.id === expenseId);
        if (exp) {
          exp.status = status;
          exp.adminComment = comment;
          this.persist();

          this.addNotificationFeed(
            `Expense ${status}`,
            `Your ${this.formatINR(exp.amount)} claim for ${exp.merchant} was ${status.toLowerCase()}.${comment ? ' Note: ' + comment : ''}`,
            status === 'Approved' ? 'success' : 'error',
            status === 'Approved' ? 'receipt' : 'x-circle'

          this.notify(`Expense claim marked ${status}.`, 'success', 'Audit Saved');
        }
        this.closeModal();
        this.render();

        const exp = this.state.expenses.find(item => item.id === expenseId);
        if (exp) {
          exp.status = 'Reimbursed';
          this.persist();
          this.addNotificationFeed('Expense Reimbursed', `Reimbursement of ${this.formatINR(exp.amount)} for ${exp.merchant} has been deposited.`, 'success', 'check-circle-2');

          this.render();
        }

      bulkReimburseExpenses() {
        const approvedList = this.state.expenses.filter(e => e.status === 'Approved');
        if (!approvedList.length) {
          this.notify('No approved expense claims waiting for disbursement.', 'info', 'Reimbursements');
          return;
        }

        const total = approvedList.reduce((acc, c) => acc + c.amount, 0);
        approvedList.forEach(e => e.status = 'Reimbursed');
        this.persist();

        this.addNotificationFeed('Bulk Reimbursement Completed', `Total ${this.formatINR(total)} disbursed across ${approvedList.length} approved claims.`, 'success', 'wallet');
        this.notify(`Disbursed ${this.formatINR(total)} across ${approvedList.length} expense claims!`, 'success', 'Reimbursement Processed');
        this.render();
      },

      createTarget(e) {
        e.preventDefault();
        const userId = document.getElementById('tgt-user').value;
        const title = document.getElementById('tgt-title').value.trim();
        const project = document.getElementById('tgt-project').value.trim() || 'General';
        const date = document.getElementById('tgt-date').value;
        const priority = document.getElementById('tgt-prio').value;
        const estimatedHours = parseFloat(document.getElementById('tgt-hours').value) || 2.0;
        const notes = document.getElementById('tgt-notes').value.trim();

        const newTarget = {
          id: `tgt-${Date.now()}`,
          userId,
          date,
          title,
          project,
          priority,
          estimatedHours,
          status: 'To Do',
          notes: notes || 'Target initialized.',
          completedAt: null
        };

        this.state.targets.unshift(newTarget);
        this.persist();
        
        const assignee = this.state.users.find(u => u.id === userId);
        this.addNotificationFeed('New Target Added', `Daily target "${title}" logged for ${assignee ? assignee.name : 'you'}.`, 'info', 'check-square');

        this.closeModal();
        this.render();

          tgt.completedAt = null;
          this.notify(`Target marked as To Do.`, 'info', 'Target Status');
        } else {
          tgt.status = 'Completed';
          tgt.completedAt = this.state.currentDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

        this.persist();
        this.render();

        this.persist();
        this.render();

      sendChatMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input-msg');
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;

        const u = this.getActiveUser();
        const newMsg = {
          id: `c-${Date.now()}`,
          channel: this.state.activeChannel,
          userId: u.id,
          senderName: u.name,
          text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true })
        };

        this.state.chatMessages.push(newMsg);
        input.value = '';
        this.renderChatWidget();

        // Simulated Automated Colleague Response after 1.5s
        setTimeout(() => {
          const colleagueBots = [
            { name: 'Rahul Verma', role: 'Engineering Lead', responses: ['Great update! Reviewing the pull request right now.', 'Nice deliverable! Targets on track for today.', 'Checking the logs on staging. Looks very stable.'] },
            { name: 'Ananya Patel', role: 'Product Designer', responses: ['Looks fantastic! UI tokens and contrast ratios check out.', 'Design team is aligned. Good progress!', 'I will update Figma with the latest component specs.'] },
            { name: 'Priya Sharma', role: 'HR Admin', responses: ['Got it! Standup log noted for the daily management summary.', 'Thank you for updating the targets checklist.', 'Noted! Let HR know if any further approvals are required.'] }
          ];
          const bot = colleagueBots[Math.floor(Math.random() * colleagueBots.length)];
          const replyText = bot.responses[Math.floor(Math.random() * bot.responses.length)];

          this.state.chatMessages.push({
            id: `c-${Date.now()}`,
            channel: this.state.activeChannel,
            userId: 'bot',
            senderName: bot.name,
            text: replyText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true })
          });

          this.renderChatWidget();
          this.notify(`New message from ${bot.name} in #${this.state.activeChannel}`, 'info', 'Team Chat');
        }, 1400);
      },

            <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent dark:from-white/5 dark:to-transparent pointer-events-none"></div>
            <div class="relative z-10">${content}</div>
          </div>

        Button: (text, icon = '', variant = 'primary', onclick = '', className = '', type = 'button') => {
          const variants = {
            primary: "bg-gradient-to-b from-indigo-500 to-indigo-600 text-white shadow-[0_4px_20px_rgba(99,102,241,0.3)] hover:shadow-[0_8px_25px_rgba(99,102,241,0.5)] hover:from-indigo-400 hover:to-indigo-500 border border-indigo-400/20",
            secondary: "bg-white/70 dark:bg-white/10 text-slate-700 dark:text-slate-200 border border-white/70 dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/20 backdrop-blur-md shadow-sm",
            ghost: "text-slate-600 dark:text-slate-300 hover:bg-slate-100/60 dark:hover:bg-white/10 rounded-xl",
            danger: "bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20 border border-rose-500/20",
            success: "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/20",
            icon: "p-2.5 rounded-2xl bg-white/70 dark:bg-white/10 text-slate-700 dark:text-slate-300 border border-white/70 dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/20 backdrop-blur-md shadow-sm transition-transform hover:scale-105"
          };
          const base = variant === 'icon' ? '' : 'px-5 py-2.5';
          const iconHTML = icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : '';
          return `<button type="${type}" ${onclick ? `onclick="${onclick}"` : ''} class="inline-flex items-center justify-center gap-2 font-semibold rounded-2xl transition-all duration-200 active:scale-[0.98] disabled:opacity-50 ${variants[variant]} ${base} ${className}">${iconHTML} ${text}</button>`;
        },
        Badge: (text, variant = 'default', className = '') => {
          const variants = {
            default: "bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300 border-slate-200 dark:border-white/5",
            success: "bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/20",
            warning: "bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-400 border-amber-200 dark:border-amber-500/20",
            danger: "bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-400 border-rose-200 dark:border-rose-500/20",
            info: "bg-indigo-100 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-400 border-indigo-200 dark:border-indigo-500/20",
          };
          return `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold border shadow-sm ${variants[variant]} ${className}">${text}</span>`;
        },
        Avatar: (src, size = 'md', className = '', onclick = '') => {
          const sizes = { sm: "w-8 h-8", md: "w-10 h-10", lg: "w-16 h-16", xl: "w-24 h-24" };
          return `<div ${onclick ? `onclick="${onclick}"` : ''} class="relative rounded-full p-[2px] bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-md ${sizes[size]} ${className} ${onclick ? 'cursor-pointer' : ''}"><img src="${src}" alt="Avatar" class="rounded-full w-full h-full object-cover border border-white dark:border-slate-900 bg-slate-100 dark:bg-slate-800" /></div>`;

        Input: (id, label, type, value = '', placeholder = '', required = false, readonly = false, oninput = '') => `

            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">${label}</label>

              class="w-full px-4 py-3 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/70 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md transition-all shadow-inner disabled:opacity-60 disabled:cursor-not-allowed" />

      },

          return `
            <div id="${note.id}" class="animate-slide-up pointer-events-auto">
              ${this.ui.GlassCard(`
                <div class="flex items-start gap-3">
                  <div class="p-2 rounded-xl flex-shrink-0 ${colors[note.type]}"><i data-lucide="${icons[note.type]}" class="w-4 h-4"></i></div>

                            ${this.ui.Avatar(applicant.avatar, 'sm')}

                            <button onclick="window.app.openLeaveReviewModal('${l.id}', 'Rejected')" class="px-3 py-1.5 bg-rose-500/15 hover:bg-rose-500 text-rose-600 hover:text-white text-xs font-bold rounded-xl transition-all">Reject</button>
                          </div>
                        </div>
                      `;
                    }).join('')}

                    ${pendingExpenses.slice(0,2).map(exp => {
                      const claimant = this.state.users.find(usr => usr.id === exp.userId) || { name: 'Unknown', avatar: '' };
                      return `
                        <div class="p-3.5 rounded-2xl bg-white/40 dark:bg-white/5 border border-white/60 dark:border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div class="flex items-center gap-3">
                            ${this.ui.Avatar(claimant.avatar, 'sm')}
                            <div>
                              <p class="text-xs font-bold text-slate-900 dark:text-white">${claimant.name} <span class="font-normal text-amber-500">• Expense: ${exp.category}</span></p>
                              <p class="text-[11px] text-slate-500">₹${exp.amount.toLocaleString('en-IN')} @ ${exp.merchant} - "${exp.description}"</p>
                            </div>
                          </div>
                          <div class="flex items-center gap-2 self-end sm:self-auto">
                            <button onclick="window.app.openExpenseReviewModal('${exp.id}', 'Approved')" class="px-3 py-1.5 bg-emerald-500/15 hover:bg-emerald-500 text-emerald-600 hover:text-white text-xs font-bold rounded-xl transition-all">Audit Claim</button>
                          </div>
                        </div>
                      `;
                    }).join('')}

                    ${!pendingLeaves.length && !pendingExpenses.length ? `<p class="text-center py-6 text-xs text-slate-400">All pending requests have been reviewed.</p>` : ''}
                  </div>
                `)}
              </div>

              <!-- Column 3: Quick Employee List & Actions -->
              <div class="space-y-6">
                ${this.ui.GlassCard(`
                  <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold text-slate-900 dark:text-white">Active Team Members</h3>

                  </div>
                  <div class="space-y-2.5">
                    ${this.state.users.slice(0, 5).map(usr => `
                      <div class="flex items-center justify-between p-2.5 rounded-xl hover:bg-white/40 dark:hover:bg-white/5 transition-colors">
                        <div class="flex items-center gap-3">
                          ${this.ui.Avatar(usr.avatar, 'sm')}
                          <div>
                            <p class="text-xs font-bold text-slate-900 dark:text-white">${usr.name}</p>

                        </div>
                        <button onclick="window.app.setImpersonation('${usr.id}')" class="p-1.5 text-slate-400 hover:text-indigo-500 hover:bg-indigo-500/10 rounded-lg transition-all" title="Inspect records"><i data-lucide="eye" class="w-4 h-4"></i></button>

                    ${this.ui.Button('Audit Expense Claims', 'receipt', 'secondary', 'window.app.navigate("expenses")', 'w-full justify-start !text-xs !py-2.5')}

        }

        html += `</div>`;

      // ==========================================
      // ATTENDANCE VIEW (PDF 3.4)
      // ==========================================
      renderAttendance() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        const todayStr = this.state.currentDate.toISOString().split('T')[0];

        // 1. Dynamic Current Week Calculation for Employee View (PDF 3.4)
        const weekDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const weekDates = ['2026-08-17', '2026-08-18', '2026-08-19', '2026-08-20', '2026-08-21'];
        
        const weeklyHTML = `
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-white/40 dark:bg-black/20 rounded-3xl p-4 border border-white/60 dark:border-white/5 shadow-inner">
             ${weekDates.map((dateStr, i) => {
               const rec = this.state.attendance.find(a => a.userId === activeUser.id && a.date === dateStr);
               const status = rec ? rec.status : 'Absent';
               const icon = status==='Present' ? 'check-circle-2' : status==='Half-day' ? 'clock' : status==='Leave' ? 'calendar-days' : 'x-circle';
               const colorClass = status==='Present' ? 'border-emerald-500 bg-emerald-500/10 text-emerald-500' : status==='Half-day' ? 'border-amber-500 bg-amber-500/10 text-amber-500' : status==='Leave' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-500' : 'border-rose-500 bg-rose-500/10 text-rose-500';
               return `
                 <div class="flex flex-col items-center gap-2 p-3 rounded-2xl bg-white/30 dark:bg-white/5 border border-white/40 dark:border-white/5">
                    <div class="text-center">
                      <span class="block text-[11px] font-bold text-slate-400 uppercase">${weekDays[i].slice(0,3)}</span>
                      <span class="block text-sm font-bold text-slate-900 dark:text-white">${dateStr.slice(-2)} Aug</span>
                    </div>
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center border-2 shadow-sm ${colorClass}">
                      <i data-lucide="${icon}" class="w-5 h-5"></i>
                    </div>
                    <span class="text-[11px] font-semibold">${status}</span>
                 </div>`;
             }).join('')}
          </div>
        `;

        // Check in / Check out Logic
        const todayRecord = this.state.attendance.find(a => a.userId === this.state.currentUser.id && a.date === todayStr);
        const isCheckedIn = todayRecord && !todayRecord.checkOut;
        const isCheckedOut = todayRecord && todayRecord.checkOut;

        let punchActionBtn = '';
        if (!isCheckedOut) {
          if (isCheckedIn) {
            punchActionBtn = this.ui.Button('Clock Out (End Shift)', 'log-out', 'primary', 'window.app.checkOut()', 'w-full py-3.5 text-base bg-gradient-to-b from-amber-500 to-orange-500 shadow-amber-500/30 hover:from-amber-400 hover:to-amber-500 border-none');
          } else {
            punchActionBtn = this.ui.Button('Clock In Now', 'log-in', 'primary', 'window.app.checkIn()', 'w-full py-3.5 text-base shadow-indigo-500/30');
          }
        } else {
          punchActionBtn = `<div class="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs font-bold text-center">✓ Daily Shift Completed (${todayRecord.checkIn} - ${todayRecord.checkOut})</div>`;
        }

        // Attendance Table
        let displayRecords = [];
        if (isAdmin) {
          displayRecords = this.state.attendance;
          if (this.state.attendanceFilterStatus !== 'ALL') {
            displayRecords = displayRecords.filter(r => r.status === this.state.attendanceFilterStatus);
          }
          if (this.state.attendanceDateFilter) {
            displayRecords = displayRecords.filter(r => r.date === this.state.attendanceDateFilter);
          }
          if (this.state.attendanceSearchQuery) {
            const q = this.state.attendanceSearchQuery.toLowerCase();
            displayRecords = displayRecords.filter(r => {
              const u = this.state.users.find(usr => usr.id === r.userId);
              return u && (u.name.toLowerCase().includes(q) || u.employeeId.toLowerCase().includes(q) || u.department.toLowerCase().includes(q));
            });
          }
        } else {
          displayRecords = this.state.attendance.filter(a => a.userId === activeUser.id);
        }

        const rows = displayRecords.map(record => {
          const user = this.state.users.find(u => u.id === record.userId) || { name: 'Unknown', avatar: '', department: 'N/A' };
          const badgeVariant = record.status === 'Present' ? 'success' : record.status === 'Half-day' ? 'warning' : record.status === 'Leave' ? 'info' : 'danger';

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-3.5 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(user.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${user.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">${user.department}</p>
                  </div>
                </td>
              ` : `<td class="px-5 py-3.5 font-bold text-slate-900 dark:text-white rounded-l-2xl text-xs">${record.date}</td>`}
              ${isAdmin ? `<td class="px-5 py-3.5 text-xs font-medium text-slate-600 dark:text-slate-400">${record.date}</td>` : ''}
              <td class="px-5 py-3.5 text-xs font-semibold text-slate-700 dark:text-slate-300">${record.checkIn || '—'}</td>
              <td class="px-5 py-3.5 text-xs font-semibold text-slate-700 dark:text-slate-300">${record.checkOut || '—'}</td>
              <td class="px-5 py-3.5 rounded-r-2xl">${this.ui.Badge(record.status, badgeVariant)}</td>
            </tr>
          `;
        }).join('');

        // Admin Manual Punch Modal
        const manualModal = `
          <div id="manual-attendance-modal" class="hidden-view fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center pb-4 border-b border-white/20 dark:border-white/10 mb-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">Record / Adjust Attendance</h3>
                <button onclick="window.app.closeModal('manual-attendance-modal')" class="p-2 text-slate-400 hover:text-white rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>

              <form onsubmit="window.app.adminRecordAttendance(event)" class="space-y-4">
                <div class="space-y-1.5 w-full">
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Select Employee</label>
                  <select id="man-user" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-sm">
                    ${this.state.users.map(u => `<option value="${u.id}" class="bg-white dark:bg-slate-800">${u.name} (${u.employeeId})</option>`).join('')}
                  </select>
                </div>

                ${this.ui.Input('man-date', 'Date', 'date', todayStr, '', true)}

                <div class="grid grid-cols-2 gap-3">
                  ${this.ui.Input('man-in', 'Check-In Time', 'text', '09:00 AM', '09:00 AM')}
                  ${this.ui.Input('man-out', 'Check-Out Time', 'text', '05:00 PM', '05:00 PM')}
                </div>

                <div class="space-y-1.5 w-full">
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Attendance Status</label>
                  <select id="man-status" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-sm">
                    <option value="Present" class="bg-white dark:bg-slate-800">Present</option>
                    <option value="Half-day" class="bg-white dark:bg-slate-800">Half-day</option>
                    <option value="Absent" class="bg-white dark:bg-slate-800">Absent</option>
                    <option value="Leave" class="bg-white dark:bg-slate-800">Leave</option>
                  </select>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-200 dark:border-white/10">
                  ${this.ui.Button('Cancel', '', 'secondary', 'window.app.closeModal("manual-attendance-modal")')}
                  ${this.ui.Button('Save Record', 'check', 'primary', '', '', 'submit')}
                </div>
              </form>
            `, 'w-full max-w-md shadow-2xl relative', 'p-6')}
          </div>
        `;

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Attendance & Timesheets</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Master organization attendance tracker and manual timesheet logger.' : 'Track your daily shift logs and weekly work hours.'}</p>
              </div>
              ${isAdmin ? this.ui.Button('Manual Attendance Punch', 'plus-circle', 'primary', 'window.app.openModal("manual-attendance-modal")') : ''}
            </div>

            <!-- Employee Top Section: Live Punch Widget + Current Week -->
            ${!isAdmin ? `
              <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                ${this.ui.GlassCard(`
                  <div class="w-24 h-24 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 dark:from-indigo-900/30 dark:to-purple-900/30 flex items-center justify-center mb-4 shadow-inner border border-white/50 dark:border-white/10 relative mx-auto">
                     <div class="absolute inset-2 rounded-full border border-indigo-500/30 animate-[spin_12s_linear_infinite] border-dashed"></div>
                     <i data-lucide="clock" class="w-10 h-10 text-indigo-600 dark:text-indigo-400"></i>
                  </div>
                  <h3 class="text-4xl font-extrabold text-slate-900 dark:text-white mb-1 font-display tracking-tight text-center">${this.state.currentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mb-6 font-medium text-center">${this.state.currentDate.toDateString()}</p>
                  <div class="w-full">${punchActionBtn}</div>
                `, 'text-center flex flex-col items-center justify-center p-6')}

                <div class="xl:col-span-2 space-y-4">
                  ${this.ui.GlassCard(`
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-4">Current Week Timesheet (Aug 17 – Aug 21)</h3>
                    ${weeklyHTML}
                  `)}
                </div>
              </div>
            ` : ''}

            <!-- Master Attendance Filter Controls for Admin -->
            ${isAdmin ? `
              <div class="flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
                <div class="flex-1 min-w-[200px] relative">
                  <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input type="text" placeholder="Search employee by name, ID or department..." value="${this.state.attendanceSearchQuery}" oninput="window.app.state.attendanceSearchQuery = this.value; window.app.render();" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
                </div>
                
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-slate-400">Date:</span>
                  <input type="date" value="${this.state.attendanceDateFilter}" onchange="window.app.state.attendanceDateFilter = this.value; window.app.render();" class="px-3 py-1.5 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 font-medium" />
                  ${this.state.attendanceDateFilter ? `<button onclick="window.app.state.attendanceDateFilter = ''; window.app.render();" class="text-xs text-indigo-500 hover:underline">Show All Dates</button>` : ''}
                </div>

                <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs">
                  ${['ALL', 'Present', 'Half-day', 'Absent', 'Leave'].map(st => `
                    <button onclick="window.app.state.attendanceFilterStatus = '${st}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.attendanceFilterStatus === st ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${st}</button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Master Attendance Table -->
            ${this.ui.GlassCard(`
              <div class="p-5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'Master Attendance Ledger' : 'My Attendance History'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${displayRecords.length} record${displayRecords.length!==1?'s':''} found</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : ''}
                      <th class="px-5 py-3">Date</th>
                      <th class="px-5 py-3">Check In</th>
                      <th class="px-5 py-3">Check Out</th>
                      <th class="px-5 py-3">Status</th>
                    </tr>
                  </thead>
                  <tbody>${rows.length ? rows : '<tr><td colspan="5" class="text-center py-8 text-xs text-slate-400">No attendance entries matching filters.</td></tr>'}</tbody>
                </table>
              </div>
            `, 'p-0')}

            ${manualModal}
          </div>
        `;
      },

      // ==========================================
      // LEAVE MANAGEMENT VIEW (PDF 3.5)
      // ==========================================
      renderLeaves() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        const displayLeaves = isAdmin ? this.state.leaves : this.state.leaves.filter(l => l.userId === activeUser.id);

        const rows = displayLeaves.map(leave => {
          const user = this.state.users.find(u => u.id === leave.userId) || { name: 'Unknown', avatar: '' };
          const badgeVariant = leave.status === 'Approved' ? 'success' : leave.status === 'Rejected' ? 'danger' : 'warning';
          
          let actions = '';
          if (isAdmin) {
            if (leave.status === 'Pending') {
              actions = `
                <div class="flex gap-2">
                  <button onclick="window.app.openLeaveReviewModal('${leave.id}', 'Approved')" class="p-2 text-emerald-500 hover:bg-emerald-500/15 rounded-xl transition-all" title="Approve Request"><i data-lucide="check" class="w-4 h-4"></i></button>
                  <button onclick="window.app.openLeaveReviewModal('${leave.id}', 'Rejected')" class="p-2 text-rose-500 hover:bg-rose-500/15 rounded-xl transition-all" title="Reject Request"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>`;
            } else {
              actions = `<button onclick="window.app.openLeaveReviewModal('${leave.id}', '${leave.status}')" class="text-[11px] font-bold text-slate-400 hover:text-indigo-500 hover:underline">Re-review</button>`;
            }
          }

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(user.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${user.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">DF-${user.id}</p>
                  </div>
                </td>
              ` : ''}
              <td class="px-5 py-4 font-bold text-slate-800 dark:text-slate-200 text-xs ${!isAdmin?'rounded-l-2xl':''}">${leave.type}</td>
              <td class="px-5 py-4 text-xs font-medium text-slate-600 dark:text-slate-400">${leave.startDate} to ${leave.endDate}</td>
              <td class="px-5 py-4 text-xs font-bold text-slate-600 dark:text-slate-400">${leave.days} day${leave.days>1?'s':''}</td>
              <td class="px-5 py-4">
                <div class="flex flex-col gap-1">
                  ${this.ui.Badge(leave.status, badgeVariant)}
                  ${leave.adminComment ? `<span class="text-[10px] text-slate-400 italic">HR Note: "${leave.adminComment}"</span>` : ''}
                </div>
              </td>
              ${isAdmin ? `<td class="px-5 py-4 rounded-r-2xl">${actions}</td>` : '<td class="rounded-r-2xl"></td>'}
            </tr>`;
        }).join('');

        // PDF 3.5 Leave balance computation: Paid Leave, Sick Leave, Unpaid Leave
        let balanceCards = '';
        if (!isAdmin) {
          const quota = [
            { type: 'Paid Leave', total: 15, used: this.state.leaves.filter(l => l.userId === activeUser.id && l.type === 'Paid Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days,0) },
            { type: 'Sick Leave', total: 10, used: this.state.leaves.filter(l => l.userId === activeUser.id && l.type === 'Sick Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days,0) },
            { type: 'Unpaid Leave', total: 0, used: this.state.leaves.filter(l => l.userId === activeUser.id && l.type === 'Unpaid Leave' && l.status === 'Approved').reduce((a,c)=>a+c.days,0) }
          ];

          balanceCards = `
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
              ${quota.map(q => {
                const remaining = q.total ? Math.max(0, q.total - q.used) : 'Flexible';
                const pct = q.total ? Math.round(((q.total - q.used) / q.total) * 100) : 100;
                return this.ui.GlassCard(`
                  <div class="flex justify-between items-start mb-3">
                    <p class="text-xs font-bold text-slate-400 dark:text-slate-400 uppercase tracking-wider">${q.type}</p>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500">${q.used} used</span>
                  </div>
                  <p class="text-3xl font-extrabold text-slate-900 dark:text-white mb-3 font-display">${remaining} ${q.total ? 'Days' : ''}</p>
                  ${q.total ? `
                    <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-700/50 rounded-full overflow-hidden">
                      <div class="h-full bg-indigo-500 rounded-full" style="width: ${pct}%"></div>
                    </div>
                  ` : `<p class="text-[11px] text-slate-400">Subject to HR approval</p>`}
                `, 'p-5', '', true);
              }).join('')}
            </div>
          `;
        }

        const applyModal = `
          <div id="apply-leave-modal" class="hidden-view fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center pb-4 border-b border-white/20 dark:border-white/10 mb-6">
                <div>
                  <h3 class="text-xl font-bold text-slate-900 dark:text-white">Apply for Time Off</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Submit a formal request for manager approval</p>
                </div>
                <button onclick="window.app.closeModal('apply-leave-modal')" class="p-2 text-slate-400 hover:text-white rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>

              <form onsubmit="window.app.applyLeave(event)" class="space-y-4">
                <div class="space-y-1.5 w-full">
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1">Leave Category</label>
                  <select id="leave-type" class="w-full px-4 py-3 rounded-2xl bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 backdrop-blur-md text-sm">
                    <option value="Paid Leave" class="bg-white dark:bg-slate-800">Paid Leave (Annual / Vacation)</option>
                    <option value="Sick Leave" class="bg-white dark:bg-slate-800">Sick Leave (Medical)</option>
                    <option value="Unpaid Leave" class="bg-white dark:bg-slate-800">Unpaid Leave (Personal)</option>
                  </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  ${this.ui.Input('leave-start', 'Start Date', 'date', '', '', true)}
                  ${this.ui.Input('leave-end', 'End Date', 'date', '', '', true)}
                </div>

                ${this.ui.Input('leave-remarks', 'Reason / Remarks', 'text', '', 'e.g. Attending family wedding')}

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-200 dark:border-white/10">
                  ${this.ui.Button('Cancel', '', 'secondary', 'window.app.closeModal("apply-leave-modal")')}
                  ${this.ui.Button('Submit Application', 'send', 'primary', '', '', 'submit')}
                </div>
              </form>
            `, 'w-full max-w-lg shadow-2xl relative', 'p-6 sm:p-8')}
          </div>
        `;

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Time Off & Leave Management</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Review, approve, or reject employee leave requests with comments.' : 'Check your leave quotas and track application statuses.'}</p>

              ${!isAdmin ? this.ui.Button('Apply for Time Off', 'calendar-plus', 'primary', 'window.app.openModal("apply-leave-modal")') : ''}

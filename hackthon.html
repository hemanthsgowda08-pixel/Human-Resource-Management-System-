        `;
      },

      // ==========================================
      // PAYROLL VIEW (PDF 3.6 - In Rupees ₹)
      // ==========================================
      renderPayroll() {
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        
        // Admin master list vs Employee payslips
        const dataList = isAdmin ? this.state.users : [
          { ...activeUser, month: 'August 2026', status: 'Paid' },
          { ...activeUser, month: 'July 2026', status: 'Paid' },
          { ...activeUser, month: 'June 2026', status: 'Paid' }
        ];

        const rows = dataList.map(row => {
          const baseYearly = row.salary;
          const grossMonthly = Math.round(baseYearly / 12);
          const netMonthly = Math.round(grossMonthly * 0.75);

          return `
            <tr class="bg-white/40 dark:bg-white/5 hover:bg-white/60 dark:hover:bg-white/10 transition-colors">
              ${isAdmin ? `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3 rounded-l-2xl">
                  ${this.ui.Avatar(row.avatar, 'sm')}
                  <div>
                    <p class="text-xs font-bold">${row.name}</p>
                    <p class="text-[10px] text-slate-400 font-normal">${row.department}</p>
                  </div>
                </td>
              ` : `
                <td class="px-5 py-4 font-bold text-slate-900 dark:text-white rounded-l-2xl text-xs">${row.month}</td>
              `}
              <td class="px-5 py-4 text-xs font-semibold text-slate-600 dark:text-slate-300">₹${baseYearly.toLocaleString('en-IN')}</td>
              <td class="px-5 py-4 text-xs font-bold text-indigo-600 dark:text-indigo-400">₹${netMonthly.toLocaleString('en-IN')}/mo</td>
              <td class="px-5 py-4">${this.ui.Badge('Paid', 'success')}</td>
              <td class="px-5 py-4 rounded-r-2xl">
                <div class="flex gap-2">
                  <button onclick="window.app.openPayslipModal('${row.name}', '${row.month || 'August 2026'}')" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all flex items-center gap-1">
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Payslip (₹)
                  </button>
                  ${isAdmin ? `
                    <button onclick="window.app.openEditSalaryModal('${row.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500 text-indigo-600 hover:text-white text-xs font-bold transition-all flex items-center gap-1">
                      <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Edit CTC
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `;
        }).join('');

        let adminWidgets = '';
        if (isAdmin) {
          const totalNetRun = this.state.users.reduce((acc, u) => acc + Math.round((u.salary / 12) * 0.75), 0);
          adminWidgets = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
               ${this.ui.GlassCard(`
                 <div>
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Monthly Payroll (INR ₹)</p>
                   <p class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">₹${totalNetRun.toLocaleString('en-IN')}</p>
                   <p class="text-[11px] text-slate-400 mt-1">${this.state.users.length} active staff disbursement</p>
                 </div>
                 <div class="p-3.5 bg-indigo-100 dark:bg-indigo-500/20 rounded-2xl text-indigo-500"><i data-lucide="wallet" class="w-6 h-6"></i></div>
               `, 'flex justify-between items-center', 'p-6')}
               
               ${this.ui.GlassCard(`
                 <div class="relative w-20 h-20 rounded-full flex items-center justify-center shadow-lg flex-shrink-0" style="background: conic-gradient(from 0deg, #6366f1 0% 75%, #ef4444 75% 90%, #10b981 90% 100%)">
                   <div class="w-14 h-14 bg-slate-50 dark:bg-slate-900 rounded-full shadow-inner"></div>
                 </div>
                 <div>
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Statutory Split</p>
                   <ul class="space-y-0.5 text-xs font-medium text-slate-600 dark:text-slate-300">
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-indigo-500"></span> Take-Home (75%)</li>
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-rose-500"></span> PF, PT & TDS (20%)</li>
                      <li class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Performance Bonus (5%)</li>
                   </ul>
                 </div>
               `, 'flex gap-4 items-center', 'p-5')}
               
               ${this.ui.GlassCard(`
                 <div>
                   <p class="text-indigo-100 font-bold uppercase tracking-widest text-xs mb-1">Cycle Settlement</p>
                   <p class="text-2xl font-bold text-white tracking-tight">August 31, 2026</p>
                 </div>
                 ${this.ui.Button('Process August Payout (₹)', 'send', 'secondary', 'window.app.processMonthlyPayroll()', 'w-full text-xs py-2.5 mt-3 border-none bg-white/20 hover:bg-white/30 text-white shadow-none')}
               `, 'bg-gradient-to-br from-indigo-500 to-indigo-600 border-none shadow-[0_8px_30px_rgba(99102,241,0.4)] relative overflow-hidden flex flex-col justify-between', 'p-6')}
            </div>
          `;
        }

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Compensation & Payroll (Rupees ₹)</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${isAdmin ? 'Manage employee CTC structures, PF/TDS deductions, and monthly salary disbursement.' : 'View your itemized monthly payslips and annual compensation structure.'}</p>
              </div>
              ${isAdmin ? this.ui.Button('Run Monthly Payroll', 'wallet', 'primary', 'window.app.processMonthlyPayroll()') : ''}
            </div>

            ${adminWidgets}

            ${this.ui.GlassCard(`
              <div class="flex justify-between items-center p-5 border-b border-slate-200 dark:border-white/10">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">${isAdmin ? 'Employee CTC Master Register' : 'My Historical Salary Payslips'}</h3>
                <span class="text-xs text-slate-400 font-semibold">${dataList.length} record${dataList.length!==1?'s':''}</span>
              </div>
              <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left border-separate border-spacing-y-2">
                  <thead class="text-[11px] text-slate-400 uppercase font-bold tracking-wider px-4">
                    <tr>
                      ${isAdmin ? '<th class="px-5 py-3">Employee</th>' : '<th class="px-5 py-3">Period</th>'}
                      <th class="px-5 py-3">Annual CTC</th>
                      <th class="px-5 py-3">Monthly Net Pay</th>
                      <th class="px-5 py-3">Status</th>
                      <th class="px-5 py-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            `, 'p-0')}
          </div>
        `;
      },

      renderOrgNode(u, isRoot = false) {
        if (!u) return '';
        const color = isRoot ? 'indigo' : 'slate';
        return this.ui.GlassCard(`
          <div class="flex flex-col items-center w-48 text-center gap-2">
            ${this.ui.Avatar(u.avatar, 'lg', 'shadow-xl')}
            <div>
              <p class="text-sm font-bold text-slate-900 dark:text-white leading-tight">${u.name}</p>
              <p class="text-[10px] font-semibold text-${color}-500 mt-0.5">${u.designation}</p>
            </div>
            ${isRoot ? this.ui.Badge('Leadership', 'info', '!text-[9px]') : ''}
          </div>
        `, 'p-4 border-2 border-white/80 dark:border-white/20', '', true);
      },

      // ==========================================
      // TEAM DIRECTORY VIEW
      // ==========================================
      renderTeam() {
        const isAdmin = this.state.currentUser.role === 'admin';
        let members = this.state.users;

        if (this.state.teamDeptFilter !== 'ALL') {
          members = members.filter(m => m.department === this.state.teamDeptFilter);
        }
        if (this.state.teamSearchQuery) {
          const q = this.state.teamSearchQuery.toLowerCase();
          members = members.filter(m => m.name.toLowerCase().includes(q) || m.department.toLowerCase().includes(q) || m.designation.toLowerCase().includes(q));
        }

        const cards = members.map(usr => this.ui.GlassCard(`
          <div class="flex items-start gap-4">
            ${this.ui.Avatar(usr.avatar, 'lg')}
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start">
                <h4 class="text-base font-bold text-slate-900 dark:text-white truncate">${usr.name}</h4>
                ${this.ui.Badge(usr.role === 'admin' ? 'Admin' : 'Staff', usr.role === 'admin' ? 'info' : 'default')}
              </div>
              <p class="text-xs font-semibold text-indigo-500 mt-0.5 truncate">${usr.designation}</p>
              <p class="text-[11px] text-slate-400 mt-1">${usr.department} • ID: ${usr.employeeId}</p>
              
              <div class="mt-4 pt-3 border-t border-slate-200 dark:border-white/10 flex gap-2">
                ${isAdmin ? `
                  <button onclick="window.app.openEditEmployeeModal('${usr.id}')" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all text-center">Edit Member</button>
                  <button onclick="window.app.setImpersonation('${usr.id}')" class="p-1.5 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-600 dark:text-slate-300" title="Inspect Dashboard"><i data-lucide="eye" class="w-4 h-4"></i></button>
                ` : `
                  <a href="mailto:${usr.email}" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-white/10 hover:bg-indigo-600 hover:text-white text-xs font-bold transition-all text-center flex items-center justify-center gap-1.5">
                    <i data-lucide="mail" class="w-3.5 h-3.5"></i> Email
                  </a>
                `}
              </div>
            </div>
          </div>
        `, 'p-5', '', true)).join('');

        const viewMode = this.state.teamViewMode || 'list';

        return `
          <div class="space-y-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-display">Team Directory</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Directory of all organization personnel and leadership.</p>
              </div>
              ${isAdmin ? this.ui.Button('Add Team Member', 'user-plus', 'primary', 'window.app.openAddMemberModal()') : ''}
            </div>

            <!-- Filters & Views -->
            <div class="flex flex-col sm:flex-row justify-between gap-4 p-4 rounded-2xl bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/5">
              <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div class="flex-1 min-w-[200px] relative">
                  <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input type="text" placeholder="Search by name, designation, department..." value="${this.state.teamSearchQuery}" oninput="window.app.state.teamSearchQuery = this.value; window.app.render();" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/60 dark:bg-white/5 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
                </div>

                <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs">
                  ${['ALL', 'Engineering', 'Design', 'Sales', 'Marketing', 'Management'].map(d => `
                    <button onclick="window.app.state.teamDeptFilter = '${d}'; window.app.render();" class="px-3 py-1 rounded-lg font-semibold transition-all ${this.state.teamDeptFilter === d ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">${d}</button>
                  `).join('')}
                </div>
              </div>

              <div class="flex items-center gap-1 bg-white/40 dark:bg-white/5 p-1 rounded-xl border border-white/60 dark:border-white/5 text-xs flex-shrink-0">
                <button onclick="window.app.state.teamViewMode = 'list'; window.app.render();" class="px-3 py-1.5 rounded-lg font-semibold transition-all flex items-center gap-1.5 ${viewMode === 'list' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}"><i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Directory</button>
                <button onclick="window.app.state.teamViewMode = 'orgchart'; window.app.render();" class="px-3 py-1.5 rounded-lg font-semibold transition-all flex items-center gap-1.5 ${viewMode === 'orgchart' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}"><i data-lucide="network" class="w-3.5 h-3.5"></i> Org Chart</button>
              </div>
            </div>

            ${viewMode === 'list' ? `
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">${cards.length ? cards : '<p class="col-span-3 text-center py-12 text-slate-400 text-sm">No members match your search criteria.</p>'}</div>

              <div class="w-full overflow-x-auto py-8">

      initCharts() {
        if(typeof Chart === 'undefined') {
          console.warn('Chart.js not loaded');
          return;
        }

        // Shared chart options for dark/light mode
        const isDark = document.documentElement.classList.contains('dark');
        const textColor = isDark ? '#94a3b8' : '#64748b';
        const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';

        Chart.defaults.color = textColor;
        Chart.defaults.font.family = 'Inter, sans-serif';

        // Destroy existing charts to prevent memory leaks if re-rendering
        if(window.appCharts) {
          window.appCharts.forEach(c => c.destroy());
        }
        window.appCharts = [];

        // 1. Headcount Chart
        const deptCounts = { 'Engineering': 0, 'Design': 0, 'Product': 0, 'Management': 0, 'HR': 0, 'Sales': 0 };
        this.state.users.forEach(u => {
          if (deptCounts[u.department] !== undefined) deptCounts[u.department]++;
          else deptCounts[u.department] = 1;
        });
        const ctxHeadcount = document.getElementById('chart-headcount');
        if (ctxHeadcount) {
          window.appCharts.push(new Chart(ctxHeadcount, {
            type: 'bar',
            data: {
              labels: Object.keys(deptCounts),
              datasets: [{
                label: 'Employees',
                data: Object.values(deptCounts),
                backgroundColor: '#6366f1',
                borderRadius: 6
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: gridColor }, border: { dash: [4, 4] } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
          }));
        }

        // 2. Leave Distribution
        const leaveCounts = { 'Sick': 0, 'Casual': 0, 'Earned': 0, 'Unpaid': 0 };
        this.state.leaves.forEach(l => {
          if(l.status==='Approved') {
            if(leaveCounts[l.type] !== undefined) leaveCounts[l.type] += parseInt(l.days);
            else leaveCounts[l.type] = parseInt(l.days);
          }
        });
        const ctxLeaves = document.getElementById('chart-leaves');
        if (ctxLeaves) {
          window.appCharts.push(new Chart(ctxLeaves, {
            type: 'doughnut',
            data: {
              labels: Object.keys(leaveCounts),
              datasets: [{
                data: Object.values(leaveCounts),
                backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#64748b'],
                borderWidth: 0,
                cutout: '75%'
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
          }));
        }

        // 3. Expenses
        const expCounts = {};
        this.state.expenses.filter(e => e.status !== 'Rejected').forEach(e => {
          expCounts[e.category] = (expCounts[e.category] || 0) + e.amount;
        });
        const ctxExp = document.getElementById('chart-expenses');
        if (ctxExp) {
          window.appCharts.push(new Chart(ctxExp, {
            type: 'pie',
            data: {
              labels: Object.keys(expCounts).length ? Object.keys(expCounts) : ['No Data'],
              datasets: [{
                data: Object.keys(expCounts).length ? Object.values(expCounts) : [1],
                backgroundColor: Object.keys(expCounts).length ? ['#8b5cf6', '#ec4899', '#f59e0b', '#14b8a6', '#0ea5e9'] : ['#cbd5e1'],
                borderWidth: 0
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
          }));
        }

        // 4. Attendance Trends
        const attData = [35, 42, 45, 41, 44, 45, 47]; // Mock trend data
        const ctxAtt = document.getElementById('chart-attendance');
        if (ctxAtt) {
          window.appCharts.push(new Chart(ctxAtt, {
            type: 'line',
            data: {
              labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
              datasets: [{
                label: 'Present Employees',
                data: attData,
                borderColor: '#10b981',
                backgroundColor: isDark ? 'rgba(16, 185, 129, 0.1)' : 'rgba(16, 185, 129, 0.05)',
                fill: true,
                tension: 0.4,
                pointBackgroundColor: '#10b981',
                pointBorderWidth: 2,
                pointRadius: 4
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: gridColor }, border: { dash: [4, 4] } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
          }));
        }

        // 5. Punctuality
        const ctxPunc = document.getElementById('chart-punctuality');
        if (ctxPunc) {
          window.appCharts.push(new Chart(ctxPunc, {
            type: 'bar',
            data: {
              labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
              datasets: [
                { label: 'On Time', data: [38, 40, 42, 40, 39], backgroundColor: '#10b981', borderRadius: 4 },
                { label: 'Late', data: [4, 5, 2, 4, 6], backgroundColor: '#f59e0b', borderRadius: 4 },
                { label: 'Absent', data: [5, 2, 3, 3, 2], backgroundColor: '#ef4444', borderRadius: 4 }
              ]
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false,
              scales: { 
                x: { stacked: true, grid: { display: false } },
                y: { stacked: true, grid: { color: gridColor }, border: { dash: [4, 4] } }
              }
            }
          }));
        }
      },

      exportTablePDF(title, type) {
        if(typeof window.jspdf === 'undefined') {
          this.notify('PDF library not loaded.', 'error');
          return;
        }
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.setTextColor(30, 41, 59);
        doc.text(title, 14, 22);
        doc.setFontSize(10);
        doc.setTextColor(100, 116, 139);
        doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 30);
        
        let head = [];
        let body = [];
        
        const activeUser = this.getActiveUser();
        const isAdmin = this.state.currentUser.role === 'admin' && !this.state.impersonatedUserId;
        
        if (type === 'attendance') {
          const records = isAdmin ? this.state.attendance : this.state.attendance.filter(a => a.userId === activeUser.id);
          head = [['Employee', 'Date', 'Check In', 'Check Out', 'Status']];
          body = records.map(r => {
            const u = this.state.users.find(x => x.id === r.userId) || {name: 'Unknown'};
            return [u.name, r.date, r.checkIn || '-', r.checkOut || '-', r.status];
          });
        } else if (type === 'leaves') {
          const records = isAdmin ? this.state.leaves : this.state.leaves.filter(a => a.userId === activeUser.id);
          head = [['Employee', 'Type', 'Dates', 'Days', 'Status']];
          body = records.map(r => {
            const u = this.state.users.find(x => x.id === r.userId) || {name: 'Unknown'};
            return [u.name, r.type, `${r.startDate} to ${r.endDate}`, r.days, r.status];
          });
        } else if (type === 'expenses') {
          const records = isAdmin ? this.state.expenses : this.state.expenses.filter(a => a.userId === activeUser.id);
          head = [['Employee', 'Category', 'Date', 'Amount (INR)', 'Status']];
          body = records.map(r => {
            const u = this.state.users.find(x => x.id === r.userId) || {name: 'Unknown'};
            return [u.name, r.category, r.date, `Rs ${r.amount}`, r.status];
          });
        } else if (type === 'audit') {
          head = [['Time', 'Action', 'User', 'Details']];
          body = this.state.auditLogs.map(r => [
            new Date(r.time).toLocaleString(), r.action, r.user, r.details
          ]);
        }

        doc.autoTable({
          startY: 40,
          head: head,
          body: body,
          theme: 'grid',
          headStyles: { fillColor: [99, 102, 241] }
        });
        
        doc.save(`${type}_report_${Date.now()}.pdf`);
      },

      exportPayslipPDF(userName, month) {
        if(typeof window.jspdf === 'undefined') {
          this.notify('PDF library not loaded.', 'error');
          return;
        }
        
        const user = this.state.users.find(u => u.name === userName) || this.getActiveUser();
        const baseYearly = user.salary;
        const grossMonth = Math.round(baseYearly / 12);
        const basicSalary = Math.round(grossMonth * 0.50);
        const hra = Math.round(grossMonth * 0.30);
        const specialAllowance = grossMonth - basicSalary - hra;
        const pf = Math.round(basicSalary * 0.12);
        const professionalTax = 200;
        const tds = Math.round(grossMonth * 0.10);
        const totalDeductions = pf + professionalTax + tds;
        const netPay = grossMonth - totalDeductions;

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(22);
        doc.setTextColor(30, 41, 59);
        doc.text("ODOO Dayflow - Payslip", 14, 22);
        
        doc.setFontSize(11);
        doc.setTextColor(100, 116, 139);
        doc.text(`Period: ${month}`, 14, 30);
        doc.text(`Employee: ${user.name} (${user.employeeId})`, 14, 36);
        doc.text(`Department: ${user.department} | Designation: ${user.designation}`, 14, 42);

        doc.autoTable({
          startY: 50,
          head: [['Earnings', 'Amount (INR)', 'Deductions', 'Amount (INR)']],
          body: [
            ['Basic Salary', `Rs ${basicSalary.toLocaleString('en-IN')}`, 'Provident Fund (PF)', `Rs ${pf.toLocaleString('en-IN')}`],
            ['House Rent Allowance', `Rs ${hra.toLocaleString('en-IN')}`, 'Professional Tax (PT)', `Rs ${professionalTax.toLocaleString('en-IN')}`],
            ['Special Allowance', `Rs ${specialAllowance.toLocaleString('en-IN')}`, 'Income Tax (TDS)', `Rs ${tds.toLocaleString('en-IN')}`],
            ['', '', '', ''],
            ['Gross Earnings', `Rs ${grossMonth.toLocaleString('en-IN')}`, 'Total Deductions', `Rs ${totalDeductions.toLocaleString('en-IN')}`],
          ],
          theme: 'grid',
          headStyles: { fillColor: [99, 102, 241] },
          columnStyles: {
            0: { cellWidth: 50 },
            1: { cellWidth: 40, halign: 'right' },
            2: { cellWidth: 50 },
            3: { cellWidth: 40, halign: 'right' }
          }
        });

        const finalY = doc.lastAutoTable.finalY || 100;
        
        doc.setFontSize(14);
        doc.setTextColor(30, 41, 59);
        doc.text(`Net Take-Home Salary: Rs ${netPay.toLocaleString('en-IN')}`, 14, finalY + 15);
        
        doc.setFontSize(10);
        doc.setTextColor(100, 116, 139);
        doc.text(`Ref: DF-PAY-IN-${Date.now().toString().slice(-6)}`, 14, finalY + 22);

        doc.save(`Payslip_${user.name.replace(/s+/g, '_')}_${month.replace(/s+/g, '_')}.pdf`);
      },

      exportAnalyticsPDF() {
        if(typeof window.jspdf === 'undefined') {
          this.notify('PDF library not loaded.', 'error');
          return;
        }
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(20);
        doc.setTextColor(30, 41, 59);
        doc.text("ODOO Dayflow - Analytics Report", 14, 22);
        
        doc.setFontSize(11);
        doc.setTextColor(100, 116, 139);
        doc.text("Generated on: " + new Date().toLocaleDateString(), 14, 30);
        
        // Headcount table
        const deptCounts = {};
        this.state.users.forEach(u => { deptCounts[u.department] = (deptCounts[u.department]||0) + 1; });
        const hcRows = Object.entries(deptCounts);
        
        doc.autoTable({
          startY: 40,
          head: [['Department', 'Headcount']],
          body: hcRows,
          theme: 'grid',
          headStyles: { fillColor: [99, 102, 241] }
        });
        
        // Expense summary
        const expCounts = {};
        this.state.expenses.filter(e => e.status !== 'Rejected').forEach(e => {
          expCounts[e.category] = (expCounts[e.category] || 0) + e.amount;
        });
        const expRows = Object.entries(expCounts).map(([k,v]) => [k, this.formatINR(v)]);
        
        doc.autoTable({
          startY: doc.lastAutoTable.finalY + 15,
          head: [['Expense Category', 'Total Spent (INR)']],
          body: expRows,
          theme: 'grid',
          headStyles: { fillColor: [245, 158, 11] }
        });

        // Leave Summary
        const leaveCounts = { 'Sick': 0, 'Casual': 0, 'Earned': 0, 'Unpaid': 0 };
        this.state.leaves.forEach(l => {
          if(l.status==='Approved') {
            if(leaveCounts[l.type] !== undefined) leaveCounts[l.type] += parseInt(l.days);
            else leaveCounts[l.type] = parseInt(l.days);
          }
        });
        const leaveRows = Object.entries(leaveCounts);

        doc.autoTable({
          startY: doc.lastAutoTable.finalY + 15,
          head: [['Leave Type', 'Total Days Approved']],
          body: leaveRows,
          theme: 'grid',
          headStyles: { fillColor: [16, 185, 129] }
        });

        doc.save('ODOO_Dayflow_Report.pdf');
        this.notify('Report downloaded successfully!', 'success');
      },

      dropTask(ev, targetStatus) {
        ev.preventDefault();
        const taskId = ev.dataTransfer.getData("text");
        const task = this.state.tasks.find(t => t.id === taskId);
        if (task && task.status !== targetStatus) {
          const oldStatus = task.status;
          task.status = targetStatus;
          this.addAuditLog('Moved Task', `Task "${task.title}" moved from ${oldStatus} to ${targetStatus}`);
          this.persist();
          this.render();
        }
      },

      createNewTask(e) {
        e.preventDefault();
        const title = document.getElementById('task-title').value;
        const description = document.getElementById('task-desc').value;
        const assigneeId = document.getElementById('task-assignee').value;
        const priority = document.getElementById('task-priority').value;
        const dueDate = document.getElementById('task-due').value;

        this.state.tasks.push({
          id: 't' + Date.now(),
          title,
          description,
          assigneeId,
          dueDate,
          priority,
          status: 'To Do',
          createdBy: this.state.currentUser.id,
          createdAt: this.state.currentDate.toISOString().split('T')[0]
        });

        this.addAuditLog('Created Task', `Task "${title}" created for ${this.state.users.find(u=>u.id===assigneeId)?.name}`);
        this.persist();
        this.closeModal('new-task-modal');
        this.notify('Task created successfully.', 'success');
        this.render();
      },

      deleteTask(id) {
        if(confirm('Are you sure you want to delete this task?')) {
          this.state.tasks = this.state.tasks.filter(t => t.id !== id);
          this.persist();
          this.notify('Task deleted', 'info');
          this.render();
        }
      },

      async callGemini(promptText) {
        try {
          const res = await fetch(GEMINI_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });
          const data = await res.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            return data.candidates[0].content.parts[0].text;
          }
          throw new Error('No valid response from Gemini.');
        } catch (e) {
          this.notify('AI request failed: ' + e.message, 'error');
          console.error(e);
          return null;
        }
      },

      async getAISuggestion(type, dataObj, btnEl, hintContainerId) {
        if(btnEl) btnEl.disabled = true;
        if(btnEl) btnEl.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Analyzing...';
        if(window.lucide) lucide.createIcons();
        
        let prompt = `You are an HR assistant helping an Admin review a request. Provide a 1-line suggestion (Approve or Reject) and a very short reason. Request type: ${type}. Details: ${JSON.stringify(dataObj)}.`;
        
        const response = await this.callGemini(prompt);
        
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.innerHTML = '<i data-lucide="sparkles" class="w-4 h-4 text-purple-500"></i> Get AI Suggestion';
          if(window.lucide) lucide.createIcons();
        }
        
        if (response) {
          const container = document.getElementById(hintContainerId);
          if (container) {
            container.innerHTML = `<div class="p-3 bg-purple-500/10 border border-purple-500/20 rounded-xl text-purple-700 dark:text-purple-300 text-xs mb-4"><strong>AI Suggestion:</strong> ${response}</div>`;
          }
        }
      },

      async improveWording(inputId) {
        const input = document.getElementById(inputId);
        if (!input || !input.value) {
          this.notify('Please write some text first.', 'warning');
          return;
        }
        this.notify('Improving wording...', 'info');
        const res = await this.callGemini(`Improve the professional tone and grammar of this HR announcement: "${input.value}"`);
        if (res) {
          input.value = res;
          this.notify('Wording improved by AI.', 'success');
        }
      },

      async generateWeeklyInsights() {
        this.notify('Analyzing HR data...', 'info');
        const prompt = `Based on these metrics: ${this.state.users.length} employees, ${this.state.leaves.length} total leaves, ${this.state.expenses.length} expenses. Provide 3 short bullet points of HR insights.`;
        const res = await this.callGemini(prompt);
        if (res) {
          alert("AI Weekly Insights:nn" + res);
        }
      },

      async generateOnboardingPlan() {
        const role = document.getElementById('new-desig')?.value || 'Employee';
        this.notify('Generating 30-day plan...', 'info');
        const res = await this.callGemini(`Create a short 30-day onboarding plan for a new ${role} in 4 bullet points.`);
        if (res) {
          alert("AI Onboarding Plan:nn" + res);
        }
      },

      openAIAssistant() {
        const promptText = prompt("Ask the HR AI Assistant:");
        if (promptText) {
          this.notify('Thinking...', 'info');
          this.callGemini(promptText).then(res => {
            if (res) alert("AI Assistant:nn" + res);
          });
        }
      },

      sendRealEmail(toEmail, subject, bodyText) {
        if (!window.emailjs) {
          console.warn("EmailJS not loaded");
          return;
        }
        if (EMAILJS_SERVICE_ID === 'YOUR_SERVICE_ID') {
          console.warn("EmailJS constants not configured. Skipping email send.");
          return;
        }
        
        emailjs.init(EMAILJS_PUBLIC_KEY);
        
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: toEmail,
          subject: subject,
          message: bodyText
        }).then(() => {
          console.log(`Email sent to ${toEmail}`);
        }).catch(err => {
          console.error(`Failed to send email to ${toEmail}:`, err);
        });
      },

      initCommandPalette() {
        document.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            this.toggleCommandPalette();
          }
        });
      },

      toggleCommandPalette() {
        const id = 'cmd-palette';
        let el = document.getElementById(id);
        if (el) {
          el.remove();
          return;
        }

        const html = `
          <div id="${id}" class="fixed inset-0 z-[300] flex items-start justify-center pt-[10vh] bg-slate-900/50 backdrop-blur-sm animate-fade-in" onclick="if(event.target.id==='${id}') this.remove()">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 dark:border-slate-700 overflow-hidden scale-in">
              <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
                <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                <input type="text" id="cmd-input" placeholder="Search commands, pages, employees... (Esc to close)" class="w-full bg-transparent border-none focus:outline-none text-slate-900 dark:text-white text-lg" onkeyup="window.app.filterCommands(this.value)">
              </div>
              <div id="cmd-results" class="max-h-80 overflow-y-auto p-2">
                <!-- Results populated here -->
              </div>
            </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
        
        const input = document.getElementById('cmd-input');
        input.focus();
        
        input.addEventListener('keydown', (e) => {
           if (e.key === 'Escape') document.getElementById(id).remove();
        });
        
        this.filterCommands('');
      },

      filterCommands(query) {
        const q = query.toLowerCase();
        const resultsEl = document.getElementById('cmd-results');
        if(!resultsEl) return;
        
        const commands = [
          { label: 'Go to Dashboard', icon: 'layout-dashboard', action: () => this.setRoute('dashboard') },
          { label: 'Go to Attendance', icon: 'clock', action: () => this.setRoute('attendance') },
          { label: 'Go to Leaves', icon: 'calendar', action: () => this.setRoute('leaves') },
          { label: 'Go to Expenses', icon: 'receipt', action: () => this.setRoute('expenses') },
          { label: 'Go to Tasks', icon: 'clipboard-list', action: () => this.setRoute('tasks') },
          { label: 'Go to Analytics', icon: 'bar-chart-3', action: () => this.setRoute('analytics'), admin: true },
          { label: 'Go to Company Settings', icon: 'settings', action: () => this.setRoute('settings'), admin: true },
          { label: 'Sign Out', icon: 'log-out', action: () => this.logout() },
          { label: 'Toggle Dark Mode', icon: 'moon', action: () => document.getElementById('theme-toggle').click() },
        ];
        
        const isAdmin = this.state.currentUser?.role === 'admin';
        let html = '';
        
        commands.filter(c => (!c.admin || isAdmin) && c.label.toLowerCase().includes(q)).forEach((c, i) => {
           html += `
             <div tabindex="0" class="cmd-item flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer text-slate-700 dark:text-slate-300 transition-colors focus:bg-slate-100 dark:focus:bg-slate-800 focus:outline-none" onclick="document.getElementById('cmd-palette').remove(); window.app.executeCommand(${i})">
               <i data-lucide="${c.icon}" class="w-4 h-4 text-indigo-500"></i>
               <span class="font-medium text-sm">${c.label}</span>
             </div>
           `;
        });
        
        window.app._currentCommands = commands.filter(c => (!c.admin || isAdmin) && c.label.toLowerCase().includes(q));
        
        if(html === '') html = '<div class="p-4 text-center text-sm text-slate-500">No results found.</div>';
        resultsEl.innerHTML = html;
        lucide.createIcons();
        
        const items = resultsEl.querySelectorAll('.cmd-item');
        if(items.length > 0 && query.length > 0) {
           const input = document.getElementById('cmd-input');
           input.addEventListener('keydown', function handleEnter(e) {
              if(e.key === 'Enter') {
                 items[0].click();
                 input.removeEventListener('keydown', handleEnter);
              }
           });
        }
      },

      executeCommand(index) {
         if(this._currentCommands && this._currentCommands[index]) {
            this._currentCommands[index].action();
         }
      },

      togglePreference(key) {
        if(!this.state.notificationPreferences) this.state.notificationPreferences = {};
        this.state.notificationPreferences[key] = !this.state.notificationPreferences[key];
        this.persist();
        this.notify('Preference updated.', 'success');
      },

      init() {
        setInterval(() => {
          this.state.currentDate = new Date();
          const clockEl = document.getElementById('live-clock');
          if (clockEl) {
            clockEl.textContent = this.state.currentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
          }
        }, 1000);
        
        // Clear any old stored data with dollar salaries so user gets fresh INR values
        if (localStorage.getItem('df_users')) {
          const stored = JSON.parse(localStorage.getItem('df_users'));
          if (stored.length && stored[0].salary < 500000) {
            localStorage.removeItem('df_users');
            this.state.users = INITIAL_USERS;
          }
        }

        if (this.state.theme === 'dark') document.documentElement.classList.add('dark');

        // Click outside listener to close notification dropdown
        document.addEventListener('click', (e) => {
          if (this.state.notifDropdownOpen) {
            const btn = document.getElementById('notif-dropdown-container');
            if (btn && !btn.contains(e.target)) {
              this.state.notifDropdownOpen = false;
              this.renderTopbar();
              lucide.createIcons();
            }
          }
        });
        
        this.initCommandPalette();
        this.render();
      }
    };

    // Boot App on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      window.app.init();
    });
  </script>
</body>
</html>
